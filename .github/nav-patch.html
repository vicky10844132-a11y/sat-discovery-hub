<!-- CLEAN_NAVIGATION_FIX_START -->
<style id="clean-navigation-fix-style">
:root{--ds-rail-width:86px}
.app{grid-template-columns:var(--ds-rail-width) 336px minmax(0,1fr)!important}
.app.v11-order-full,.app.account-center-workspace{grid-template-columns:var(--ds-rail-width) minmax(0,1fr) 0!important}
.brand{width:calc(var(--ds-rail-width) + 336px)!important}
.coordinate-search{display:none!important}
.top-actions>:not(.v11-auth-actions){display:none!important}
.top-actions .v11-auth-actions{display:flex!important;align-items:center!important;gap:7px!important}
.top-actions .v11-auth-actions>:not(#v11LoginBtn):not(#v11LogoutBtn){display:none!important}
.top-actions #v11LoginBtn,.top-actions #v11LogoutBtn{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-width:68px!important}
.rail{align-items:stretch!important;padding:8px 6px!important;overflow-x:hidden!important;overflow-y:auto!important}
.rail::-webkit-scrollbar{width:0}
.rail-btn{width:72px!important;height:58px!important;min-height:58px!important;margin:2px auto!important;padding:5px 3px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:5px!important;line-height:1!important}
.rail-btn .ds-icon{width:19px!important;height:19px!important;flex:0 0 19px!important}
.rail-btn .tip{position:static!important;left:auto!important;display:block!important;width:100%!important;min-height:15px!important;padding:0!important;background:transparent!important;color:inherit!important;border-radius:0!important;box-shadow:none!important;opacity:1!important;transform:none!important;white-space:normal!important;text-align:center!important;font-size:7px!important;font-weight:700!important;line-height:1.12!important;pointer-events:none!important}
.rail-btn:hover .tip{opacity:1!important;transform:none!important}
.rail-btn.active:before{left:-6px!important;height:34px!important}
.rail-bottom{width:100%!important;margin-top:auto!important;display:flex!important;flex-direction:column!important;align-items:center!important}
.rail .rail-btn[data-panel="orders"] .tip:after,.rail .rail-btn[data-panel="data"] .tip:after{content:none!important;display:none!important}
@media(max-height:700px){.rail-btn{height:52px!important;min-height:52px!important;gap:3px!important}.rail-btn .tip{font-size:6.5px!important}}
</style>
<script id="clean-navigation-fix-script">
(function(){
  function setLabel(button,label){
    if(!button)return;
    button.title=label;
    button.setAttribute('aria-label',label);
    var tip=button.querySelector('.tip');
    if(!tip){
      tip=document.createElement('span');
      tip.className='tip';
      button.appendChild(tip);
    }
    tip.textContent=label;
  }

  function setActive(button){
    document.querySelectorAll('.rail .rail-btn').forEach(function(item){item.classList.remove('active');});
    if(button)button.classList.add('active');
  }

  function activatePanel(name,button){
    document.querySelectorAll('.panel-view').forEach(function(panel){panel.classList.remove('active');});
    var target=document.getElementById('panel-'+name);
    if(target)target.classList.add('active');

    var app=document.querySelector('.app');
    if(app){
      app.classList.toggle('account-center-workspace',name==='account');
      app.classList.toggle('v11-order-full',name==='orders');
      app.classList.remove('v11-order-api');
    }

    var catalog=document.getElementById('catalogStage');
    var clientApi=document.getElementById('customerApiStage');
    if(catalog)catalog.classList.remove('show');
    if(clientApi)clientApi.classList.remove('show');

    if(name==='orbit'&&typeof window.initOrbitPanel==='function')window.initOrbitPanel();
    if(name==='orders'&&typeof window.openOrderTab==='function')window.openOrderTab('orders');
    if(name==='data'&&typeof window.openDataTab==='function')window.openDataTab('sources');

    setActive(button);
    if(name!=='account'&&name!=='orders'&&window.map&&typeof window.map.invalidateSize==='function'){
      setTimeout(function(){window.map.invalidateSize();},80);
    }
  }

  function activateSearch(tab,button){
    activatePanel('search',button);
    try{if(typeof window.setSearchTab==='function')window.setSearchTab(tab);}catch(error){}
    var tabs=document.querySelector('#panel-search .tabs');
    if(!tabs)return;
    var aoiTab=tabs.querySelector('[data-tab="aoi"]');
    var archiveTab=tabs.querySelector('[data-tab="archive"]');
    if(tab==='aoi'){
      tabs.style.display='none';
    }else{
      tabs.style.display='flex';
      if(aoiTab)aoiTab.style.display='none';
      if(archiveTab){archiveTab.style.display='';archiveTab.textContent='Archive Search';}
    }
  }

  function openSettingsDirect(){
    try{
      if(typeof window.openPlatformSettings==='function')window.openPlatformSettings('help');
    }catch(error){}
    setTimeout(function(){
      var modal=document.getElementById('platformSettingsModal');
      if(modal)modal.classList.add('show');
      document.querySelectorAll('#platformSettingsTabs [data-v9-settings]').forEach(function(tab){
        tab.classList.toggle('active',tab.dataset.v9Settings==='identity');
      });
      document.querySelectorAll('#platformSettingsModal [data-v9-pane]').forEach(function(pane){
        pane.classList.toggle('active',pane.dataset.v9Pane==='identity');
      });
      var save=document.getElementById('v9SaveSettingsBtn');
      if(save)save.style.display='inline-block';
    },0);
  }

  function switchLanguage(){
    var original=document.getElementById('languageToggle');
    if(original){original.click();return;}
    document.documentElement.lang=document.documentElement.lang==='zh-CN'?'en':'zh-CN';
  }

  function ensureSplitButtons(rail){
    var aoi=rail.querySelector('[data-ds-module="aoi"]');
    var archive=rail.querySelector('[data-ds-module="archive"]');
    var search=rail.querySelector('.rail-btn[data-panel="search"]');
    if((!aoi||!archive)&&search){
      aoi=search.cloneNode(true);
      archive=search.cloneNode(true);
      aoi.removeAttribute('data-panel');
      archive.removeAttribute('data-panel');
      aoi.dataset.dsModule='aoi';
      archive.dataset.dsModule='archive';
      rail.insertBefore(aoi,search);
      rail.insertBefore(archive,search);
      search.remove();
    }
    return {aoi:aoi,archive:archive};
  }

  function normalize(){
    var topWindow=document.querySelector('.coordinate-search');
    if(topWindow)topWindow.remove();

    var rail=document.querySelector('.rail');
    if(!rail)return;
    var split=ensureSplitButtons(rail);
    var tasking=rail.querySelector('.rail-btn[data-panel="orbit"]');
    var order=rail.querySelector('.rail-btn[data-panel="orders"]');
    var account=rail.querySelector('.rail-btn[data-panel="account"]');
    var data=rail.querySelector('.rail-btn[data-panel="data"]');

    setLabel(split.aoi,'AOI');
    setLabel(split.archive,'Archive Search');
    setLabel(tasking,'Tasking');
    setLabel(order,'Order');
    setLabel(account,'Account');
    setLabel(data,'Data');

    var taskTitle=document.querySelector('#panel-orbit .panel-title');
    if(taskTitle)taskTitle.textContent='Tasking';

    var bottom=rail.querySelector('.rail-bottom');
    if(!bottom){
      bottom=document.createElement('div');
      bottom.className='rail-bottom';
      rail.appendChild(bottom);
    }
    var bottomButtons=Array.from(bottom.querySelectorAll('.rail-btn'));
    var language=bottomButtons.find(function(button){
      var text=((button.querySelector('.tip')||{}).textContent||button.title||'').trim();
      return /language/i.test(text);
    });
    var settings=bottomButtons.find(function(button){
      var text=((button.querySelector('.tip')||{}).textContent||button.title||'').trim();
      return /support|settings|help/i.test(text);
    });
    var alerts=bottom.querySelector('#globalOrderNotify');

    if(language){language.dataset.navAction='language';setLabel(language,'Language');}
    if(settings){settings.dataset.navAction='settings';setLabel(settings,'Settings');}
    if(alerts)alerts.dataset.navAction='alerts';
    if(data){
      setLabel(data,'Data');
      if(settings&&data.nextElementSibling!==settings)bottom.insertBefore(data,settings);
      else if(!settings&&!bottom.contains(data))bottom.appendChild(data);
    }
  }

  function handleNavigation(event){
    var button=event.target.closest('.rail .rail-btn');
    if(!button)return;

    var isHandled=
      button.matches('[data-ds-module="aoi"]')||
      button.matches('[data-ds-module="archive"]')||
      button.dataset.panel==='orbit'||
      button.dataset.panel==='orders'||
      button.dataset.panel==='account'||
      button.dataset.panel==='data'||
      button.dataset.navAction==='alerts'||
      button.dataset.navAction==='settings'||
      button.dataset.navAction==='language';
    if(!isHandled)return;

    event.preventDefault();
    event.stopImmediatePropagation();

    if(button.matches('[data-ds-module="aoi"]'))return activateSearch('aoi',button);
    if(button.matches('[data-ds-module="archive"]'))return activateSearch('archive',button);
    if(button.dataset.panel==='orbit')return activatePanel('orbit',button);
    if(button.dataset.panel==='orders')return activatePanel('orders',button);
    if(button.dataset.panel==='account')return activatePanel('account',button);
    if(button.dataset.panel==='data')return activatePanel('data',button);
    if(button.dataset.navAction==='alerts'){
      if(typeof window.openApiOrderInbox==='function')window.openApiOrderInbox();
      return;
    }
    if(button.dataset.navAction==='settings')return openSettingsDirect();
    if(button.dataset.navAction==='language')return switchLanguage();
  }

  if(!window.__dataSearchStableNavigationBound){
    window.__dataSearchStableNavigationBound=true;
    document.addEventListener('click',handleNavigation,true);
  }

  function start(){[0,80,300,900,1800].forEach(function(delay){setTimeout(normalize,delay);});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
  window.addEventListener('load',function(){setTimeout(normalize,50);},{once:true});
})();
</script>
<!-- CLEAN_NAVIGATION_FIX_END -->
