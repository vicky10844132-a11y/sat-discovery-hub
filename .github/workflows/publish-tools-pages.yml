name: Publish DATA SEARCH and AOI TOOL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-tools-pages.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tools publishing branch
        uses: actions/checkout@v4
        with:
          ref: tools-pages
      - name: Download and validate DATA SEARCH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          curl -L --retry 2 --connect-timeout 20 \
            -o _site/data-search.html \
            -w 'HTTP=%{http_code} BYTES=%{size_download}\n' \
            'https://drive.usercontent.google.com/download?id=11q_y6JWgKvRMQGVTft0f3PeouWKyFY7x&export=download&confirm=t'
          echo "Downloaded bytes: $(wc -c < _site/data-search.html)"
          head -c 120 _site/data-search.html | tr '\n' ' '; echo
          test "$(wc -c < _site/data-search.html)" -gt 400000
          grep -qi '<!doctype html' _site/data-search.html
          grep -qi 'DATA SEARCH' _site/data-search.html
          grep -qi '</html>' _site/data-search.html
      - name: Prepare AOI TOOL and hidden entry
        shell: bash
        run: |
          set -euo pipefail
          cp aoi-tools.html _site/aoi-tool.html
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Tools</title></head><body></body></html>' > _site/index.html
          printf '%s\n' 'User-agent: *' 'Disallow: /' > _site/robots.txt
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
