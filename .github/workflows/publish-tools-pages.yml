name: Publish DATA SEARCH and AOI TOOL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-tools-pages.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tools publishing branch
        uses: actions/checkout@v4
        with:
          ref: tools-pages
      - name: Restore and validate DATA SEARCH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat \
            data-search-assets/part00.b64 \
            data-search-assets/part01.b64 \
            data-search-assets/r00.b64 \
            data-search-assets/r01.b64 \
            data-search-assets/part03.b64 \
            data-search-assets/part04.b64 \
            data-search-assets/part05.b64 \
            data-search-assets/part06.b64 \
            data-search-assets/part07.b64 \
            data-search-assets/part08.b64 \
            data-search-assets/part09.b64 \
            | tr -d '\r\n ' \
            | base64 --decode \
            | gzip --decompress \
            > _site/data-search.html
          test "$(wc -c < _site/data-search.html)" -eq 490261
          echo 'f18d068cac522bdcb5bebfeeaec7e12a0a64de73ddc8250aef3dc9387987a72c  _site/data-search.html' | sha256sum -c -
          grep -qi '<!doctype html' _site/data-search.html
          grep -qi 'DATA SEARCH' _site/data-search.html
          grep -qi '</html>' _site/data-search.html
      - name: Restore and validate AOI TOOL
        shell: bash
        run: |
          set -euo pipefail
          cat aoi-tool-assets/part*.b64 \
            | tr -d '\r\n ' \
            | base64 --decode \
            | gzip --decompress \
            > _site/aoi-tool.html
          test "$(wc -c < _site/aoi-tool.html)" -eq 85764
          echo '53d214b46eaaddce532d898e5297bb22bf9acde67ce97664a1fe22feafd28aae  _site/aoi-tool.html' | sha256sum -c -
          grep -qi '<!doctype html' _site/aoi-tool.html
          grep -qi 'AOI TOOL' _site/aoi-tool.html
          grep -qi '</html>' _site/aoi-tool.html
      - name: Prepare hidden entry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Tools</title></head><body></body></html>' > _site/index.html
          printf '%s\n' 'User-agent: *' 'Disallow: /' > _site/robots.txt
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Verify published DATA SEARCH and AOI TOOL
        shell: bash
        run: |
          set -euo pipefail
          verify_page() {
            local url="$1"
            local output="$2"
            local bytes="$3"
            local hash="$4"
            for attempt in $(seq 1 24); do
              if curl -fsSL --retry 1 --connect-timeout 15 "$url" -o "$output"; then
                if [ "$(wc -c < "$output")" -eq "$bytes" ] && echo "$hash  $output" | sha256sum -c -; then
                  grep -qi '<!doctype html' "$output"
                  grep -qi '</html>' "$output"
                  echo "Verified: $url"
                  return 0
                fi
              fi
              sleep 10
            done
            echo "Live verification failed: $url" >&2
            return 1
          }
          verify_page 'https://vicky10844132-a11y.github.io/sat-discovery-hub/data-search.html' /tmp/data-search.html 490261 f18d068cac522bdcb5bebfeeaec7e12a0a64de73ddc8250aef3dc9387987a72c
          verify_page 'https://vicky10844132-a11y.github.io/sat-discovery-hub/aoi-tool.html' /tmp/aoi-tool.html 85764 53d214b46eaaddce532d898e5297bb22bf9acde67ce97664a1fe22feafd28aae
