name: Diagnose GitHub Pages

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Pages and push workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PAGES ==='
          curl -sS -D /tmp/pages.headers \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/vicky10844132-a11y/sat-discovery-hub/pages \
            -o /tmp/pages.json || true
          cat /tmp/pages.headers
          cat /tmp/pages.json
          echo
          echo '=== PUSH RUNS ==='
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            'https://api.github.com/repos/vicky10844132-a11y/sat-discovery-hub/actions/runs?event=push&per_page=10' \
            -o /tmp/runs.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/runs.json'))
          for r in d.get('workflow_runs',[]):
              print(r['id'], r['name'], r['status'], r.get('conclusion'), r['head_sha'], r['html_url'])
          PY
