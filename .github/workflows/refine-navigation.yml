name: Correct DATA SEARCH navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Correct navigation JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('data-search.html')
          html = path.read_text(encoding='utf-8')
          broken = "button.dataset.panel==='account'y"
          fixed = "button.dataset.panel==='account'"
          if broken not in html:
              raise SystemExit('Expected broken navigation expression was not found')
          html = html.replace(broken, fixed)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Publish corrected navigation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search.html
          git commit -m 'Correct DATA SEARCH navigation script'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
