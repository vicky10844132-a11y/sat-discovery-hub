name: Publish DATA SEARCH navigation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-navigation.yml'
      - '.github/nav-patch.html'
      - '.github/scripts/apply_nav_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published page
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Checkout navigation patch
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Apply validated navigation patch
        run: python3 source/.github/scripts/apply_nav_patch.py site/data-search.html source/.github/nav-patch.html

      - name: Publish corrected page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish stable DATA SEARCH navigation'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
