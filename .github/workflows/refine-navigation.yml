name: Clean selected DATA SEARCH top

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-restored-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published page
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: site

      - name: Remove top controls once
        shell: bash
        run: |
          set -euo pipefail
          cd site
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('data-search-restored.html')
          html = path.read_text(encoding='utf-8')
          if '<!doctype html' not in html[:500].lower():
              raise SystemExit('Restored page is not valid HTML')

          # Remove every previously inserted guard, including copies that were
          # accidentally placed inside generated-document template strings.
          html = re.sub(
              r'\n?<!-- RESTORED_TOP_REMOVED -->.*?<!-- RESTORED_TOP_REMOVED_END -->\n?',
              '\n',
              html,
              flags=re.S,
          )

          # Remove the actual visible top controls from the document source.
          html = re.sub(
              r'\s*<div class="coordinate-search"[^>]*>.*?</div>\s*',
              '\n',
              html,
              count=1,
              flags=re.S,
          )
          html = re.sub(
              r'\s*<div class="top-actions"[^>]*>.*?</div>\s*',
              '\n',
              html,
              count=1,
              flags=re.S,
          )

          guard = '''
<!-- RESTORED_TOP_REMOVED -->
<style id="restored-top-removed-style">
.coordinate-search,.top-actions,.v11-auth-actions,.account-menu-button,.lang-mini,.v9-help-button{display:none!important}
.topbar{justify-content:flex-start!important}
</style>
<script id="restored-top-removed-script">
(function(){
  function clean(){
    document.querySelectorAll('.coordinate-search,.top-actions').forEach(function(node){node.remove();});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean,{once:true});else clean();
  window.addEventListener('load',clean,{once:true});
  new MutationObserver(clean).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
<!-- RESTORED_TOP_REMOVED_END -->
'''

          closing = html.lower().rfind('</body>')
          if closing < 0:
              raise SystemExit('Closing body tag not found')
          html = html[:closing] + guard + html[closing:]
          path.write_text(html, encoding='utf-8')

          result = path.read_text(encoding='utf-8')
          assert result.count('<!-- RESTORED_TOP_REMOVED -->') == 1
          assert result.count('<!-- RESTORED_TOP_REMOVED_END -->') == 1
          assert '<div class="coordinate-search"' not in result
          assert '<div class="top-actions"' not in result
          PY

      - name: Publish corrected restored page
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search-restored.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Clean top controls on restored DATA SEARCH page'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
