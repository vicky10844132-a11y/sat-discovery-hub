# refined audit
name: Audit all DATA SEARCH buttons
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-all-data-search-buttons.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run refined button audit
        run: |
          cat > audit.js <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          (async()=>{const browser=await chromium.launch({headless:true});const results=[],pageErrors=[];
          async function fresh(){const p=await browser.newPage({viewport:{width:1600,height:1000},acceptDownloads:true});p.on('pageerror',e=>pageErrors.push(e.message));await p.goto('http://127.0.0.1:8765/data-search-integrated-v8.html',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.querySelectorAll('#v11LoginBtn,#v11LogoutBtn').length===2,{timeout:20000});await p.waitForTimeout(600);return p}
          async function test(name,fn){try{await fn();results.push({name,status:'PASS'})}catch(e){results.push({name,status:'FAIL',error:e.message})}}
          let p=await fresh();
          await test('Login button',async()=>{await p.locator('#v11LogoutBtn').click({force:true});await p.locator('#v11LoginBtn').click();if(!(await p.locator('#v11LoginModal.show').count()))throw Error('login modal missing')});await p.close();
          p=await fresh();await test('Logout button when signed in',async()=>{if(await p.locator('#v11LogoutBtn').isDisabled())throw Error('logout unexpectedly disabled on initial signed-in session');await p.locator('#v11LogoutBtn').click();if(!(await p.locator('#v11LoginBtn').isEnabled()))throw Error('login not enabled after logout')});await p.close();
          p=await fresh();for(const n of ['aoi','search','orbit','sources','clientapi','subscriptions','data','orders','account'])await test('Panel '+n,async()=>{await p.evaluate(x=>window.selectPanel(x),n);await p.waitForTimeout(150)});
          await test('Search tabs',async()=>{await p.evaluate(()=>window.selectPanel('search'));for(const t of ['archive','tasking','subscribe'])await p.evaluate(x=>window.setSearchTab(x),t)});
          for(const [name,fn] of [['Map zoom',()=>p.evaluate(()=>{zoomMap(1);zoomMap(-1)})],['Basemap',()=>p.evaluate(()=>toggleLayers())],['Clear map',()=>p.evaluate(()=>clearMap())],['Orbit init',()=>p.evaluate(()=>{selectPanel('orbit');initOrbitPanel()})],['Source registry',()=>p.evaluate(()=>openSourceRegistry('internal'))],['Public catalog',()=>p.evaluate(()=>openSourceRegistry('public'))],['Customer API',()=>p.evaluate(()=>openCustomerApiStage('connections'))]])await test(name,fn);
          await p.close();
          p=await fresh();await p.evaluate(()=>window.selectPanel('aoi'));await p.waitForTimeout(500);const frame=p.frames().find(f=>f.url().includes('aoi-tool-multi-v8-embed.html'));
          await test('AOI frame visible',async()=>{if(!frame)throw Error('frame missing');const box=await p.locator('#embeddedAoiFrame').boundingBox();if(!box||box.width<100||box.height<100)throw Error('frame not visible')});
          if(frame){await frame.waitForFunction(()=>window.aoiPro&&Array.isArray(window.aoiPro.collection));if((await frame.evaluate(()=>window.aoiPro.collection.length))<2)await frame.evaluate(()=>window.loadDemo?.());await frame.waitForFunction(()=>window.aoiPro.collection.length>=2);
          await test('AOI select checkboxes',async()=>{const boxes=frame.locator('.collection-row input[type=checkbox]');for(let i=0;i<2;i++){if(!(await boxes.nth(i).isVisible()))throw Error('checkbox hidden');if(!(await boxes.nth(i).isChecked()))await boxes.nth(i).check()}});
          await test('AOI relationship',async()=>{await frame.locator('.rail-btn[data-panel="overlay"]').click();await frame.getByRole('button',{name:'Operation Relationship'}).click();if(!(await frame.locator('#relationModal.show').count()))throw Error('modal missing');await frame.evaluate(()=>window.closeRelationModal?.())});
          await test('AOI edge check',async()=>{await frame.locator('.rail-btn[data-panel="rules"]').click();await frame.locator('#edgeTargetSelect').selectOption({index:0});await frame.fill('#multiMinEdge','1');await frame.getByRole('button',{name:'Start Check'}).click()});
          await test('AOI send to search',async()=>{await frame.locator('#useInDataSearchBtn').click();await p.waitForFunction(()=>!!window.__embeddedAoiGeometry,{timeout:10000})});}
          await p.close();const failed=results.filter(x=>x.status==='FAIL');fs.writeFileSync('button-audit-report.json',JSON.stringify({results,pageErrors},null,2));console.log(JSON.stringify({total:results.length,passed:results.length-failed.length,failed:failed.length}));if(failed.length||pageErrors.length)process.exit(1);await browser.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8765 >/tmp/audit-http.log 2>&1 &
          server=$!;trap 'kill $server || true' EXIT;sleep 2;node audit.js
      - name: Publish audit report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add button-audit-report.json
          git commit -m 'Record refined DATA SEARCH button audit' || exit 0
          git push origin gh-pages
