# trigger audit
name: Audit all DATA SEARCH buttons
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-all-data-search-buttons.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run full button audit
        run: |
          cat > audit.js <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:1000},acceptDownloads:true});
            const pageErrors=[]; const consoleErrors=[]; const results=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await page.goto('http://127.0.0.1:8765/data-search-integrated-v8.html',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1200);
            async function test(name,fn){try{await fn();results.push({name,status:'PASS'});}catch(e){results.push({name,status:'FAIL',error:e.message});}}
            await test('Top Login',async()=>{await page.locator('#v11LogoutBtn').click();await page.locator('#v11LoginBtn').click();if(!(await page.locator('#v11LoginModal.show').count()))throw new Error('login modal did not open');await page.evaluate(()=>v11Close('v11LoginModal'));});
            await test('Top Logout',async()=>{await page.locator('#v11LogoutBtn').click();});
            for(const p of ['aoi','search','orbit','sources','clientapi','subscriptions','data','orders','account'])await test('Panel '+p,async()=>{await page.evaluate(n=>window.selectPanel(n),p);await page.waitForTimeout(180);});
            await test('Search tabs',async()=>{await page.evaluate(()=>window.selectPanel('search'));for(const t of ['archive','tasking','subscribe']){await page.evaluate(x=>window.setSearchTab(x),t);await page.waitForTimeout(80)}});
            await test('Location search',async()=>{await page.fill('#coordinateInput','1.3521, 103.8198');await page.evaluate(()=>window.searchLocation());await page.waitForTimeout(120)});
            await test('Map zoom in/out',async()=>{await page.evaluate(()=>window.zoomMap(1));await page.evaluate(()=>window.zoomMap(-1));});
            await test('Basemap switch',async()=>{await page.evaluate(()=>window.toggleLayers());});
            await test('Clear map',async()=>{await page.evaluate(()=>window.clearMap());});
            await test('Orbit panel init',async()=>{await page.evaluate(()=>window.selectPanel('orbit'));await page.waitForTimeout(250);if(!(await page.locator('#orbitSatelliteSelect').count()))throw new Error('orbit controls missing')});
            await test('Source registry open',async()=>{await page.evaluate(()=>window.openSourceRegistry('internal'));await page.waitForTimeout(120);});
            await test('Public catalog preview',async()=>{await page.evaluate(()=>window.openSourceRegistry('public'));await page.waitForTimeout(120);});
            await test('Customer API center',async()=>{await page.evaluate(()=>window.openCustomerApiStage('connections'));await page.waitForTimeout(120);});
            await test('AOI embedded load',async()=>{await page.evaluate(()=>window.selectPanel('aoi'));await page.waitForTimeout(300);const f=page.frames().find(x=>x.url().includes('aoi-tool-multi-v8-embed.html'));if(!f)throw new Error('embedded frame missing');await f.waitForFunction(()=>window.aoiPro&&Array.isArray(window.aoiPro.collection),null,{timeout:15000});});
            const frame=page.frames().find(x=>x.url().includes('aoi-tool-multi-v8-embed.html'));
            if(frame){
              await test('AOI collection selection',async()=>{if((await frame.evaluate(()=>window.aoiPro.collection.length))<2)await frame.evaluate(()=>window.loadDemo?.());await frame.waitForFunction(()=>window.aoiPro.collection.length>=2);const boxes=frame.locator('.collection-row input[type=checkbox]');for(let i=0;i<2;i++)if(!(await boxes.nth(i).isChecked()))await boxes.nth(i).check();});
              await test('AOI relationship modal',async()=>{await frame.locator('.rail-btn[data-panel="overlay"]').click();await frame.getByRole('button',{name:'Operation Relationship'}).click();if(!(await frame.locator('#relationModal.show').count()))throw new Error('relation modal missing');await frame.evaluate(()=>window.closeRelationModal?.());});
              await test('AOI edge check',async()=>{await frame.locator('.rail-btn[data-panel="rules"]').click();const sel=frame.locator('#edgeTargetSelect');if(await sel.count()){await sel.selectOption({index:0});await frame.fill('#multiMinEdge','1');await frame.getByRole('button',{name:'Start Check'}).click();}});
              await test('AOI send to DATA SEARCH',async()=>{await frame.locator('#useInDataSearchBtn').click();await page.waitForFunction(()=>!!window.__embeddedAoiGeometry,{timeout:10000});});
            }
            const failed=results.filter(x=>x.status==='FAIL');fs.writeFileSync('button-audit-report.json',JSON.stringify({results,pageErrors,consoleErrors},null,2));console.log('BUTTON_AUDIT '+JSON.stringify({total:results.length,passed:results.length-failed.length,failed:failed.length}));if(failed.length||pageErrors.length){console.error(JSON.stringify({failed,pageErrors,consoleErrors},null,2));process.exit(1)}await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8765 >/tmp/audit-http.log 2>&1 &
          server=$!; trap 'kill $server || true' EXIT
          sleep 2
          node audit.js
      - name: Publish audit report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -f button-audit-report.json && git add button-audit-report.json || true
          git commit -m 'Record DATA SEARCH full button audit' || exit 0
          git push origin gh-pages
