name: Fix AOI operation buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-aoi-operation-buttons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published AOI tools
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Export operation handler and create fresh path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          targets=['aoi-tool.html','aoi-tool-restored.html','aoi-tool-checkbox-v3.html']
          needle="function runBatch(op){const s=selectedItems();if(s.length<2){toast('Select two AOIs','Check two AOIs to display and use them in the operation.',true);return}setFeature('A',clone(s[0].feature),s[0].name,'collection-load');setFeature('B',clone(s[1].feature),s[1].name,'collection-load');runOverlay(op)}"
          replacement=needle+"\nwindow.runBatch=runBatch;"
          for filename in targets:
              p=Path(filename)
              s=p.read_text(encoding='utf-8')
              if 'window.runBatch=runBatch;' not in s:
                  assert needle in s, filename
                  s=s.replace(needle,replacement,1)
              if 'AOI_OPERATION_BUTTONS_V4' not in s:
                  s=s.replace('</head>','<!-- AOI_OPERATION_BUTTONS_V4 -->\n</head>',1)
              p.write_text(s,encoding='utf-8')
          Path('aoi-tool-operations-v4.html').write_text(Path('aoi-tool-checkbox-v3.html').read_text(encoding='utf-8'),encoding='utf-8')
          PY

      - name: Test all six operation buttons in Chromium
        shell: bash
        run: |
          set -euo pipefail
          cat > operation-test.html <<'HTML'
          <!doctype html><html><body><iframe id="f" src="aoi-tool-operations-v4.html" style="width:1500px;height:950px"></iframe><pre id="r">WAIT</pre><script>
          const f=document.getElementById('f');
          f.onload=()=>setTimeout(async()=>{
            const result={};
            try{
              const w=f.contentWindow,d=f.contentDocument;
              const errors=[];w.addEventListener('error',e=>errors.push(String(e.message||e.error||'error')));
              result.runBatchGlobal=typeof w.runBatch==='function';
              let boxes=[...d.querySelectorAll('.collection-row input[type=checkbox]')];
              result.initialRows=d.querySelectorAll('.collection-row').length;
              boxes.slice(0,2).forEach(b=>{b.checked=true;b.dispatchEvent(new Event('change',{bubbles:true}))});
              await new Promise(r=>setTimeout(r,120));
              result.checked=[...d.querySelectorAll('.collection-row input[type=checkbox]')].slice(0,2).every(x=>x.checked);
              const buttons=[...d.querySelectorAll('.collection-ops button')];
              result.buttonLabels=buttons.map(b=>b.textContent.trim());
              const counts=[];
              for(const b of buttons){
                b.click();
                await new Promise(r=>setTimeout(r,250));
                counts.push(d.querySelectorAll('.collection-row').length);
              }
              result.counts=counts;
              result.errors=errors;
              const expected=[3,4,5,6,7,9];
              result.operationsPassed=JSON.stringify(counts)===JSON.stringify(expected);
              const pass=result.runBatchGlobal&&result.initialRows===2&&result.checked&&buttons.length===6&&result.operationsPassed&&errors.length===0;
              document.getElementById('r').textContent=(pass?'PASS ':'FAIL ')+JSON.stringify(result);
            }catch(e){document.getElementById('r').textContent='FAIL '+e.stack}
          },3200);
          </script></body></html>
          HTML
          python3 -m http.server 8765 >/tmp/aoi-op-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom http://127.0.0.1:8765/operation-test.html >/tmp/operation-dom.html
          cat /tmp/operation-dom.html | grep -o 'PASS [^<]*'
          grep -q 'PASS ' /tmp/operation-dom.html
          grep -q 'AOI_OPERATION_BUTTONS_V4' aoi-tool-operations-v4.html

      - name: Commit repaired operation buttons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aoi-tool.html aoi-tool-restored.html aoi-tool-checkbox-v3.html aoi-tool-operations-v4.html
          git commit -m 'Restore AOI merge intersection difference XOR and split buttons'
          git push origin gh-pages
