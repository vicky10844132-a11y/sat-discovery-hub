name: Find exact first-linked DATA SEARCH source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/restore-first-link-trigger.txt'

permissions:
  contents: read

jobs:
  find-exact-original:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: site

      - name: Find source whose top-only removal matches preserved page exactly
        shell: bash
        run: |
          set -euo pipefail
          cd site
          python3 - <<'PY'
          import hashlib
          import re
          import subprocess
          from datetime import datetime, timezone

          target_ref='1ea89955d25fa460d12547a56fbe0faf7122661d:data-search-restored.html'
          target=subprocess.check_output(['git','show',target_ref])
          target_hash=hashlib.sha256(target).hexdigest()
          target_text=target.decode('utf-8')

          def remove_first_div_by_class(html, class_name):
              pattern=re.compile(
                  r'<div\b[^>]*\bclass=["\'][^"\']*\b'+re.escape(class_name)+r'\b[^"\']*["\'][^>]*>',
                  re.I,
              )
              match=pattern.search(html)
              if not match:
                  raise ValueError('missing '+class_name)
              start=match.start()
              token_re=re.compile(r'<div\b[^>]*>|</div\s*>',re.I)
              depth=0
              for token in token_re.finditer(html,match.start()):
                  if token.group(0).lower().startswith('</div'):
                      depth-=1
                      if depth==0:
                          end=token.end()
                          while end<len(html) and html[end] in ' \t':
                              end+=1
                          if end<len(html) and html[end]=='\r':
                              end+=1
                          if end<len(html) and html[end]=='\n':
                              end+=1
                          return html[:start]+html[end:], html[start:end]
                  else:
                      depth+=1
              raise ValueError('unclosed '+class_name)

          candidate_paths=[
              'data-search.html',
              'data-search-restored.html',
              'data-search-fixed.html',
              'tools-pages/data-search.html',
              'site/data-search.html',
          ]

          exact=[]
          closest=[]
          seen=set()
          for path in candidate_paths:
              result=subprocess.run(
                  ['git','rev-list','--all','--',path],
                  text=True,capture_output=True,check=True,
              )
              for sha in result.stdout.splitlines():
                  key=(sha,path)
                  if key in seen:
                      continue
                  seen.add(key)
                  exists=subprocess.run(
                      ['git','cat-file','-e',f'{sha}:{path}'],
                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,
                  ).returncode==0
                  if not exists:
                      continue
                  raw=subprocess.check_output(['git','show',f'{sha}:{path}'])
                  try:
                      text=raw.decode('utf-8')
                      transformed, removed_search=remove_first_div_by_class(text,'coordinate-search')
                      transformed, removed_actions=remove_first_div_by_class(transformed,'top-actions')
                      transformed_bytes=transformed.encode('utf-8')
                  except (UnicodeDecodeError,ValueError):
                      continue

                  digest=hashlib.sha256(transformed_bytes).hexdigest()
                  delta=abs(len(transformed_bytes)-len(target))
                  meta=subprocess.check_output(
                      ['git','show','-s','--format=%ct%x09%s',sha],text=True
                  ).rstrip('\n')
                  epoch,subject=meta.split('\t',1)
                  stamp=datetime.fromtimestamp(int(epoch),tz=timezone.utc).isoformat()
                  removed_bytes=len(removed_search.encode('utf-8'))+len(removed_actions.encode('utf-8'))
                  row=(sha,path,len(raw),hashlib.sha256(raw).hexdigest(),len(transformed_bytes),digest,removed_bytes,stamp,subject)
                  if transformed_bytes==target:
                      exact.append(row)
                  elif delta<=4096:
                      # Rank only close-sized candidates; hash equality remains the acceptance criterion.
                      prefix=0
                      for a,b in zip(transformed_bytes,target):
                          if a!=b:
                              break
                          prefix+=1
                      closest.append((delta,-prefix,row))

          print('TARGET_BYTES='+str(len(target)))
          print('TARGET_SHA256='+target_hash)
          print('TARGET_FLAGS=' + ','.join([
              'topSearch='+str('<div class="coordinate-search"' in target_text),
              'topActions='+str('<div class="top-actions"' in target_text),
              'publicMode='+str('Public experience mode' in target_text),
          ]))
          print('EXACT_MATCHES_BEGIN')
          for row in exact:
              print('EXACT_MATCH\t'+'\t'.join(map(str,row)))
          print('EXACT_MATCHES_END')

          if not exact:
              print('CLOSEST_BEGIN')
              for delta,neg_prefix,row in sorted(closest,key=lambda x:(x[0],x[1]))[:20]:
                  print('CLOSEST\t{}\t{}\t{}'.format(delta,-neg_prefix,'\t'.join(map(str,row))))
              print('CLOSEST_END')
              raise SystemExit('No exact byte-for-byte source match found')

          # More than one match is acceptable only when the original bytes are identical.
          original_hashes={row[3] for row in exact}
          if len(original_hashes)!=1:
              raise SystemExit('Multiple exact matches have different original hashes')
          PY
