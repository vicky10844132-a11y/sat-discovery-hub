name: Verify exact first-linked DATA SEARCH source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/restore-first-link-trigger.txt'

permissions:
  contents: read

jobs:
  verify-exact-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: site

      - name: Reverse and compare the historical transformation
        shell: bash
        run: |
          set -euo pipefail
          cd site
          python3 - <<'PY'
          import hashlib
          import re
          import subprocess

          published=subprocess.check_output([
              'git','show','1ea89955d25fa460d12547a56fbe0faf7122661d:data-search-restored.html'
          ]).decode('utf-8')
          source=subprocess.check_output([
              'git','show','c164791a6276fae743b8541b9ff0481d4acf32f9:data-search.html'
          ]).decode('utf-8')

          guard_match=re.search(
              r'\n<!-- RESTORED_TOP_REMOVED -->\n.*?\n<!-- RESTORED_TOP_REMOVED_END -->\n',
              published,
              flags=re.S,
          )
          if not guard_match:
              raise SystemExit('Historical guard block was not found')
          target=published[:guard_match.start()]+published[guard_match.end():]

          transformed=re.sub(
              r'\s*<div class="coordinate-search"[^>]*>.*?</div>\s*',
              '\n',source,count=1,flags=re.S,
          )
          transformed=re.sub(
              r'\s*<div class="top-actions"[^>]*>.*?</div>\s*',
              '\n',transformed,count=1,flags=re.S,
          )
          transformed=re.sub(
              r'\n?<!-- RESTORED_TOP_REMOVED -->.*?<!-- RESTORED_TOP_REMOVED_END -->\n?',
              '\n',transformed,flags=re.S,
          )

          print('SOURCE_BYTES='+str(len(source.encode('utf-8'))))
          print('SOURCE_SHA256='+hashlib.sha256(source.encode('utf-8')).hexdigest())
          print('TARGET_BYTES='+str(len(target.encode('utf-8'))))
          print('TARGET_SHA256='+hashlib.sha256(target.encode('utf-8')).hexdigest())
          print('TRANSFORMED_BYTES='+str(len(transformed.encode('utf-8'))))
          print('TRANSFORMED_SHA256='+hashlib.sha256(transformed.encode('utf-8')).hexdigest())
          print('EXACT_EQUAL='+str(transformed==target))

          if transformed!=target:
              prefix=0
              limit=min(len(transformed),len(target))
              while prefix<limit and transformed[prefix]==target[prefix]:
                  prefix+=1
              suffix=0
              max_suffix=min(len(transformed)-prefix,len(target)-prefix)
              while suffix<max_suffix and transformed[len(transformed)-1-suffix]==target[len(target)-1-suffix]:
                  suffix+=1
              left_end=len(transformed)-suffix if suffix else len(transformed)
              right_end=len(target)-suffix if suffix else len(target)
              print('COMMON_PREFIX='+str(prefix))
              print('COMMON_SUFFIX='+str(suffix))
              print('LEFT_DIFFERENCE='+repr(transformed[prefix:left_end]))
              print('RIGHT_DIFFERENCE='+repr(target[prefix:right_end]))
              print('LEFT_CONTEXT='+repr(transformed[max(0,prefix-120):min(len(transformed),left_end+120)]))
              print('RIGHT_CONTEXT='+repr(target[max(0,prefix-120):min(len(target),right_end+120)]))
              raise SystemExit('Exact source differs after literal reverse transformation')
          PY
