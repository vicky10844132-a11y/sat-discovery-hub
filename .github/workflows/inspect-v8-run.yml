name: Verify exact first-linked DATA SEARCH source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/restore-first-link-trigger.txt'

permissions:
  contents: read

jobs:
  verify-exact-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: site

      - name: Reverse the historical transformation exactly
        shell: bash
        run: |
          set -euo pipefail
          cd site
          python3 - <<'PY'
          import difflib
          import hashlib
          import re
          import subprocess

          published=subprocess.check_output([
              'git','show','1ea89955d25fa460d12547a56fbe0faf7122661d:data-search-restored.html'
          ]).decode('utf-8')
          source=subprocess.check_output([
              'git','show','c164791a6276fae743b8541b9ff0481d4acf32f9:data-search.html'
          ]).decode('utf-8')

          guard='''
<!-- RESTORED_TOP_REMOVED -->
<style id="restored-top-removed-style">
.coordinate-search,.top-actions,.v11-auth-actions,.account-menu-button,.lang-mini,.v9-help-button{display:none!important}
.topbar{justify-content:flex-start!important}
</style>
<script id="restored-top-removed-script">
(function(){
  function clean(){document.querySelectorAll('.coordinate-search,.top-actions').forEach(function(node){node.remove();});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean,{once:true});else clean();
  window.addEventListener('load',clean,{once:true});
  new MutationObserver(clean).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
<!-- RESTORED_TOP_REMOVED_END -->
'''
          if published.count(guard)!=1:
              raise SystemExit('Literal historical guard was not found exactly once')
          target_base=published.replace(guard,'',1)

          transformed=re.sub(
              r'\s*<div class="coordinate-search"[^>]*>.*?</div>\s*',
              '\n',source,count=1,flags=re.S,
          )
          transformed=re.sub(
              r'\s*<div class="top-actions"[^>]*>.*?</div>\s*',
              '\n',transformed,count=1,flags=re.S,
          )
          transformed=re.sub(
              r'\n?<!-- RESTORED_TOP_REMOVED -->.*?<!-- RESTORED_TOP_REMOVED_END -->\n?',
              '\n',transformed,flags=re.S,
          )

          print('SOURCE_BYTES='+str(len(source.encode('utf-8'))))
          print('SOURCE_SHA256='+hashlib.sha256(source.encode('utf-8')).hexdigest())
          print('TARGET_BASE_BYTES='+str(len(target_base.encode('utf-8'))))
          print('TARGET_BASE_SHA256='+hashlib.sha256(target_base.encode('utf-8')).hexdigest())
          print('TRANSFORMED_BYTES='+str(len(transformed.encode('utf-8'))))
          print('TRANSFORMED_SHA256='+hashlib.sha256(transformed.encode('utf-8')).hexdigest())
          print('EXACT_EQUAL='+str(transformed==target_base))

          if transformed!=target_base:
              matcher=difflib.SequenceMatcher(None,transformed,target_base,autojunk=False)
              print('DIFF_BEGIN')
              for tag,i1,i2,j1,j2 in matcher.get_opcodes():
                  if tag=='equal':
                      continue
                  print('DIFF\t{}\t{}:{}\t{}:{}\tLEFT={}\tRIGHT={}'.format(
                      tag,i1,i2,j1,j2,repr(transformed[max(0,i1-80):min(len(transformed),i2+80)]),repr(target_base[max(0,j1-80):min(len(target_base),j2+80)])
                  ))
              print('DIFF_END')
              raise SystemExit('The literal reverse comparison is not exact')
          PY
