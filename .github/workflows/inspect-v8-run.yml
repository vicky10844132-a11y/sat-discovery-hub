name: Audit first-linked DATA SEARCH history

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/restore-first-link-trigger.txt'

permissions:
  contents: read

jobs:
  audit-restored-page-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete gh-pages history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: site

      - name: List every historical restored-page version and deletion
        shell: bash
        run: |
          set -euo pipefail
          cd site
          python3 - <<'PY'
          import hashlib, subprocess
          from datetime import datetime, timezone

          path='data-search-restored.html'
          rows=subprocess.check_output([
              'git','log','--all','--follow','--format=%H%x09%ct%x09%s','--',path
          ],text=True).splitlines()

          print('HISTORY_BEGIN')
          for row in rows:
              sha, epoch, subject = row.split('\t',2)
              stamp=datetime.fromtimestamp(int(epoch),tz=timezone.utc).isoformat()
              exists=subprocess.run(['git','cat-file','-e',f'{sha}:{path}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              if not exists:
                  print(f'DELETED\t{sha}\t{stamp}\t{subject}')
                  continue
              data=subprocess.check_output(['git','show',f'{sha}:{path}'])
              text=data.decode('utf-8','replace')
              flags={
                  'topSearch': '<div class="coordinate-search"' in text,
                  'topActions': '<div class="top-actions"' in text,
                  'publicMode': 'Public experience mode' in text,
                  'publicAdmin': 'public-admin@datasearch.example' in text,
                  'aoiCenter': 'title="AOI Center"' in text,
                  'searchCenter': 'title="Search Center"' in text,
                  'orbitPrediction': 'title="Orbit Prediction"' in text,
                  'navV3': 'NAVIGATION_LAYOUT_V3' in text,
                  'cleanNav': 'CLEAN_NAVIGATION_FIX' in text,
                  'finalNav': 'FINAL_NAVIGATION_FIX' in text,
                  'iframeWrapper': 'dataSearchFrame' in text,
                  'topRemoved': 'RESTORED_TOP_REMOVED' in text,
              }
              flag_text=','.join(k for k,v in flags.items() if v) or 'none'
              print('VERSION\t{}\t{}\t{}\t{}\t{}\t{}'.format(
                  sha,stamp,len(data),hashlib.sha256(data).hexdigest(),flag_text,subject
              ))
          print('HISTORY_END')

          print('DELETION_EVENTS_BEGIN')
          deleted=subprocess.check_output([
              'git','log','--all','--diff-filter=D','--format=%H%x09%ct%x09%s','--',path
          ],text=True).splitlines()
          for row in deleted:
              sha, epoch, subject=row.split('\t',2)
              parents=subprocess.check_output(['git','show','-s','--format=%P',sha],text=True).strip().split()
              for parent in parents:
                  if subprocess.run(['git','cat-file','-e',f'{parent}:{path}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0:
                      data=subprocess.check_output(['git','show',f'{parent}:{path}'])
                      print('DELETION_PARENT\t{}\t{}\t{}\t{}\t{}'.format(
                          sha,parent,len(data),hashlib.sha256(data).hexdigest(),subject
                      ))
          print('DELETION_EVENTS_END')
          PY
