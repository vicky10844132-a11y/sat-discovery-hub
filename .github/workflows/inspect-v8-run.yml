name: Restore exact first-linked DATA SEARCH page

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/restore-first-link-trigger.txt'

permissions:
  contents: write

jobs:
  restore-exact-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete published history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: site

      - name: Restore the exact source blob used by the first link
        shell: bash
        run: |
          set -euo pipefail
          cd site
          source_commit='c164791a6276fae743b8541b9ff0481d4acf32f9'
          expected_blob='b19000123369353e4fc386a5f14171c5521c80c5'

          actual_source_blob="$(git rev-parse "$source_commit:data-search.html")"
          test "$actual_source_blob" = "$expected_blob"

          git show "$source_commit:data-search.html" > data-search-restored.html
          restored_blob="$(git hash-object data-search-restored.html)"
          test "$restored_blob" = "$expected_blob"

          grep -q '<div class="coordinate-search"' data-search-restored.html
          grep -q '<div class="top-actions"' data-search-restored.html
          test "$(grep -c 'dataSearchFrame' data-search-restored.html || true)" -eq 0
          test "$(grep -c 'RESTORED_TOP_REMOVED' data-search-restored.html || true)" -eq 0
          test "$(grep -c 'ITEM1_AOI_STANDALONE' data-search-restored.html || true)" -eq 0

          echo "SOURCE_COMMIT=$source_commit"
          echo "SOURCE_BLOB=$actual_source_blob"
          echo "RESTORED_BLOB=$restored_blob"
          echo "RESTORED_BYTES=$(wc -c < data-search-restored.html)"
          sha256sum data-search-restored.html

      - name: Publish only data-search-restored.html
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search-restored.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Exact first-linked source is already published.'
            exit 0
          fi
          git commit -m 'Restore exact first-linked DATA SEARCH page'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
