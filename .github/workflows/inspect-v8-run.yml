name: Restore first-linked DATA SEARCH page

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/restore-first-link-trigger.txt'

permissions:
  contents: write

jobs:
  restore-first-linked-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published history and preserved payload
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: site

      - name: Rebuild exact original page from preserved compressed parts
        shell: bash
        run: |
          set -euo pipefail
          cd site
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          payload_dir = Path('assets/data-search-restored-c3fea2f7')
          parts = sorted(payload_dir.glob('part-*.b64'))
          if len(parts) != 3:
              raise SystemExit(f'Expected 3 preserved parts, found {len(parts)}')

          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          original = gzip.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(original).hexdigest()
          text = original.decode('utf-8')

          if not digest.startswith('c3fea2f7'):
              raise SystemExit(f'Preserved payload hash mismatch: {digest}')
          required = (
              '<!DOCTYPE html>',
              '<title>DATA SEARCH</title>',
              'Public experience mode',
              'public-admin@datasearch.example',
              'title="AOI Center"',
              'title="Search Center"',
              'title="Orbit Prediction"',
              'Data Center',
              'Order Center',
              'Account Center',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Preserved original is missing expected markers: {missing}')

          Path('data-search-restored.html').write_bytes(original)
          print('RESTORED_SHA256=' + digest)
          print('RESTORED_BYTES=' + str(len(original)))
          PY

          test "$(grep -c '<!DOCTYPE html>' data-search-restored.html)" -eq 1
          test "$(grep -c 'dataSearchFrame' data-search-restored.html || true)" -eq 0
          test "$(grep -c 'ITEM1_AOI_STANDALONE' data-search-restored.html || true)" -eq 0

      - name: Publish exact preserved original
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search-restored.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'The exact preserved original is already published.'
            exit 0
          fi
          git commit -m 'Restore exact first-linked DATA SEARCH page'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
