name: Inspect first-linked page parent

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/restore-first-link-trigger.txt'

permissions:
  contents: read

jobs:
  inspect-removal-parent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: site

      - name: Inspect exact parent content of top-removal commit
        shell: bash
        run: |
          set -euo pipefail
          cd site
          python3 - <<'PY'
          import hashlib, subprocess

          commit='1ea89955d25fa460d12547a56fbe0faf7122661d'
          path='data-search-restored.html'
          parents=subprocess.check_output(['git','show','-s','--format=%P',commit],text=True).strip().split()
          print('COMMIT='+commit)
          print('PARENTS='+' '.join(parents))
          current=subprocess.check_output(['git','show',f'{commit}:{path}'])
          print('CURRENT_BYTES='+str(len(current)))
          print('CURRENT_SHA256='+hashlib.sha256(current).hexdigest())

          found=False
          for parent in parents:
              exists=subprocess.run(
                  ['git','cat-file','-e',f'{parent}:{path}'],
                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,
              ).returncode==0
              print(f'PARENT_EXISTS\t{parent}\t{exists}')
              if not exists:
                  continue
              found=True
              data=subprocess.check_output(['git','show',f'{parent}:{path}'])
              text=data.decode('utf-8','replace')
              print('PARENT_VERSION\t{}\t{}\t{}\ttopSearch={}\ttopActions={}\tiframe={}\ttopRemoved={}'.format(
                  parent,
                  len(data),
                  hashlib.sha256(data).hexdigest(),
                  '<div class="coordinate-search"' in text,
                  '<div class="top-actions"' in text,
                  'dataSearchFrame' in text,
                  'RESTORED_TOP_REMOVED' in text,
              ))
          if not found:
              raise SystemExit('No parent contains data-search-restored.html')
          PY
