name: Inspect V8 build run

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print latest V8 build logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo/actions/runs?per_page=60" > /tmp/runs.json
          python3 - <<'PY' > /tmp/run.txt
          import json
          d=json.load(open('/tmp/runs.json'))
          rows=[r for r in d['workflow_runs'] if r['name']=='Run AOI V8 builder']
          if not rows: raise SystemExit('No compact V8 run found')
          r=rows[0]
          print(r['id'])
          print('RUN',r['id'],r['status'],r.get('conclusion'),r['head_sha'],r['html_url'])
          PY
          cat /tmp/run.txt
          run_id=$(head -1 /tmp/run.txt)
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo/actions/runs/$run_id/jobs" > /tmp/jobs.json
          cat /tmp/jobs.json | python3 -c "import json,sys; d=json.load(sys.stdin); [print('JOB',j['id'],j['name'],j['status'],j.get('conclusion'),[(s['name'],s['status'],s.get('conclusion')) for s in j.get('steps',[])]) for j in d['jobs']]"
          job_id=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/jobs.json'))
          print(d['jobs'][0]['id'])
          PY
          )
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo/actions/jobs/$job_id/logs" -o /tmp/joblog
          if file /tmp/joblog | grep -qi zip; then unzip -p /tmp/joblog | tail -n 260; else tail -n 260 /tmp/joblog; fi
