name: Integrate AOI V8 into DATA SEARCH

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-aoi-v8-into-data-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Build embedded AOI and integrated DATA SEARCH
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Build an embedded copy of the complete AOI V8 module.
          aoi_path=Path('aoi-tool-multi-v8.html')
          aoi=aoi_path.read_text(encoding='utf-8')
          if 'AOI_MULTI_RANGE_V8' not in aoi:
              raise SystemExit('AOI V8 marker missing')
          embed_css='''
          <style id="aoiEmbeddedModeStyles">
          html,body{background:#eef1f1!important}
          .app{grid-template-rows:0 minmax(0,1fr)!important}
          .topbar{display:none!important}
          #useInDataSearchBtn{position:fixed;right:18px;bottom:18px;z-index:6000;height:40px;padding:0 18px;border:0;border-radius:9px;background:#d9467a;color:#fff;font:800 11px/1 Inter,"Segoe UI",Arial,sans-serif;box-shadow:0 12px 30px rgba(23,25,29,.28);cursor:pointer}
          #useInDataSearchBtn:hover{background:#e15a8b;transform:translateY(-1px)}
          </style>
          '''
          h=aoi.find('</head>')
          if h<0: raise SystemExit('AOI head tag missing')
          aoi=aoi[:h]+embed_css+aoi[h:]
          b=aoi.rfind('</body>')
          if b<0: raise SystemExit('AOI body tag missing')
          use_btn='''<button id="useInDataSearchBtn" type="button" onclick="sendSelectedToHost()">Use in DATA SEARCH</button>\n'''
          aoi=aoi[:b]+use_btn+aoi[b:]
          Path('aoi-tool-multi-v8-embed.html').write_text(aoi,encoding='utf-8')

          # Build DATA SEARCH with the AOI module replacing the former AOI workspace.
          source=Path('data-search-restored.html')
          s=source.read_text(encoding='utf-8')
          if '<title>DATA SEARCH</title>' not in s:
              raise SystemExit('DATA SEARCH source marker missing')

          # Replace the whole top header. Authentication code will inject Login and Logout.
          start=s.find('<header class="topbar">')
          end=s.find('</header>',start)
          if start<0 or end<0: raise SystemExit('DATA SEARCH topbar not found')
          end+=len('</header>')
          s=s[:start]+'<header class="topbar"><div class="top-actions"></div></header>'+s[end:]

          # Apply the user's charcoal + rose palette throughout the existing interface.
          palette={
            '#162356':'#2b2e34','#0e173d':'#17191d','#2768e8':'#c83f72','#1db8d7':'#e15a8b',
            '#ef3f83':'#d9467a','#17244e':'#2b2e34','#1a2f6e':'#3d4148','#193274':'#2b2e34',
            '#265fd3':'#c83f72','#203d8d':'#3d4148','#245fc3':'#c83f72','#1f5ec4':'#c83f72',
            '#195bc5':'#c83f72','#2f6fec':'#d9467a','#5468e7':'#858a92','#14aead':'#c83f72',
            '#27bd9b':'#e15a8b','#19b5a5':'#d9467a','#1e9f72':'#858a92','#12bfc6':'#d9467a',
            '#16c6cb':'#e15a8b','#42d5e8':'#e15a8b','#5fe1f2':'#f08aae','#213f8d':'#3d4148',
            '#172c68':'#17191d','#2d5e94':'#9f365e','#365e86':'#7d344f','#2f5fbf':'#a23a63',
            '#244d78':'#6f384d','#274964':'#5c3946','#29455f':'#4b3c42','#304d68':'#544047',
            '#183c5b':'#463940','#2464ca':'#d9467a','#2b61a9':'#b83d69','#91afea':'#e6a2bb',
            '#8eb0f4':'#e6a2bb','#9bb9f4':'#e6a2bb','#edf3ff':'#fbe8f0','#f2f6ff':'#fff4f8',
            '#f5f8ff':'#fff6f9','#d8e4fb':'#f0c9d8','#cfe0f5':'#efd1dc','#f1f7ff':'#fff5f8'
          }
          for old,new in palette.items():
              s=s.replace(old,new).replace(old.upper(),new)

          theme='''
          <style id="dataSearchCharcoalRoseTheme">
          :root{--nav:#2b2e34!important;--nav2:#17191d!important;--blue:#c83f72!important;--cyan:#e15a8b!important;--pink:#d9467a!important;--orange:#b83d69!important;--ink:#25282d!important;--soft:#f6f3f5!important}
          .topbar{justify-content:flex-end!important;background:#17191d!important;border-bottom-color:#3d4148!important}
          .top-actions{margin-left:auto!important;padding:0 16px!important;height:100%!important;display:flex!important;align-items:center!important}
          .top-actions>*:not(.v11-auth-actions){display:none!important}
          .v11-auth-actions{display:flex!important;gap:9px!important;align-items:center!important}
          .v11-auth-email{display:none!important}
          .v11-auth-btn{height:34px!important;min-width:82px!important;border-radius:8px!important;border:1px solid #686b72!important;background:#2b2e34!important;color:#fff!important;font-weight:800!important}
          .v11-auth-btn.primary{background:#d9467a!important;border-color:#d9467a!important}
          .v11-auth-btn.logout-active{background:#3d4148!important;border-color:#858a92!important}
          .rail{background:linear-gradient(180deg,#17191d,#2b2e34)!important}
          .rail-btn.active{background:rgba(217,70,122,.2)!important;color:#f08aae!important}
          .rail-btn.active:before{background:#d9467a!important}
          .primary-wide,.registry-primary,.v11-main-btn,.mini.primary,.orbit-primary{background:#d9467a!important;border-color:#d9467a!important;color:#fff!important}
          .secondary-wide,.small-action:hover,.mini:hover,.registry-utility:hover{border-color:#d9467a!important;color:#b83d69!important}
          .tab.active,.seg-btn.active,.registry-tabbar button.active,.client-api-tabbar button.active{color:#b83d69!important}
          .tab.active:after{background:#d9467a!important}
          .usage-box,.registry-hero,.client-api-hero{background:linear-gradient(135deg,#17191d,#3d4148)!important}
          .result-summary{background:linear-gradient(90deg,#b83d69,#e15a8b)!important}
          .spinner,.api-dot.online{border-color:#d9467a!important}
          .embedded-aoi-stage{display:none;position:absolute;inset:0;z-index:2600;background:#eef1f1}
          .embedded-aoi-stage iframe{width:100%;height:100%;border:0;display:block;background:#eef1f1}
          .app.aoi-integrated .sidepanel{display:none!important}
          .app.aoi-integrated .mapstage{grid-column:2/4!important}
          .app.aoi-integrated .embedded-aoi-stage{display:block!important}
          </style>
          '''
          head=s.find('</head>')
          if head<0: raise SystemExit('DATA SEARCH head tag missing')
          s=s[:head]+theme+s[head:]

          marker='<main class="mapstage">'
          pos=s.find(marker)
          if pos<0: raise SystemExit('DATA SEARCH mapstage missing')
          pos+=len(marker)
          embedded='''
          <section class="embedded-aoi-stage" id="embeddedAoiStage" aria-label="AOI TOOL V8">
            <iframe id="embeddedAoiFrame" title="AOI TOOL V8" src="aoi-tool-multi-v8-embed.html"></iframe>
          </section>
          '''
          s=s[:pos]+embedded+s[pos:]

          bridge=r'''
          <script id="dataSearchAoiV8Bridge">
          (function(){
            'use strict';
            const previousSelect=window.selectPanel;
            window.selectPanel=function(name){
              const app=document.querySelector('.app');
              if(name==='aoi'){
                app?.classList.add('aoi-integrated');
                document.querySelectorAll('.rail-btn[data-panel]').forEach(x=>x.classList.toggle('active',x.dataset.panel==='aoi'));
                setTimeout(()=>document.getElementById('embeddedAoiFrame')?.contentWindow?.postMessage({type:'DATA_SEARCH_AOI_EMBED_ACTIVE'},'*'),60);
                return;
              }
              app?.classList.remove('aoi-integrated');
              return previousSelect?.call(this,name);
            };

            function geometryFromFeature(f){
              if(!f)return null;
              if(f.type==='Feature')return f.geometry||null;
              if(f.type==='FeatureCollection'){
                const gs=(f.features||[]).map(x=>x.geometry).filter(Boolean);
                return gs.length===1?gs[0]:{type:'GeometryCollection',geometries:gs};
              }
              if(f.type&&f.coordinates)return f;
              return null;
            }
            function ringArea(r){return sphericalPolygonAreaKm2((r||[]).map(c=>[Number(c[1]),Number(c[0])]));}
            function geometryArea(g){
              if(!g)return 0;
              if(g.type==='Polygon')return Math.max(0,ringArea(g.coordinates[0])-g.coordinates.slice(1).reduce((a,r)=>a+ringArea(r),0));
              if(g.type==='MultiPolygon')return g.coordinates.reduce((a,p)=>a+geometryArea({type:'Polygon',coordinates:p}),0);
              if(g.type==='GeometryCollection')return (g.geometries||[]).reduce((a,x)=>a+geometryArea(x),0);
              return 0;
            }
            const oldGetActive=window.getActiveGeometry;
            window.getActiveGeometry=function(){return window.__embeddedAoiGeometry||(typeof oldGetActive==='function'?oldGetActive():null);};

            window.addEventListener('message',function(e){
              const d=e.data||{};
              if(d.type!=='IMAGE_COVERY_AOI_WORKBENCH_RESULT'||!d.feature)return;
              const geom=geometryFromFeature(d.feature);
              if(!geom)return;
              window.__embeddedAoiGeometry=geom;
              activeAoiName=(d.name||'Selected AOI').replace(/_/g,' ');
              if(window.L&&map){
                if(activeAOI)try{map.removeLayer(activeAOI)}catch(_e){}
                activeAOI=L.geoJSON(d.feature,{style:{color:'#d9467a',weight:2.8,fillColor:'#d9467a',fillOpacity:.14}}).addTo(map).bindTooltip(activeAoiName,{sticky:true});
                const bounds=activeAOI.getBounds?.();if(bounds?.isValid())map.fitBounds(bounds,{padding:[60,60],maxZoom:11});
              }
              const area=geometryArea(geom),status=document.getElementById('mapStatus');
              if(status)status.textContent=`${activeAoiName} area: ${formatAreaKm2(area)} km²`;
              window.selectPanel('search');
              if(typeof setSearchTab==='function')setSearchTab('archive');
              setTimeout(()=>{const label=document.getElementById('activeAoiLabel');if(label)label.textContent=activeAoiName+' · exact polygon search';},0);
              window.notify?.('AOI applied',activeAoiName+' is now the DATA SEARCH search range.');
            });

            function keepOnlyAuthButtons(){
              const top=document.querySelector('.top-actions');if(!top)return;
              top.querySelectorAll(':scope > *:not(.v11-auth-actions)').forEach(x=>x.remove());
              top.querySelector('.v11-auth-email')?.remove();
            }
            const observer=new MutationObserver(keepOnlyAuthButtons);
            function init(){
              keepOnlyAuthButtons();
              const top=document.querySelector('.top-actions');if(top)observer.observe(top,{childList:true,subtree:true});
              setTimeout(()=>window.selectPanel('aoi'),180);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
          })();
          </script>
          '''
          body=s.rfind('</body>')
          if body<0: raise SystemExit('DATA SEARCH body tag missing')
          s=s[:body]+bridge+s[body:]
          s=s.replace('<title>DATA SEARCH</title>','<!-- DATA_SEARCH_AOI_V8_INTEGRATED -->\n<title>DATA SEARCH</title>',1)

          for out in ['data-search-integrated-v8.html','data-search-restored.html','data-search.html']:
              Path(out).write_text(s,encoding='utf-8')
          PY

      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser integration test
        shell: bash
        run: |
          set -euo pipefail
          cat > integration-test.js <<'JS'
          const {chromium}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:1000}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/data-search-integrated-v8.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelectorAll('#v11LoginBtn,#v11LogoutBtn').length===2,{timeout:20000});
            await page.waitForTimeout(700);
            const top=await page.evaluate(()=>({
              visible:[...document.querySelectorAll('.topbar button')].filter(x=>getComputedStyle(x).display!=='none').map(x=>x.textContent.trim()),
              nav:getComputedStyle(document.documentElement).getPropertyValue('--nav2').trim(),
              rose:getComputedStyle(document.documentElement).getPropertyValue('--blue').trim(),
              integrated:document.querySelector('.app').classList.contains('aoi-integrated')
            }));
            assert.deepStrictEqual(top.visible.sort(),['Login','Logout']);
            assert.equal(top.nav,'#17191d');assert.equal(top.rose,'#c83f72');assert(top.integrated);
            const frame=page.frames().find(f=>f.url().includes('aoi-tool-multi-v8-embed.html'));
            assert(frame,'AOI iframe missing');
            await frame.waitForFunction(()=>window.aoiPro?.collection?.length===2,{timeout:20000});
            assert(await frame.locator('#useInDataSearchBtn').isVisible());
            assert.equal(await frame.locator('.topbar').evaluate(x=>getComputedStyle(x).display),'none');
            const boxes=frame.locator('.collection-row input[type=checkbox]');
            if(!(await boxes.nth(0).isChecked()))await boxes.nth(0).check();
            await frame.locator('#useInDataSearchBtn').click();
            await page.waitForFunction(()=>!document.querySelector('.app').classList.contains('aoi-integrated'),{timeout:10000});
            await page.waitForFunction(()=>/area:/.test(document.getElementById('mapStatus')?.textContent||''),{timeout:10000});
            assert(window!==null);
            await page.locator('#v11LogoutBtn').click();
            await page.locator('#v11LoginBtn').click();
            assert(await page.locator('#v11LoginModal.show').count());
            assert(!errors.length,'Page errors: '+errors.join(' | '));
            console.log('DATA_SEARCH_AOI_V8_INTEGRATION_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8765 >/tmp/data-search-integration-http.log 2>&1 &
          server=$!;trap 'kill $server || true' EXIT
          sleep 2
          node integration-test.js

      - name: Publish integrated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aoi-tool-multi-v8-embed.html data-search-integrated-v8.html data-search-restored.html data-search.html
          git commit -m 'Embed AOI V8 in DATA SEARCH with charcoal rose theme'
          git push origin gh-pages
