name: Inspect full button audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-all-buttons-audit.yml'
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for audits
        run: |
          python3 - <<'PY'
          import json,urllib.request,time
          url='https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=50'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer ${{ github.token }}','Accept':'application/vnd.github+json'})
          names=['Audit all DATA SEARCH and AOI buttons','Fast audit all DATA SEARCH and AOI buttons']
          found={}
          for _ in range(60):
              data=json.load(urllib.request.urlopen(req))
              for name in names:
                  rows=[r for r in data.get('workflow_runs',[]) if r.get('name')==name]
                  if rows: found[name]=rows[0]
              if all(found.get(n,{}).get('status')=='completed' for n in names): break
              time.sleep(10)
          out={n:{k:found.get(n,{}).get(k) for k in ['id','status','conclusion','head_sha','jobs_url','html_url']} for n in names}
          open('all-buttons-audit-status.json','w').write(json.dumps(out,indent=2))
          PY
      - name: Commit status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-buttons-audit-status.json
          git commit -m 'Record button audit statuses' || true
          git push origin main
