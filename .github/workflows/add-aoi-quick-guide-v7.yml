name: Add AOI quick guide V7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-aoi-quick-guide-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Add quick guide button and Chinese instructions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('aoi-tool-full-v6.html')
          s=p.read_text(encoding='utf-8')
          if 'AOI_QUICK_GUIDE_V7' in s:
              Path('aoi-tool-full-v7.html').write_text(s,encoding='utf-8')
              raise SystemExit(0)

          style='''
          .quick-guide-btn{margin-top:10px;border-color:#c83f72!important;color:#a92f5a!important;background:#fff!important;font-weight:850!important;letter-spacing:.3px}
          .quick-guide-btn:hover{background:#fbe8f0!important;border-color:#a92f5a!important}
          .quick-guide-intro{margin:0 0 14px;padding:13px 15px;border-left:4px solid #c83f72;background:#fbe8f0;border-radius:8px;color:#3d4148;font-size:12px;line-height:1.7}
          .quick-guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
          .quick-guide-card{border:1px solid #d7dddd;border-radius:10px;padding:12px;background:#fff}
          .quick-guide-card strong{display:block;color:#c83f72;margin-bottom:6px;font-size:12px}
          .quick-guide-card p,.quick-guide-card li{font-size:11px;line-height:1.65;color:#4e5a5d;margin:0}
          .quick-guide-card ol,.quick-guide-card ul{margin:5px 0 0;padding-left:18px}
          .quick-guide-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:11px}
          .quick-guide-table th,.quick-guide-table td{border:1px solid #d7dddd;padding:8px 9px;text-align:left;vertical-align:top}
          .quick-guide-table th{background:#2b2e34;color:#fff}.quick-guide-table td:first-child{font-weight:800;color:#a92f5a;white-space:nowrap}
          @media(max-width:760px){.quick-guide-grid{grid-template-columns:1fr}}
          '''
          assert '</style>' in s
          s=s.replace('</style>',style+'\n</style>',1)

          old='<div class="card soft" id="targetCard"><div class="card-head"><div><strong>Active target</strong></div><span>DRAW / IMPORT DESTINATION</span></div><div class="grid2"><button class="btn primary" id="targetA" onclick="setTarget(\'A\')">Primary AOI A</button><button class="btn" id="targetB" onclick="setTarget(\'B\')">Secondary AOI B</button></div><div class="hint">All new drawings, imports and named boundaries are assigned to the selected target.</div></div>'
          new='<div class="card soft" id="targetCard"><div class="card-head"><div><strong>Active target</strong></div><span>DRAW / IMPORT DESTINATION</span></div><div class="grid2"><button class="btn primary" id="targetA" onclick="setTarget(\'A\')">Primary AOI A</button><button class="btn" id="targetB" onclick="setTarget(\'B\')">Secondary AOI B</button></div><button class="btn wide quick-guide-btn" id="quickGuideButton" onclick="openQuickGuide()">使用说明</button><div class="hint">All new drawings, imports and named boundaries are assigned to the selected target.</div></div>'
          assert old in s, 'target card not found'
          s=s.replace(old,new,1)

          modal='''<div class="modal-backdrop" id="quickGuideModal"><div class="modal"><div class="modal-head"><h3>AOI TOOL 使用说明</h3><button class="close" onclick="closeQuickGuide()">×</button></div><div class="modal-body">
          <div class="quick-guide-intro"><strong>最简单的理解：</strong>AOI A 是主要项目范围，AOI B 是用来比较、裁切或计算的第二个范围。粉色按钮表示当前新绘制或新导入的数据会进入哪个 AOI。</div>
          <div class="quick-guide-grid">
            <div class="quick-guide-card"><strong>一、推荐操作顺序</strong><ol><li>选择 Primary AOI A。</li><li>绘制或导入主项目范围。</li><li>需要对比时，选择 Secondary AOI B，再绘制或导入第二个范围。</li><li>在 AOI Collection 中勾选需要显示和参与运算的范围。</li><li>选择叠加运算、调整或导出。</li></ol></div>
            <div class="quick-guide-card"><strong>二、自行绘制范围</strong><ul><li>单击：依次确定各个拐点。</li><li>双击最后一个点：完成绘制并自动闭合。</li><li>不需要把最后一点重新放到第一个点上。</li><li>地图上的 km 按钮可显示或隐藏每条边的长度。</li></ul></div>
            <div class="quick-guide-card"><strong>三、显示与编辑</strong><ul><li>勾选 AOI：显示在地图上并参与运算。</li><li>取消勾选：隐藏且不参与运算。</li><li>点击 AOI 名称后，再点 Edit Active。</li><li>拖动顶点修改边界，最后点 Save Edit 保存。</li></ul></div>
            <div class="quick-guide-card"><strong>四、导入与导出</strong><ul><li>可导入 GeoJSON、JSON、KML、KMZ。</li><li>可导出 GeoJSON、KML、KMZ、WKT、CSV、Shapefile ZIP 和 GIS Package ZIP。</li><li>导出前先在 Export selection 中选择目标图层。</li></ul></div>
          </div>
          <table class="quick-guide-table"><tr><th>运算</th><th>作用</th></tr><tr><td>Merge / Union</td><td>把 A 和 B 合并成一个完整范围。</td></tr><tr><td>Intersection</td><td>只保留 A 和 B 重叠的部分。</td></tr><tr><td>A minus B</td><td>保留 A 中没有被 B 覆盖的部分，常用于计算缺失范围。</td></tr><tr><td>B minus A</td><td>保留 B 中位于 A 外部的部分。</td></tr><tr><td>XOR</td><td>保留双方不重叠的区域，删除共同部分。</td></tr><tr><td>Split</td><td>同时生成 A 与 B 的重叠部分和 A 的剩余部分。</td></tr></table>
          </div></div></div>'''
          anchor='<div class="modal-backdrop" id="helpModal">'
          assert anchor in s, 'help modal anchor not found'
          s=s.replace(anchor,modal+'\n'+anchor,1)

          old="function openHelp(){document.getElementById('helpModal').classList.add('show')}function closeHelp(){document.getElementById('helpModal').classList.remove('show')}"
          new="function openQuickGuide(){document.getElementById('quickGuideModal').classList.add('show')}function closeQuickGuide(){document.getElementById('quickGuideModal').classList.remove('show')}\n"+old
          assert old in s, 'help functions not found'
          s=s.replace(old,new,1)

          old="window.addEventListener('keydown',e=>{if(e.key==='Escape')closeHelp()});"
          new="window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeQuickGuide();closeHelp()}});"
          assert old in s, 'escape handler not found'
          s=s.replace(old,new,1)

          s=s.replace('<title>AOI TOOL</title>','<!-- AOI_QUICK_GUIDE_V7 -->\n<title>AOI TOOL</title>',1)
          p.write_text(s,encoding='utf-8')
          Path('aoi-tool-full-v7.html').write_text(s,encoding='utf-8')
          PY

      - name: Install browser test engine
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Test guide button and modal
        shell: bash
        run: |
          set -euo pipefail
          cat > test-guide.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1500,height:1000}});
            const errors=[];p.on('pageerror',e=>errors.push(e.message));
            await p.goto('http://127.0.0.1:8765/aoi-tool-full-v7.html',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.querySelectorAll('.collection-row').length===2);
            const btn=p.locator('#quickGuideButton');
            if(await btn.count()!==1)throw new Error('使用说明按钮不存在');
            await btn.click();
            if(await p.locator('#quickGuideModal.show').count()!==1)throw new Error('使用说明弹窗未打开');
            const text=await p.locator('#quickGuideModal').innerText();
            for(const t of ['推荐操作顺序','自行绘制范围','A minus B','Shapefile ZIP'])if(!text.includes(t))throw new Error('说明缺少：'+t);
            await p.locator('#quickGuideModal .close').click();
            if(await p.locator('#quickGuideModal.show').count())throw new Error('弹窗未关闭');
            if(errors.length)throw new Error(errors.join(' | '));
            console.log('AOI_QUICK_GUIDE_V7_PASS');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8765 >/tmp/aoi-guide-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node test-guide.js

      - name: Publish V7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aoi-tool-full-v6.html aoi-tool-full-v7.html
          git commit -m 'Add Chinese quick guide below active target'
          git push origin gh-pages
