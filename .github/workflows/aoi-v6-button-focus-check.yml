name: AOI V6 all buttons check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aoi-v6-button-focus-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run focused button checks
        run: |
          cat > focus.js <<'JS'
          const {chromium}=require('playwright');
          const assert=(x,m)=>{if(!x)throw new Error(m)};
          const results=[];
          async function check(name,fn){let browser,context;try{browser=await chromium.launch({headless:true});context=await browser.newContext({viewport:{width:1600,height:1000}});await context.addInitScript(()=>{window.__downloads=[];HTMLAnchorElement.prototype.click=function(){if(this.download)window.__downloads.push(this.download)};window.confirm=()=>true;window.prompt=()=> 'DD';});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));await page.goto('http://127.0.0.1:8765/aoi-tool-full-v6.html',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.L&&window.turf&&document.querySelectorAll('.collection-row').length===2);await fn(page);await page.waitForTimeout(200);if(errors.length)throw new Error(errors.join(' | '));results.push({name,status:'PASS'});console.log('PASS',name)}catch(e){results.push({name,status:'FAIL',error:e.message});console.error('FAIL',name,e.stack||e)}finally{if(context)await context.close();if(browser)await browser.close()}}
          (async()=>{
            await check('Load Demo repopulates exactly two rows',async p=>{await p.getByRole('button',{name:'Load Demo'}).click();await p.waitForFunction(()=>document.querySelectorAll('.collection-row').length===2);const names=await p.locator('.collection-name').allInnerTexts();assert(names.every(x=>/Demo_AOI/.test(x)),'Unexpected demo rows '+names.join(','))});
            await check('Edit Active exposes editable vertices and can commit',async p=>{await p.getByRole('button',{name:'Edit Active'}).click();await p.waitForTimeout(300);const markers=await p.locator('.leaflet-editing-icon').count();assert(markers>0,'No editable vertex handles appeared');const hasSave=await p.locator('button,a').filter({hasText:/Save|Done|Finish/i}).count();assert(hasSave>0,'No visible Save/Done control for committing edits')});
            await check('Intersection exact button produces result',async p=>{const before=await p.locator('.collection-row').count();await p.locator("button[onclick=\"runOverlay('intersection')\"]").click();await p.waitForFunction(n=>document.querySelectorAll('.collection-row').length>n,before);assert(/Operation Result|Intersection/.test(await p.locator('#resultList').innerText()),'Intersection result missing')});
            await check('All eight exact export buttons generate downloads',async p=>{await p.evaluate(()=>{const o=turf.clone(state.features.A),a=turf.transformTranslate(o,2,90,{units:'kilometers'});state.features.original=normalizeFeature(o);state.features.adjusted=normalizeFeature(a);renderLayer('original');renderLayer('adjusted');refreshAll()});await p.locator('.rail-btn[data-panel="export"]').click();const cases=[["exportData('geojson')",'.geojson'],["exportData('kml')",'.kml'],["exportData('kmz')",'.kmz'],["exportData('wkt')",'.wkt'],["exportData('csv')",'.csv'],["exportData('shp')",'.zip'],["exportData('package')",'.zip'],['exportComparisonReport()','.html']];for(const [call,ext] of cases){const n=await p.evaluate(()=>window.__downloads.length);await p.locator(`button[onclick="${call}"]`).click();await p.waitForFunction(x=>window.__downloads.length>x,n,{timeout:12000});const f=await p.evaluate(()=>window.__downloads.at(-1));assert(f.toLowerCase().endsWith(ext),call+' => '+f)}});
            await check('Zoom in and zoom out change zoom after animation',async p=>{const z0=await p.evaluate(()=>map.getZoom());await p.locator('button[title="Zoom in"]').click();await p.waitForTimeout(600);const z1=await p.evaluate(()=>map.getZoom());assert(z1>z0,`Zoom in unchanged ${z0} -> ${z1}`);await p.locator('button[title="Zoom out"]').click();await p.waitForTimeout(600);const z2=await p.evaluate(()=>map.getZoom());assert(z2<z1,`Zoom out unchanged ${z1} -> ${z2}`)});
            await check('Measure tools do not alter AOI count or active geometry',async p=>{const rows0=await p.locator('.collection-row').count();const geom0=await p.evaluate(()=>JSON.stringify(state.features.A));await p.locator('button[title="Measure distance"]').click();await p.evaluate(()=>map.fire(L.Draw.Event.CREATED,{layer:L.polyline([[1.30,103.78],[1.32,103.82]])}));await p.waitForTimeout(200);const rows1=await p.locator('.collection-row').count();const geom1=await p.evaluate(()=>JSON.stringify(state.features.A));assert(rows1===rows0,`Distance measurement changed row count ${rows0}->${rows1}`);assert(geom1===geom0,'Distance measurement replaced AOI A');await p.locator('button[title="Measure area"]').click();await p.evaluate(()=>map.fire(L.Draw.Event.CREATED,{layer:L.polygon([[1.30,103.78],[1.30,103.82],[1.34,103.82]])}));await p.waitForTimeout(200);const rows2=await p.locator('.collection-row').count();const geom2=await p.evaluate(()=>JSON.stringify(state.features.A));assert(rows2===rows0,`Area measurement changed row count ${rows0}->${rows2}`);assert(geom2===geom0,'Area measurement replaced AOI A')});
            const failed=results.filter(x=>x.status==='FAIL');console.log('FOCUS_SUMMARY '+JSON.stringify({total:results.length,passed:results.length-failed.length,failed:failed.length,failures:failed},null,2));if(failed.length)process.exit(1)
          })();
          JS
          python3 -m http.server 8765 >/tmp/focus-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node focus.js
