name: AOI V6 drawing UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aoi-v6-drawing-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Build V6 drawing experience
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          src=Path('aoi-tool-full-v5.html')
          out=Path('aoi-tool-full-v6.html')
          s=src.read_text(encoding='utf-8')
          s=s.replace('<!-- AOI_FULL_V5_DEEP_GRAY_ROSE -->','<!-- AOI_FULL_V6_DRAWING_UX -->',1)

          css='''
          /* V6 drawing UX */
          .leaflet-container.aoi-drawing,.leaflet-container.aoi-drawing *{cursor:default!important}
          .edge-length-label-wrap{background:transparent!important;border:0!important}
          .edge-length-label{display:inline-block;transform:translate(-50%,-50%);padding:3px 6px;border-radius:6px;background:rgba(32,34,39,.92);border:1px solid rgba(225,90,139,.9);color:#fff;font:700 10px/1.1 Inter,"Segoe UI",Arial,sans-serif;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.22);pointer-events:none}
          .map-tools-pro button.edge-lengths-on{background:#c83f72;color:#fff;border-color:#c83f72}
          '''
          s=s.replace('</style>','%s\n</style>'%css,1)

          # Remove any bilingual/language toggle markup if an older variant reappears.
          s=re.sub(r'<button[^>]*(?:id|class|data-[^=]+)=["\'][^"\']*(?:lang|language)[^"\']*["\'][^>]*>.*?</button>','',s,flags=re.I|re.S)
          s=re.sub(r'<button[^>]*>\s*(?:中文|中英文|English\s*/\s*中文|中文\s*/\s*English|EN\s*/\s*中|中\s*/\s*EN)\s*</button>','',s,flags=re.I|re.S)

          old="function startDraw(type){if(!window.L?.Draw){toast('Drawing unavailable','Leaflet Draw did not load.',true);return}const C=type==='rectangle'?L.Draw.Rectangle:L.Draw.Polygon;new C(map,{shapeOptions:{color:COLORS[state.target],weight:2.5,fillOpacity:.13},showArea:true}).enable()}"
          new="""let activeDrawHandler=null,activeDrawDblClick=null;
          function finishDrawUi(){map.getContainer().classList.remove('aoi-drawing');if(activeDrawDblClick){map.off('dblclick',activeDrawDblClick);activeDrawDblClick=null}if(map.doubleClickZoom&&!map.doubleClickZoom.enabled())map.doubleClickZoom.enable();activeDrawHandler=null}
          function startDraw(type){if(!window.L?.Draw){toast('Drawing unavailable','Leaflet Draw did not load.',true);return}if(activeDrawHandler&&activeDrawHandler.enabled?.())activeDrawHandler.disable();finishDrawUi();const C=type==='rectangle'?L.Draw.Rectangle:L.Draw.Polygon;const options={shapeOptions:{color:COLORS[state.target],weight:2.5,fillOpacity:.13},showArea:true,showLength:true,metric:['km','m'],feet:false,nautic:false,precision:{km:2,m:0}};activeDrawHandler=new C(map,options);map.getContainer().classList.add('aoi-drawing');if(type==='polygon'){map.doubleClickZoom.disable();activeDrawDblClick=e=>{const count=activeDrawHandler?._markers?.length||0;if(activeDrawHandler&&activeDrawHandler.enabled?.()&&count>=3){if(e.originalEvent){L.DomEvent.preventDefault(e.originalEvent);L.DomEvent.stopPropagation(e.originalEvent)}activeDrawHandler.completeShape()}};map.on('dblclick',activeDrawDblClick)}activeDrawHandler.enable()}
          map.on(L.Draw.Event.CREATED,()=>setTimeout(finishDrawUi,0));map.on('draw:drawstop',finishDrawUi);
          window.__aoiDrawV6={get handler(){return activeDrawHandler},finish:()=>activeDrawHandler?.completeShape?.()};"""
          assert old in s
          s=s.replace(old,new,1)

          old="const pro={collection:[],selected:new Set(),activeId:null,layers:new Map(),labels:new Map(),baseIndex:0,measure:null,settings:{named:true,rules:true,overlay:true,geometry:true,compare:true,export:true,coordinates:true,maptools:true}};"
          new="const pro={collection:[],selected:new Set(),activeId:null,layers:new Map(),labels:new Map(),edgeLabels:new Map(),showEdgeLengths:true,baseIndex:0,measure:null,settings:{named:true,rules:true,overlay:true,geometry:true,compare:true,export:true,coordinates:true,maptools:true}};"
          assert old in s
          s=s.replace(old,new,1)

          old="function drawCollection(item){const old=pro.layers.get(item.id);if(old)map.removeLayer(old);const layer=L.geoJSON(item.feature,{style:{color:item.color,weight:2,fillColor:item.color,fillOpacity:.08}});if(item.visible)layer.addTo(map);layer.on('click',()=>activateCollection(item.id,true));pro.layers.set(item.id,layer)}"
          new="function drawCollection(item){const old=pro.layers.get(item.id);if(old)map.removeLayer(old);const layer=L.geoJSON(item.feature,{style:{color:item.color,weight:2,fillColor:item.color,fillOpacity:.08}});if(item.visible)layer.addTo(map);layer.on('click',()=>activateCollection(item.id,true));pro.layers.set(item.id,layer);syncEdgeLabels(item)}"
          assert old in s
          s=s.replace(old,new,1)

          old="function removeCollection(id){const item=pro.collection.find(x=>x.id===id);if(!item)return;if(!confirm(`Delete ${item.name}?`))return;const l=pro.layers.get(id);if(l)map.removeLayer(l);pro.layers.delete(id);clearVertexLabels(id);pro.selected.delete(id);pro.collection=pro.collection.filter(x=>x.id!==id);if(pro.activeId===id)pro.activeId=pro.collection[0]?.id||null;renderCollection();refreshProMetrics()}"
          new="function removeCollection(id){const item=pro.collection.find(x=>x.id===id);if(!item)return;if(!confirm(`Delete ${item.name}?`))return;const l=pro.layers.get(id);if(l)map.removeLayer(l);pro.layers.delete(id);clearVertexLabels(id);clearEdgeLabels(id);pro.selected.delete(id);pro.collection=pro.collection.filter(x=>x.id!==id);if(pro.activeId===id)pro.activeId=pro.collection[0]?.id||null;renderCollection();refreshProMetrics()}"
          assert old in s
          s=s.replace(old,new,1)

          old="function toggleCollection(id){const item=pro.collection.find(x=>x.id===id),l=pro.layers.get(id);if(!item||!l)return;item.visible=!item.visible;if(item.visible){pro.selected.add(id);if(!map.hasLayer(l))l.addTo(map)}else{pro.selected.delete(id);if(map.hasLayer(l))map.removeLayer(l)}renderCollection()}"
          new="function toggleCollection(id){const item=pro.collection.find(x=>x.id===id),l=pro.layers.get(id);if(!item||!l)return;item.visible=!item.visible;if(item.visible){pro.selected.add(id);if(!map.hasLayer(l))l.addTo(map)}else{pro.selected.delete(id);if(map.hasLayer(l))map.removeLayer(l)}syncEdgeLabels(item);renderCollection()}"
          assert old in s
          s=s.replace(old,new,1)

          old="window.proToggleSelect=(id,on)=>{const item=pro.collection.find(x=>x.id===id),l=pro.layers.get(id);if(!item||!l)return;item.visible=on;if(on){pro.selected.add(id);if(!map.hasLayer(l))l.addTo(map)}else{pro.selected.delete(id);if(map.hasLayer(l))map.removeLayer(l)}renderCollection()};window.proActivate=id=>activateCollection(id,true);window.proDelete=id=>removeCollection(id);window.proVisible=id=>toggleCollection(id);"
          new="window.proToggleSelect=(id,on)=>{const item=pro.collection.find(x=>x.id===id),l=pro.layers.get(id);if(!item||!l)return;item.visible=on;if(on){pro.selected.add(id);if(!map.hasLayer(l))l.addTo(map)}else{pro.selected.delete(id);if(map.hasLayer(l))map.removeLayer(l)}syncEdgeLabels(item);renderCollection()};window.proActivate=id=>activateCollection(id,true);window.proDelete=id=>removeCollection(id);window.proVisible=id=>toggleCollection(id);"
          assert old in s
          s=s.replace(old,new,1)

          marker="function clearVertexLabels(id){const g=pro.labels.get(id);if(g)map.removeLayer(g);pro.labels.delete(id)}"
          addition="""
          function formatEdgeLength(km){return km>=1?km.toFixed(2)+' km':Math.round(km*1000)+' m'}
          function exteriorEdges(feature){const out=[];turf.flattenEach(feature,p=>{if(p.geometry?.type!=='Polygon')return;const ring=p.geometry.coordinates?.[0]||[];for(let i=1;i<ring.length;i++){const a=ring[i-1],b=ring[i];if(a[0]===b[0]&&a[1]===b[1])continue;out.push([a,b])}});return out}
          function clearEdgeLabels(id){const g=pro.edgeLabels.get(id);if(g)map.removeLayer(g);pro.edgeLabels.delete(id)}
          function syncEdgeLabels(item){clearEdgeLabels(item.id);if(!pro.showEdgeLengths||!item.visible)return;const group=L.layerGroup();exteriorEdges(item.feature).forEach(([a,b])=>{const km=turf.distance(turf.point(a),turf.point(b),{units:'kilometers'}),mid=turf.midpoint(turf.point(a),turf.point(b)).geometry.coordinates;L.marker([mid[1],mid[0]],{interactive:false,keyboard:false,icon:L.divIcon({className:'edge-length-label-wrap',html:`<span class=\"edge-length-label\">${formatEdgeLength(km)}</span>`,iconSize:null})}).addTo(group)});group.addTo(map);pro.edgeLabels.set(item.id,group)}
          function refreshEdgeLabels(){pro.collection.forEach(syncEdgeLabels);const b=document.getElementById('edgeLengthToggle');if(b)b.classList.toggle('edge-lengths-on',pro.showEdgeLengths)}
          window.toggleEdgeLengths=function(){pro.showEdgeLengths=!pro.showEdgeLengths;refreshEdgeLabels()};
          """
          assert marker in s
          s=s.replace(marker,marker+addition,1)

          old="const oldLoad=window.loadDemo;window.loadDemo=function(){oldLoad();setTimeout(()=>{pro.collection=[];pro.layers.forEach(l=>map.removeLayer(l));pro.layers.clear();pro.selected.clear();hideWorkspaceStateLayers();if(state.features.A)addCollection(state.features.A,'Demo_AOI_A','demo',false,false);if(state.features.B)addCollection(state.features.B,'Demo_AOI_B','demo',false,false);renderCollection();refreshProMetrics()},30)};"
          new="const oldLoad=window.loadDemo;window.loadDemo=function(){oldLoad();setTimeout(()=>{pro.collection=[];pro.layers.forEach(l=>map.removeLayer(l));pro.edgeLabels.forEach(l=>map.removeLayer(l));pro.layers.clear();pro.edgeLabels.clear();pro.selected.clear();hideWorkspaceStateLayers();if(state.features.A)addCollection(state.features.A,'Demo_AOI_A','demo',false,false);if(state.features.B)addCollection(state.features.B,'Demo_AOI_B','demo',false,false);renderCollection();refreshProMetrics()},30)};"
          assert old in s
          s=s.replace(old,new,1)

          old="const oldClear=window.clearAll;window.clearAll=function(show=true){oldClear(show);pro.layers.forEach(l=>map.removeLayer(l));pro.labels.forEach(l=>map.removeLayer(l));pro.collection=[];pro.layers.clear();pro.labels.clear();pro.selected.clear();pro.activeId=null;renderCollection();refreshProMetrics()};"
          new="const oldClear=window.clearAll;window.clearAll=function(show=true){oldClear(show);pro.layers.forEach(l=>map.removeLayer(l));pro.labels.forEach(l=>map.removeLayer(l));pro.edgeLabels.forEach(l=>map.removeLayer(l));pro.collection=[];pro.layers.clear();pro.labels.clear();pro.edgeLabels.clear();pro.selected.clear();pro.activeId=null;renderCollection();refreshProMetrics()};"
          assert old in s
          s=s.replace(old,new,1)

          old="<button onclick=\"fitProActive()\" title=\"Fit active AOI\">⌗</button>"
          new="<button id=\"edgeLengthToggle\" class=\"edge-lengths-on\" onclick=\"toggleEdgeLengths()\" title=\"Show / hide edge lengths\">km</button><button onclick=\"fitProActive()\" title=\"Fit active AOI\">⌗</button>"
          assert old in s
          s=s.replace(old,new,1)

          old="setTimeout(()=>{pro.collection=[];pro.layers.forEach(l=>map.removeLayer(l));pro.layers.clear();pro.selected.clear();hideWorkspaceStateLayers();if(state.features.A)addCollection(state.features.A,'Demo_AOI_A','demo',false,false);if(state.features.B)addCollection(state.features.B,'Demo_AOI_B','demo',false,false);renderCollection();applyStandaloneSettings();refreshProMetrics()},80);"
          new="setTimeout(()=>{pro.collection=[];pro.layers.forEach(l=>map.removeLayer(l));pro.edgeLabels.forEach(l=>map.removeLayer(l));pro.layers.clear();pro.edgeLabels.clear();pro.selected.clear();hideWorkspaceStateLayers();if(state.features.A)addCollection(state.features.A,'Demo_AOI_A','demo',false,false);if(state.features.B)addCollection(state.features.B,'Demo_AOI_B','demo',false,false);renderCollection();applyStandaloneSettings();refreshProMetrics();refreshEdgeLabels()},80);"
          assert old in s
          s=s.replace(old,new,1)

          cleanup="""
          document.documentElement.lang='en';
          document.querySelectorAll('#languageToggle,.language-toggle,[data-language],[data-lang]').forEach(x=>x.remove());
          document.querySelectorAll('button,[role=button]').forEach(x=>{const t=(x.textContent||'').trim();if(/^(中文|中英文|English\\s*\\/\\s*中文|中文\\s*\\/\\s*English|EN\\s*\\/\\s*中|中\\s*\\/\\s*EN)$/i.test(t))x.remove()});
          """
          s=s.replace("window.addEventListener('load',()=>{setTimeout(()=>{try{map.invalidateSize();}catch(e){}},120);});",cleanup+"\nwindow.addEventListener('load',()=>{setTimeout(()=>{try{map.invalidateSize();}catch(e){}},120);});",1)

          out.write_text(s,encoding='utf-8')
          assert 'AOI_FULL_V6_DRAWING_UX' in s
          assert 'completeShape()' in s
          assert 'edge-length-label' in s
          assert 'toggleEdgeLengths' in s
          assert 'showLength:true' in s
          print('V6 bytes',out.stat().st_size)
          PY

      - name: Install browser test engines
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser drawing tests
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v6-test.js <<'JS'
          const {chromium,firefox,webkit}=require('playwright');
          const engines={chromium,firefox,webkit};
          (async()=>{
            for(const [name,type] of Object.entries(engines)){
              const browser=await type.launch({headless:true});
              const page=await browser.newPage({viewport:{width:1500,height:950}});
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:8765/aoi-tool-full-v6.html',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.L&&window.turf&&document.querySelectorAll('.collection-row').length===2);
              const languageCount=await page.locator('#languageToggle,.language-toggle,[data-language],[data-lang]').count();
              if(languageCount)throw new Error(name+': language toggle remains');
              const boxes=page.locator('.collection-row input[type=checkbox]');
              if(await boxes.count()!==2)throw new Error(name+': demo AOI rows missing');
              await boxes.nth(0).check();await boxes.nth(1).check();
              await page.waitForFunction(()=>document.querySelectorAll('.edge-length-label').length>=8);
              const toggle=page.locator('#edgeLengthToggle');
              await toggle.click();await page.waitForFunction(()=>document.querySelectorAll('.edge-length-label').length===0);
              await toggle.click();await page.waitForFunction(()=>document.querySelectorAll('.edge-length-label').length>=8);
              await page.locator('button[title="Draw polygon"]').click();
              const cursor=await page.locator('#map').evaluate(e=>getComputedStyle(e).cursor);
              if(cursor!=='default')throw new Error(name+': drawing cursor is '+cursor);
              const box=await page.locator('#map').boundingBox();
              const before=await page.locator('.collection-row').count();
              await page.mouse.click(box.x+360,box.y+240);
              await page.mouse.click(box.x+500,box.y+210);
              await page.mouse.click(box.x+560,box.y+340);
              await page.mouse.dblclick(box.x+390,box.y+370,{delay:80});
              await page.waitForFunction(n=>document.querySelectorAll('.collection-row').length>n,before);
              await page.waitForFunction(()=>document.querySelectorAll('.edge-length-label').length>=12);
              const drawingClass=await page.locator('#map').evaluate(e=>e.classList.contains('aoi-drawing'));
              if(drawingClass)throw new Error(name+': drawing state did not finish');
              if(errors.length)throw new Error(name+': '+errors.join(' | '));
              console.log('PASS',name);
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8765 >/tmp/v6-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node /tmp/v6-test.js

      - name: Commit V6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aoi-tool-full-v6.html
          git commit -m 'Add cross-browser double-click AOI drawing and edge lengths'
          git push origin gh-pages
