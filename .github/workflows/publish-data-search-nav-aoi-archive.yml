name: Publish DATA SEARCH AOI Archive navigation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-data-search-nav-aoi-archive.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Publish cache-busting copy
        run: |
          cp data-search.html data-search-nav-aoi-archive.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search-nav-aoi-archive.html
          git commit -m 'Publish DATA SEARCH AOI and Archive navigation' || exit 0
          git push origin gh-pages
