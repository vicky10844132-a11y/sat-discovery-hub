name: Final lightweight full-button audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-light-full-button-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Build browser audit runner
        run: |
          cat > final-button-audit.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><title>Final Button Audit</title></head><body><pre id="result">RUNNING</pre><script>
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const waitFor=async(fn,ms=20000)=>{const end=Date.now()+ms;while(Date.now()<end){try{if(fn())return true}catch(e){}await sleep(80)}throw new Error('wait timeout')};
          const report={generated:new Date().toISOString(),states:[],targeted:[],summary:{buttons:0,clicked:0,disabled:0,skipped:0,missingHandlers:0,errors:0,passed:false}};
          function names(code){const out=[],re=/(?:^|[;,(?:])\s*([A-Za-z_$][\w$]*)\s*\(/g;let m;while((m=re.exec(code||'')))if(!['if','for','while','switch','function','setTimeout','setInterval','confirm','prompt','alert'].includes(m[1]))out.push(m[1]);return [...new Set(out)]}
          async function frame(file){const f=document.createElement('iframe');f.style.width='1200px';f.style.height='700px';f.src=file+'?audit='+Date.now();document.body.appendChild(f);await waitFor(()=>f.contentWindow?.document?.readyState==='complete');const w=f.contentWindow;w.alert=()=>{};w.confirm=()=>true;w.prompt=()=>'';w.open=()=>null;w.print=()=>{};try{w.HTMLAnchorElement.prototype.click=function(){this.dataset.auditClicked='1'}}catch(e){};try{w.fetch=async()=>new w.Response(JSON.stringify({type:'FeatureCollection',features:[],numberMatched:0,context:{matched:0}}),{status:200,headers:{'Content-Type':'application/json'}})}catch(e){};return {f,w}}
          function listen(w,errors){w.addEventListener('error',e=>errors.push(e.message||String(e.error||'error')));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason?.message||e.reason||'rejection')))}
          async function auditState(file,label,setup,ready){const {f,w}=await frame(file),errors=[];listen(w,errors);try{if(ready)await waitFor(()=>ready(w));if(setup)await setup(w);await sleep(160);const bs=[...w.document.querySelectorAll('button')].filter(b=>w.getComputedStyle(b).display!=='none'&&w.getComputedStyle(b).visibility!=='hidden');const row={label,total:bs.length,clicked:0,disabled:0,skipped:0,missing:[],errors};for(const b of bs){const code=b.getAttribute('onclick')||'';for(const n of names(code))if(!['document','window','location','Math','JSON','Date','URL','Blob'].includes(n)&&typeof w[n]!=='function')row.missing.push({text:(b.textContent||'').trim(),handler:n});if(b.disabled){row.disabled++;continue}if(/location\.|reload\s*\(|window\.open|\.submit\(/i.test(code)){row.skipped++;continue}try{b.click();row.clicked++;await sleep(15)}catch(e){errors.push((b.textContent||b.title||'button')+': '+e.message)}w.document.querySelectorAll('.show').forEach(x=>{if(/modal|mask|backdrop/i.test(x.className))x.classList.remove('show')})}report.states.push(row)}catch(e){errors.push(e.message);report.states.push({label,total:0,clicked:0,disabled:0,skipped:0,missing:[],errors})}f.remove()}
          async function target(name,file,fn,ready){const {f,w}=await frame(file),errors=[];listen(w,errors);try{if(ready)await waitFor(()=>ready(w));await fn(w);await sleep(250);report.targeted.push({name,ok:errors.length===0,errors})}catch(e){errors.push(e.message);report.targeted.push({name,ok:false,errors})}f.remove()}
          (async()=>{
            const dsFile='data-search-aoi-v9.html',aoiFile='aoi-tool-multi-v8.html';
            const dsReady=w=>w.document.querySelectorAll('#v11LoginBtn,#v11LogoutBtn').length===2&&w.document.querySelector('.rail-btn[data-panel="aoi"]');
            const aoiReady=w=>w.aoiPro?.collection?.length>=2;
            const ds=[['DS_ALL',null],['DS_AOI',w=>w.selectPanel('aoi')],['DS_SEARCH_ARCHIVE',w=>{w.selectPanel('search');w.setSearchTab('archive')}],['DS_SEARCH_TASKING',w=>{w.selectPanel('search');w.setSearchTab('tasking')}],['DS_SEARCH_SUBSCRIBE',w=>{w.selectPanel('search');w.setSearchTab('subscribe')}],['DS_ORBIT',w=>w.selectPanel('orbit')],['DS_SOURCES',w=>w.selectPanel('sources')],['DS_DATA',w=>w.selectPanel('data')],['DS_ORDERS',w=>w.selectPanel('orders')],['DS_ACCOUNT',w=>w.selectPanel('account')]];
            for(const [l,s] of ds)await auditState(dsFile,l,s,dsReady);
            const as=[['AOI_ALL',null],['AOI_BUILD',w=>w.showPanel('build')],['AOI_RULES',w=>w.showPanel('rules')],['AOI_OVERLAY',w=>w.showPanel('overlay')],['AOI_EXPORT',w=>w.showPanel('export')]];
            for(const [l,s] of as)await auditState(aoiFile,l,s,aoiReady);
            await target('Login and Logout',dsFile,async w=>{const top=[...w.document.querySelectorAll('.topbar button')].filter(x=>w.getComputedStyle(x).display!=='none').map(x=>x.textContent.trim()).sort();if(top.join('|')!=='Login|Logout')throw new Error('unexpected top buttons: '+top.join(','));w.v11Logout();w.v11OpenLogin();if(!w.document.getElementById('v11LoginModal').classList.contains('show'))throw new Error('login modal not shown')},dsReady);
            await target('AOI opens, closes and reopens with state',dsFile,async w=>{w.selectPanel('aoi');await waitFor(()=>w.document.querySelector('.app').classList.contains('aoi-tool-open'));const f=w.document.getElementById('embeddedAoiFrame');await waitFor(()=>f?.contentWindow?.aoiPro?.collection?.length>=2);const count=f.contentWindow.aoiPro.collection.length;w.selectPanel('search');await waitFor(()=>!w.document.querySelector('.app').classList.contains('aoi-tool-open'));w.selectPanel('aoi');await waitFor(()=>w.document.querySelector('.app').classList.contains('aoi-tool-open'));if(f.contentWindow.aoiPro.collection.length!==count)throw new Error('AOI state was not preserved')},dsReady);
            await target('AOI bridge to DATA SEARCH',dsFile,async w=>{w.selectPanel('aoi');const f=w.document.getElementById('embeddedAoiFrame');await waitFor(()=>f?.contentWindow?.aoiPro?.collection?.length>=2);const aw=f.contentWindow;for(const x of aw.aoiPro.collection.slice(0,2))aw.aoiPro.selected.add(x.id);aw.sendEmbeddedSelection();await waitFor(()=>!!w.__embeddedAoiGeometry);await waitFor(()=>!w.document.querySelector('.app').classList.contains('aoi-tool-open'))},dsReady);
            await target('Archive search',dsFile,async w=>{w.selectPanel('search');w.setSearchTab('archive');await waitFor(()=>w.document.getElementById('archiveStartDate'));await w.runArchiveSearch();await waitFor(()=>/No matching items|loaded|did not complete/.test(w.document.getElementById('searchContent')?.textContent||''))},dsReady);
            for(const type of ['merge','intersection','one-minus-many','many-minus-one','separate-minus-one','xor','split'])await target('AOI relation '+type,aoiFile,async w=>{for(const x of w.aoiPro.collection.slice(0,2))w.aoiPro.selected.add(x.id);w.openRelationModal();w.document.getElementById('relationType').value=type;w.updateRelationUI?.();w.executeRelationOperation();await sleep(150)},aoiReady);
            await target('Minimum edge check and adjustment',aoiFile,async w=>{w.showPanel('rules');const s=w.document.getElementById('edgeTargetSelect');if(s.options.length)s.selectedIndex=0;w.document.getElementById('multiMinEdge').value='20';w.checkSelectedEdges();await waitFor(()=>/Below|All edges/.test(w.document.getElementById('edgeCheckResult')?.textContent||''));if(!w.document.getElementById('adjustEdgesButton').disabled){w.adjustSelectedEdges();await waitFor(()=>/Closed/.test(w.document.getElementById('edgeAreaResult')?.textContent||''))}},aoiReady);
            for(const s of report.states){report.summary.buttons+=s.total;report.summary.clicked+=s.clicked;report.summary.disabled+=s.disabled;report.summary.skipped+=s.skipped;report.summary.missingHandlers+=s.missing.length;report.summary.errors+=s.errors.length}report.summary.errors+=report.targeted.filter(x=>!x.ok).length;report.summary.passed=report.summary.errors===0&&report.summary.missingHandlers===0;document.getElementById('result').textContent=JSON.stringify(report);document.body.dataset.result=report.summary.passed?'PASS':'FAIL';
          })().catch(e=>{report.fatal=e.message;report.summary.errors++;document.getElementById('result').textContent=JSON.stringify(report);document.body.dataset.result='FAIL'});
          </script></body></html>
          HTML
      - name: Execute Chrome audit
        run: |
          python3 -m http.server 8765 >/tmp/final-light-http.log 2>&1 &
          server=$!;trap 'kill $server || true' EXIT;sleep 2
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=120000 --dump-dom http://127.0.0.1:8765/final-button-audit.html > /tmp/final-audit-dom.html 2>/tmp/final-chrome.err || true
          python3 - <<'PY'
          from pathlib import Path
          from html import unescape
          import re,json
          dom=Path('/tmp/final-audit-dom.html').read_text(errors='ignore')
          m=re.search(r'<pre id="result">(.*?)</pre>',dom,re.S)
          if not m: raise SystemExit('audit output missing')
          text=unescape(m.group(1));Path('final-light-button-audit.json').write_text(text)
          data=json.loads(text);print(json.dumps(data['summary'],indent=2))
          if not data['summary'].get('passed'): raise SystemExit(1)
          PY
      - name: Save final audit report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -f final-light-button-audit.json || echo '{"summary":{"passed":false,"errors":1},"fatal":"report missing"}' > final-light-button-audit.json
          git add final-light-button-audit.json
          git commit -m 'Record final DATA SEARCH AOI full-button audit' || true
          git push origin gh-pages
