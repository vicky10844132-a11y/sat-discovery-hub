name: Inspect AOI V8 status
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v8-status.yml'
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query AOI V8 runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,urllib.request,time
          url='https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=40'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer ${{ github.token }}','Accept':'application/vnd.github+json'})
          names=['Debug AOI V8 initialization','Build AOI V8 multi-range workflow']
          found={}
          for _ in range(30):
              d=json.load(urllib.request.urlopen(req))
              for name in names:
                  rows=[r for r in d.get('workflow_runs',[]) if r.get('name')==name]
                  if rows: found[name]=rows[0]
              if found.get(names[0],{}).get('status')=='completed': break
              time.sleep(10)
          out={name:{'id':r.get('id'),'status':r.get('status'),'conclusion':r.get('conclusion'),'head_sha':r.get('head_sha'),'jobs_url':r.get('jobs_url'),'html_url':r.get('html_url')} for name,r in found.items()}
          open('v8-status.json','w').write(json.dumps(out,indent=2))
          PY
      - name: Commit status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v8-status.json
          git commit -m 'Record AOI V8 debug status' || exit 0
          git push origin main
