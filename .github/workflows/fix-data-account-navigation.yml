name: Fix Data and Account navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-data-account-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Patch labels and click actions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('data-search.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'\n?<!-- DATA_ACCOUNT_NAV_FIX_START -->.*?<!-- DATA_ACCOUNT_NAV_FIX_END -->\n?', '\n', html, flags=re.S)
          patch = r'''<!-- DATA_ACCOUNT_NAV_FIX_START -->
          <script id="data-account-nav-fix-v1">
          (function(){
            function label(button,text){
              if(!button)return;
              button.title=text;
              button.setAttribute('aria-label',text);
              var tip=button.querySelector('.tip');
              if(!tip){tip=document.createElement('span');tip.className='tip';button.appendChild(tip);}
              tip.textContent=text;
            }
            function activate(button){
              document.querySelectorAll('.rail .rail-btn').forEach(function(item){item.classList.remove('active');});
              if(button)button.classList.add('active');
            }
            function bind(button,panel){
              if(!button)return;
              button.type='button';
              button.onclick=function(event){
                event.preventDefault();
                event.stopImmediatePropagation();
                if(typeof window.selectPanel==='function')window.selectPanel(panel);
                else{
                  document.querySelectorAll('.panel-view').forEach(function(view){view.classList.remove('active');});
                  var target=document.getElementById('panel-'+panel);
                  if(target)target.classList.add('active');
                }
                activate(button);
                if(panel!=='account'&&window.map&&typeof window.map.invalidateSize==='function')setTimeout(function(){window.map.invalidateSize();},80);
                return false;
              };
            }
            function apply(){
              var rail=document.querySelector('.rail');
              if(!rail)return;
              var order=rail.querySelector('.rail-btn[data-panel="orders"]');
              var data=rail.querySelector('.rail-btn[data-panel="data"]');
              var account=rail.querySelector('.rail-btn[data-panel="account"]');
              label(order,'Order');
              label(data,'Data');
              label(account,'Account');
              bind(order,'orders');
              bind(data,'data');
              bind(account,'account');
              var bottom=rail.querySelector('.rail-bottom');
              if(bottom&&data){
                var settings=Array.prototype.find.call(bottom.querySelectorAll('.rail-btn'),function(button){
                  var text=((button.querySelector('.tip')||{}).textContent||button.title||'').trim();
                  return /settings|support|help/i.test(text);
                });
                if(settings&&data.nextElementSibling!==settings)bottom.insertBefore(data,settings);
              }
            }
            function schedule(){[0,100,300,800,1600].forEach(function(ms){setTimeout(apply,ms);});}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule,{once:true});else schedule();
            window.addEventListener('load',schedule,{once:true});
            document.addEventListener('click',function(){setTimeout(apply,0);},true);
          })();
          </script>
          <!-- DATA_ACCOUNT_NAV_FIX_END -->'''
          path.write_text(html.rstrip()+'\n'+patch+'\n',encoding='utf-8')
          PY

      - name: Publish patched page
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Data and Account navigation buttons'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
