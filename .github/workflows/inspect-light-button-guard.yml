name: Inspect lightweight button guard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-light-button-guard.yml'
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read lightweight guard status
        run: |
          python3 - <<'PY'
          import json,urllib.request,time
          url='https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=50'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer ${{ github.token }}','Accept':'application/vnd.github+json'})
          row={}
          for _ in range(45):
              data=json.load(urllib.request.urlopen(req))
              rows=[r for r in data.get('workflow_runs',[]) if r.get('name')=='Publish button guards with lightweight Chrome test']
              if rows:
                  row=rows[0]
                  if row.get('status')=='completed': break
              time.sleep(4)
          open('light-button-guard-status.json','w').write(json.dumps({k:row.get(k) for k in ['id','status','conclusion','head_sha','jobs_url','html_url']},indent=2))
          PY
      - name: Commit status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add light-button-guard-status.json
          git commit -m 'Record lightweight button guard status' || true
          git push origin main
