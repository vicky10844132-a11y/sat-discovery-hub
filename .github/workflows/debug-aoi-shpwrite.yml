# low-level retry
name: Debug AOI Shapefile runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-aoi-shpwrite.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify low-level writer and modern ZIP
        run: |
          cat > debug.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();await p.goto('http://127.0.0.1:8765/aoi-tool-full-v6.html',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.shpwrite?.write&&window.JSZip&&window.turf&&document.querySelectorAll('.collection-row').length===2);const r=await p.evaluate(async()=>{try{const f=enrichFeature(state.features.A,'A'),parts=[];turf.flattenEach(f,x=>{if(x.geometry?.type==='Polygon')parts.push(x)});if(!parts.length)throw new Error('No polygon parts');const zip=new JSZip(),folder=zip.folder('AOI_EXPORT');for(let i=0;i<parts.length;i++){const poly=parts[i],files=await new Promise((resolve,reject)=>shpwrite.write([poly.properties||{}],'POLYGON',[poly.geometry.coordinates],(err,out)=>err?reject(err):resolve(out)));const base=parts.length>1?'aoi_'+(i+1):'aoi';folder.file(base+'.shp',files.shp.buffer,{binary:true});folder.file(base+'.shx',files.shx.buffer,{binary:true});folder.file(base+'.dbf',files.dbf.buffer||files.dbf,{binary:true});folder.file(base+'.prj',files.prj||'');}const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});return {ok:true,parts:parts.length,size:blob.size,type:blob.type}}catch(e){return {ok:false,name:e.name,message:e.message,stack:e.stack}}});console.log('LOW_LEVEL_SHP '+JSON.stringify(r,null,2));await b.close();if(!r.ok||!r.size)process.exit(1)})().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8765 >/tmp/shp-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node debug.js
