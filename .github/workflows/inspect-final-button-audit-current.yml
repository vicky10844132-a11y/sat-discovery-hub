name: Inspect current final button audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-final-button-audit-current.yml'
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for current audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,urllib.request,time
          url='https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=50'
          row={}
          for _ in range(50):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer ${{ github.token }}','Accept':'application/vnd.github+json'})
              data=json.load(urllib.request.urlopen(req))
              rows=[r for r in data.get('workflow_runs',[]) if r.get('name')=='Final lightweight full-button audit']
              if rows:
                  row=rows[0]
                  if row.get('status')=='completed':break
              time.sleep(5)
          open('current-final-button-audit-status.json','w').write(json.dumps({k:row.get(k) for k in ['id','status','conclusion','head_sha','jobs_url','html_url']},indent=2))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add current-final-button-audit-status.json
          git commit -m 'Record current full-button audit status' || exit 0
          git push origin main
