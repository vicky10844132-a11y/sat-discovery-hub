name: Fix DATA SEARCH AOI direct replacement V6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-data-search-aoi-direct-replacement-v6.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Rebuild persistent AOI module
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/fix-data-search-aoi-direct-replacement-v5.yml > /tmp/v5.yml
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/v5.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,x in enumerate(lines) if "git fetch origin main" in x)
          py_start=next(i for i in range(start,len(lines)) if "python3 - <<'PY'" in lines[i])+1
          py_end=next(i for i in range(py_start,len(lines)) if lines[i].strip()=='PY')
          code='\n'.join(x[10:] if x.startswith('          ') else x for x in lines[py_start:py_end])
          Path('/tmp/build_base.py').write_text(code,encoding='utf-8')
          PY
          python3 /tmp/build_base.py
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/v5.yml').read_text(encoding='utf-8').splitlines()
          first_end=next(i for i,x in enumerate(lines) if x.strip()=='PY' and i>20)
          py_start=next(i for i in range(first_end+1,len(lines)) if "python3 - <<'PY'" in lines[i])+1
          py_end=next(i for i in range(py_start,len(lines)) if lines[i].strip()=='PY')
          code='\n'.join(x[10:] if x.startswith('          ') else x for x in lines[py_start:py_end])
          Path('/tmp/add_runtime.py').write_text(code,encoding='utf-8')
          PY
          python3 /tmp/add_runtime.py
          grep -q 'function ensureAoiButton()' data-search-aoi-v9.html
          grep -q 'DATA_SEARCH_AOI_V9_DIRECT_REPLACEMENT' data-search-aoi-v9.html
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Full visible-control validation
        shell: bash
        run: |
          set -euo pipefail
          cat > test.js <<'JS'
          const {chromium}=require('playwright');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:1000},acceptDownloads:true});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/data-search-aoi-v9.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelectorAll('#v11LoginBtn,#v11LogoutBtn').length===2,{timeout:20000});
            await page.waitForFunction(()=>document.querySelector('.rail-btn[data-panel="aoi"]'),{timeout:10000});
            await page.waitForTimeout(600);
            assert(await page.locator('#panel-search.active').count(),'Search should be the initial DATA SEARCH module');
            const aoiButton=page.locator('.rail-btn[data-panel="aoi"]').first();
            await aoiButton.click();
            await page.waitForFunction(()=>document.querySelector('.app')?.classList.contains('aoi-tool-open'));
            assert(await page.locator('#embeddedAoiStage').isVisible(),'AOI TOOL did not replace the DATA SEARCH workspace');

            const frame=page.frames().find(f=>f.url().includes('aoi-tool-multi-v8-embed.html'));
            assert(frame,'AOI TOOL frame missing');
            await frame.waitForFunction(()=>window.aoiPro&&Array.isArray(window.aoiPro.collection),null,{timeout:20000});
            if((await frame.evaluate(()=>window.aoiPro.collection.length))<2)await frame.evaluate(()=>window.loadDemo?.());
            await frame.waitForFunction(()=>window.aoiPro.collection.length>=2);
            const initialCount=await frame.evaluate(()=>window.aoiPro.collection.length);

            // Every visible AOI navigation entry must open its panel.
            const visiblePanels=await frame.locator('.rail-btn[data-panel]:visible').evaluateAll(bs=>bs.map(b=>b.dataset.panel));
            assert(visiblePanels.length>=4,'Visible AOI navigation entries are missing');
            for(const name of visiblePanels){
              const btn=frame.locator(`.rail-btn[data-panel="${name}"]:visible`).first();
              await btn.click();await frame.waitForTimeout(100);
              assert(await frame.locator(`#panel-${name}.active`).count(),`Visible AOI panel ${name} did not open`);
            }

            // Leave AOI, return to AOI, and preserve all ranges.
            await page.locator('.rail-btn[data-panel="search"]').click();
            await page.waitForFunction(()=>!document.querySelector('.app')?.classList.contains('aoi-tool-open'));
            await aoiButton.click();
            await page.waitForFunction(()=>document.querySelector('.app')?.classList.contains('aoi-tool-open'));
            assert.equal(await frame.evaluate(()=>window.aoiPro.collection.length),initialCount,'AOI state was lost after reopening');

            // Multi-AOI relationship operation.
            await frame.locator('.rail-btn[data-panel="build"]:visible').click();
            const boxes=frame.locator('.collection-row input[type=checkbox]');
            for(let i=0;i<2;i++)if(!(await boxes.nth(i).isChecked()))await boxes.nth(i).check();
            await frame.locator('.rail-btn[data-panel="overlay"]:visible').click();
            await frame.getByRole('button',{name:'Operation Relationship'}).click();
            assert(await frame.locator('#relationModal.show').count(),'Relationship modal did not open');
            await frame.selectOption('#relationType','merge');
            await frame.getByRole('button',{name:'Execute Operation'}).click();
            await frame.waitForFunction(n=>window.aoiPro.collection.length>n,initialCount);

            // Minimum edge check.
            await frame.locator('.rail-btn[data-panel="rules"]:visible').click();
            await frame.selectOption('#edgeTargetSelect',{index:0});
            await frame.fill('#multiMinEdge','20');
            await frame.getByRole('button',{name:'Start Check'}).click();
            assert((await frame.locator('#edgeCheckResult').innerText()).trim().length>0,'Edge check returned no result');

            // Apply selected AOI to DATA SEARCH, then reopen AOI again.
            await frame.locator('.rail-btn[data-panel="build"]:visible').click();
            await frame.locator('#useInDataSearchBtn').click();
            await page.waitForFunction(()=>!!window.__embeddedAoiGeometry,{timeout:12000});
            await page.waitForFunction(()=>!document.querySelector('.app')?.classList.contains('aoi-tool-open'));
            assert((await page.locator('#activeAoiLabel').innerText()).includes('exact polygon search'));
            await page.locator('.rail-btn[data-panel="aoi"]').first().click();
            await page.waitForFunction(()=>document.querySelector('.app')?.classList.contains('aoi-tool-open'));
            assert(await page.locator('#embeddedAoiStage').isVisible(),'AOI TOOL could not reopen after applying a search range');

            // DATA SEARCH visible module entries and Login/Logout.
            const dataPanels=['search','orbit','sources','clientapi','subscriptions','data','orders','account'];
            for(const name of dataPanels){
              const btn=page.locator(`.rail-btn[data-panel="${name}"]:visible`).first();
              if(await btn.count()){await btn.click();await page.waitForTimeout(100);assert(!(await page.locator('.app').evaluate(x=>x.classList.contains('aoi-tool-open'))));}
            }
            const visibleTop=await page.locator('.topbar button:visible').allTextContents();
            assert(visibleTop.map(x=>x.trim()).filter(Boolean).every(x=>['Login','Logout'].includes(x)),'Unexpected top button remains');
            await page.locator('#v11LogoutBtn').click();
            await page.locator('#v11LoginBtn').click();
            assert(await page.locator('#v11LoginModal.show').count(),'Login dialog did not open');
            assert(!errors.length,'Page errors: '+errors.join(' | '));
            console.log('DATA_SEARCH_AOI_V9_VISIBLE_CONTROLS_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8765 >/tmp/aoi-v9-v6-http.log 2>&1 &
          server=$!;trap 'kill $server || true' EXIT;sleep 2;node test.js
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions-bot@users.noreply.github.com'
          git add data-search-aoi-v9.html data-search-integrated-v8.html data-search-restored.html data-search.html
          git commit -m 'Publish persistent AOI TOOL replacement in DATA SEARCH'
          git push origin gh-pages
