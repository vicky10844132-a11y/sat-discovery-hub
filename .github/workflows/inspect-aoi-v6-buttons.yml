# refresh 5
name: Inspect AOI V6 button check

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find AOI checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=70" > /tmp/runs.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/runs.json'))
          names={'AOI V6 all buttons check','Fix AOI V6 edit and measure','Fix AOI V6 Shapefile final','Debug AOI Shapefile runtime'}
          rows=[r for r in d.get('workflow_runs',[]) if r.get('name') in names]
          if not rows: raise SystemExit('No AOI check run found')
          for r in rows[:20]: print('AOI_RUN',r['name'],r['id'],r['status'],r.get('conclusion'),r['head_sha'],r['html_url'])
          PY
