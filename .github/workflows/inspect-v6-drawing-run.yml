# check 2
name: Inspect V6 drawing run

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest V6 workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            'https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=40' > /tmp/runs.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/runs.json'))
          found=[]
          for r in d.get('workflow_runs',[]):
              if r.get('name')=='AOI V6 drawing UX':
                  found.append(r)
          if not found:
              raise SystemExit('No AOI V6 drawing UX run found')
          for r in found[:5]:
              print('V6_RUN',r['id'],r['status'],r.get('conclusion'),r['head_sha'],r['html_url'])
          PY
