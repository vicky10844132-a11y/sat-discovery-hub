name: AOI V6 fixed rerun

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aoi-v6-rerun-fixed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published branch and all refs
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Extract V6 build and test scripts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/aoi-v6-drawing-ux.yml > /tmp/original-v6.yml
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/original-v6.yml').read_text().splitlines()
          def extract(step_name,out):
              start=next(i for i,l in enumerate(lines) if l.strip()==f'- name: {step_name}')
              run=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |')
              indent=len(lines[run])-len(lines[run].lstrip())+2
              body=[]
              for l in lines[run+1:]:
                  if l.strip() and len(l)-len(l.lstrip())<indent: break
                  body.append(l[indent:] if len(l)>=indent else '')
              Path(out).write_text('\n'.join(body)+'\n')
          extract('Build V6 drawing experience','/tmp/build-v6.sh')
          extract('Cross-browser drawing tests','/tmp/test-v6.sh')
          PY
          chmod +x /tmp/build-v6.sh /tmp/test-v6.sh
          grep -q 'aoi-tool-full-v6.html' /tmp/build-v6.sh
          grep -q 'playwright' /tmp/test-v6.sh

      - name: Build V6
        shell: bash
        run: /tmp/build-v6.sh

      - name: Install browser test engines
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Run Chromium Firefox and WebKit tests
        shell: bash
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: /tmp/test-v6.sh

      - name: Commit V6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aoi-tool-full-v6.html
          git commit -m 'Publish AOI V6 cross-browser drawing experience'
          git push origin gh-pages
