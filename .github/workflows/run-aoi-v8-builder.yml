name: Run AOI V8 builder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-aoi-v8-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0

      - name: Extract and run V8 builder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          raw=Path('source/.github/workflows/build-aoi-v8-multi.yml').read_text(encoding='utf-8')
          marker="python3 - <<'PY'\n"
          start=raw.index(marker)+len(marker)
          end=raw.index("\n          PY",start)
          lines=raw[start:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          os.chdir('site')
          exec(compile(code,'build_aoi_v8.py','exec'),{'__name__':'__main__'})
          PY

      - name: Add legacy refresh compatibility nodes
        working-directory: site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('aoi-tool-full-v8.html')
          s=p.read_text(encoding='utf-8')
          compat='''<div id="v8LegacyCompatibility" style="display:none!important"><div id="ruleMetrics"></div><input id="minArea" value="0"><input id="minWidth" value="0"><select id="adjustAnchor"><option value="center">center</option></select><div id="adjustSummary"></div><div id="overlayInputs"></div></div>'''
          anchor='<div class="toast-wrap" id="toasts"></div>'
          assert anchor in s
          s=s.replace(anchor,compat+'\n'+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Install browser test driver
        working-directory: site
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@latest --no-audit --no-fund
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Extract and run V8 browser test
        working-directory: site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('../source/.github/workflows/build-aoi-v8-multi.yml').read_text(encoding='utf-8')
          marker="cat > test-v8.js <<'JS'\n"
          start=raw.index(marker)+len(marker)
          end=raw.index("\n          JS",start)
          lines=raw[start:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          code=code.replace("require('playwright')","require('playwright-core')")
          code=code.replace("chromium.launch({headless:true})","chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox']})")
          Path('test-v8.js').write_text(code,encoding='utf-8')
          PY
          python3 -m http.server 8765 >/tmp/aoi-v8-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node test-v8.js

      - name: Publish V8
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aoi-tool-full-v8.html
          git commit -m 'Publish AOI V8 multi-range workflow and edge adjustment'
          git push origin gh-pages
