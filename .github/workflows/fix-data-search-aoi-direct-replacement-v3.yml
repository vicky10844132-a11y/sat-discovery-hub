name: Fix DATA SEARCH AOI direct replacement V3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-data-search-aoi-direct-replacement-v3.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Build with exact rail button replacement
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/fix-data-search-aoi-direct-replacement-v2.yml > /tmp/v2.yml
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/v2.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,x in enumerate(lines) if "python3 - <<'PY'" in x)+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          raw=[x[10:] if x.startswith('          ') else x for x in lines[start:end]]
          out=[]
          inserted=False
          for line in raw:
              if line.strip().startswith('s=re.sub') and 'data-panel="aoi"' in line:
                  continue
              if line.strip().startswith('s=re.sub') and 'data-panel="search"' in line:
                  continue
              out.append(line)
              if "DATA_SEARCH_AOI_V9_DIRECT_REPLACEMENT" in line and not inserted:
                  out.extend([
                    "s=s.replace('<button class=\"rail-btn active\" data-panel=\"aoi\"','<button class=\"rail-btn\" data-panel=\"aoi\"',1)",
                    "s=s.replace('<button class=\"rail-btn\" data-panel=\"search\"','<button class=\"rail-btn active\" data-panel=\"search\"',1)",
                  ])
                  inserted=True
          Path('/tmp/build_v3.py').write_text('\n'.join(out),encoding='utf-8')
          PY
          python3 /tmp/build_v3.py
          grep -n 'data-panel="aoi"' data-search-aoi-v9.html | head
          grep -q '<button class="rail-btn" data-panel="aoi"' data-search-aoi-v9.html
          grep -q '<button class="rail-btn active" data-panel="search"' data-search-aoi-v9.html
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run V2 validation suite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/v2.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,x in enumerate(lines) if "cat > test.js <<'JS'" in x)+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='JS')
          code='\n'.join(x[10:] if x.startswith('          ') else x for x in lines[start:end])
          Path('test.js').write_text(code,encoding='utf-8')
          PY
          python3 -m http.server 8765 >/tmp/aoi-v9-v3-http.log 2>&1 &
          server=$!;trap 'kill $server || true' EXIT;sleep 2;node test.js
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search-aoi-v9.html data-search-integrated-v8.html data-search-restored.html data-search.html
          git commit -m 'Replace DATA SEARCH AOI with persistent AOI TOOL module'
          git push origin gh-pages
