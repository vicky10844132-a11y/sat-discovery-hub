name: Recover restored DATA SEARCH top

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-restored-top-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Recover exact cached restored page and remove top controls
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githack.com/vicky10844132-a11y/sat-discovery-hub/gh-pages/data-search-restored.html'
          curl -fL --retry 5 --retry-delay 2 --connect-timeout 30 --max-time 240 \
            -H 'Cache-Control: no-cache' \
            "$url?recover-source=20260731" -o /tmp/data-search-restored.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('/tmp/data-search-restored.html')
          html = src.read_text(encoding='utf-8')
          if '<!DOCTYPE html' not in html[:500].upper() and '<!doctype html' not in html[:500]:
              raise SystemExit('Recovered response is not the HTML page')

          # Remove the visible search window and all top-right controls from the source.
          html = re.sub(r'\s*<div class="coordinate-search"[^>]*>.*?</div>\s*', '\n', html, count=1, flags=re.S)
          html = re.sub(r'\s*<div class="top-actions"[^>]*>.*?</div>\s*', '\n', html, count=1, flags=re.S)

          # Prevent later scripts from recreating any top controls.
          guard = '''\n<style id="restored-top-clean">\n.coordinate-search,.top-actions,.v11-auth-actions,.account-menu-button,.lang-mini,.v9-help-button{display:none!important}\n.topbar{justify-content:flex-start!important}\n</style>\n<script id="restored-top-clean-script">\n(function(){\n  function cleanTop(){\n    document.querySelectorAll('.coordinate-search,.top-actions').forEach(function(el){el.remove();});\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',cleanTop,{once:true});else cleanTop();\n  window.addEventListener('load',cleanTop,{once:true});\n  new MutationObserver(cleanTop).observe(document.documentElement,{childList:true,subtree:true});\n})();\n</script>\n'''
          html = html.replace('</body>', guard + '</body>')
          Path('data-search-restored.html').write_text(html, encoding='utf-8')

          check = Path('data-search-restored.html').read_text(encoding='utf-8')
          assert 'restored-top-clean' in check
          assert '<div class="coordinate-search"' not in check
          PY

      - name: Publish restored page
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search-restored.html
          git commit -m 'Restore selected DATA SEARCH page without top controls'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
