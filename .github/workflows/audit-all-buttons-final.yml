name: Audit all DATA SEARCH and AOI buttons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-all-buttons-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run full button audit
        run: |
          cat > audit-buttons.js <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const BASE='http://127.0.0.1:8765/';
          const report={generated:new Date().toISOString(),pages:{},summary:{passed:0,failed:0,warnings:0}};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function handlerNames(code){
            if(!code)return [];
            const names=[]; const re=/(?:^|[;,(?:])\s*([A-Za-z_$][\w$]*)\s*\(/g; let m;
            while((m=re.exec(code))) if(!['if','for','while','switch','function','setTimeout','setInterval','confirm','prompt','alert'].includes(m[1])) names.push(m[1]);
            return [...new Set(names)];
          }
          async function newPage(browser,url){
            const p=await browser.newPage({viewport:{width:1600,height:1000},acceptDownloads:true});
            await p.route('**/*',route=>{const u=route.request().url(); if(u.startsWith(BASE)||u.startsWith('data:')||u.startsWith('blob:')) route.continue(); else route.abort();});
            p.on('dialog',async d=>{try{await d.accept(d.type()==='prompt'?'1':'');}catch(e){}});
            const errors=[];p.on('pageerror',e=>errors.push(e.message));
            await p.goto(BASE+url,{waitUntil:'domcontentloaded',timeout:30000});
            await sleep(700);
            return {p,errors};
          }
          async function staticAudit(page,label){
            const rows=await page.locator('button').evaluateAll(btns=>btns.map((b,i)=>({i,id:b.id||'',text:(b.textContent||'').trim().replace(/\s+/g,' ').slice(0,100),onclick:b.getAttribute('onclick')||'',hidden:getComputedStyle(b).display==='none'||getComputedStyle(b).visibility==='hidden'})));
            const missing=[];
            for(const r of rows){
              for(const n of handlerNames(r.onclick)){
                const exists=await page.evaluate(n=>typeof window[n]==='function'||['document','window','location'].includes(n),n);
                if(!exists)missing.push({...r,handler:n});
              }
            }
            return {label,totalButtons:rows.length,inlineButtons:rows.filter(x=>x.onclick).length,missingHandlers:missing};
          }
          async function clickAudit(browser,url,setup,descriptor){
            const {p,errors}=await newPage(browser,url); const result={...descriptor,ok:false,errors:[]};
            try{
              if(setup)await p.evaluate(setup);
              await sleep(250);
              let loc;
              if(descriptor.id)loc=p.locator('#'+CSS.escape(descriptor.id));
              else if(descriptor.onclick)loc=p.locator(`button[onclick=${JSON.stringify(descriptor.onclick)}]`).nth(descriptor.sameIndex||0);
              else loc=p.getByRole('button',{name:descriptor.text,exact:true}).nth(descriptor.sameIndex||0);
              if(!await loc.count()){result.errors.push('button not found');}
              else if(await loc.isDisabled()){result.ok=true;result.note='disabled by current state';}
              else{
                const before=await p.evaluate(()=>({modals:[...document.querySelectorAll('.show')].length,html:document.body.innerHTML.length,url:location.href}));
                const chooserPromise=p.waitForEvent('filechooser',{timeout:700}).catch(()=>null);
                const downloadPromise=p.waitForEvent('download',{timeout:700}).catch(()=>null);
                await loc.click({timeout:5000,force:true}).catch(e=>result.errors.push('click: '+e.message));
                const chooser=await chooserPromise;if(chooser){const tmp='/tmp/audit.geojson';fs.writeFileSync(tmp,JSON.stringify({type:'Feature',properties:{name:'Audit'},geometry:{type:'Polygon',coordinates:[[[103.8,1.2],[103.9,1.2],[103.9,1.3],[103.8,1.3],[103.8,1.2]]]}}));await chooser.setFiles(tmp).catch(e=>result.errors.push('filechooser: '+e.message));}
                const dl=await downloadPromise;if(dl)result.download=await dl.suggestedFilename();
                await sleep(450);
                const after=await p.evaluate(()=>({modals:[...document.querySelectorAll('.show')].length,html:document.body.innerHTML.length,url:location.href}));
                result.changed=before.modals!==after.modals||before.html!==after.html||before.url!==after.url||!!result.download;
                result.ok=!result.errors.length;
              }
              if(errors.length){result.errors.push(...errors);result.ok=false;}
            }catch(e){result.errors.push(e.message);result.ok=false;}
            await p.close();return result;
          }
          async function collectVisible(page,setup,label){
            if(setup)await page.evaluate(setup);await sleep(250);
            return await page.locator('button:visible').evaluateAll((btns,label)=>{
              const seen={};return btns.map(b=>{const text=(b.textContent||'').trim().replace(/\s+/g,' ').slice(0,100),onclick=b.getAttribute('onclick')||'',id=b.id||'',key=id||onclick||text;const sameIndex=seen[key]||0;seen[key]=sameIndex+1;return {label,id,text,onclick,sameIndex};});
            },label);
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            // DATA SEARCH
            let {p:ds,errors:dsLoad}=await newPage(browser,'data-search-integrated-v8.html');
            await ds.waitForFunction(()=>document.querySelectorAll('#v11LoginBtn,#v11LogoutBtn').length===2,{timeout:20000}).catch(()=>{});
            const dsStatic=await staticAudit(ds,'DATA SEARCH');
            const setups=[
              ['AOI',()=>window.selectPanel?.('aoi')],['Search archive',()=>{window.selectPanel?.('search');window.setSearchTab?.('archive')}],['Search tasking',()=>{window.selectPanel?.('search');window.setSearchTab?.('tasking')}],['Search subscription',()=>{window.selectPanel?.('search');window.setSearchTab?.('subscribe')}],['Orbit',()=>window.selectPanel?.('orbit')],['Sources',()=>window.selectPanel?.('sources')],['Data',()=>window.selectPanel?.('data')],['Orders',()=>window.selectPanel?.('orders')],['Account',()=>window.selectPanel?.('account')]
            ];
            let descriptors=[];
            for(const [label,fn] of setups)descriptors.push(...await collectVisible(ds,fn,label));
            // dedupe by state + identity
            const uniq=new Map();for(const d of descriptors)uniq.set([d.label,d.id,d.onclick,d.text,d.sameIndex].join('|'),d);descriptors=[...uniq.values()];
            await ds.close();
            const dsClicks=[];
            for(const d of descriptors){const setup=setups.find(x=>x[0]===d.label)?.[1];dsClicks.push(await clickAudit(browser,'data-search-integrated-v8.html',setup,d));}
            // targeted integrated AOI bridge
            const bridge={name:'AOI bridge',ok:false,errors:[]};
            try{const {p,errors}=await newPage(browser,'data-search-integrated-v8.html');await p.waitForFunction(()=>document.querySelector('#embeddedAoiFrame'),{timeout:15000});const f=p.frames().find(x=>x.url().includes('aoi-tool-multi-v8-embed.html'));if(!f)throw new Error('embedded frame missing');await f.waitForFunction(()=>window.aoiPro?.collection?.length>=2,{timeout:20000});await f.evaluate(()=>{for(const x of window.aoiPro.collection.slice(0,2))window.aoiPro.selected.add(x.id);window.sendEmbeddedSelection();});await p.waitForFunction(()=>!!window.__embeddedAoiGeometry,{timeout:12000});bridge.ok=!errors.length;if(errors.length)bridge.errors.push(...errors);await p.close();}catch(e){bridge.errors.push(e.message);} 
            report.pages.dataSearch={static:dsStatic,loadErrors:dsLoad,clicks:dsClicks,bridge};
            // AOI standalone
            const {p:aoi,errors:aoiLoad}=await newPage(browser,'aoi-tool-multi-v8.html');await aoi.waitForFunction(()=>window.aoiPro,{timeout:20000}).catch(()=>{});const aoiStatic=await staticAudit(aoi,'AOI TOOL');
            const aoiSetups=[['Build',()=>window.showPanel?.('build')],['Rules',()=>window.showPanel?.('rules')],['Overlay',()=>window.showPanel?.('overlay')],['Compare',()=>window.showPanel?.('compare')],['Export',()=>window.showPanel?.('export')]];
            let aoiDesc=[];for(const [label,fn] of aoiSetups)aoiDesc.push(...await collectVisible(aoi,fn,label));const au=new Map();for(const d of aoiDesc)au.set([d.label,d.id,d.onclick,d.text,d.sameIndex].join('|'),d);aoiDesc=[...au.values()];await aoi.close();
            const aoiClicks=[];for(const d of aoiDesc){const setup=aoiSetups.find(x=>x[0]===d.label)?.[1];aoiClicks.push(await clickAudit(browser,'aoi-tool-multi-v8.html',setup,d));}
            report.pages.aoi={static:aoiStatic,loadErrors:aoiLoad,clicks:aoiClicks};
            // targeted AOI geometry operations
            const targeted=[];
            async function target(name,fn){const r={name,ok:false,errors:[]};try{const {p,errors}=await newPage(browser,'aoi-tool-multi-v8.html');await p.waitForFunction(()=>window.aoiPro?.collection?.length>=2,{timeout:20000});await fn(p);await sleep(350);r.ok=!errors.length;if(errors.length)r.errors.push(...errors);await p.close();}catch(e){r.errors.push(e.message);}targeted.push(r);}
            await target('merge selected',async p=>{await p.evaluate(()=>{for(const x of window.aoiPro.collection.slice(0,2))window.aoiPro.selected.add(x.id);window.openRelationModal();document.getElementById('relationType').value='merge';window.executeRelationOperation();});await p.waitForFunction(()=>window.aoiPro.collection.length>=3,{timeout:12000});});
            await target('edge length check and adjust',async p=>{await p.evaluate(()=>{window.showPanel('rules');const s=document.getElementById('edgeTargetSelect');if(s&&s.options.length)s.selectedIndex=0;document.getElementById('multiMinEdge').value='20';window.checkMinimumEdges();});await p.waitForFunction(()=>/Below|All edges/.test(document.getElementById('edgeCheckResult')?.textContent||''),{timeout:8000});const disabled=await p.locator('#adjustEdgesButton').isDisabled();if(!disabled){await p.locator('#adjustEdgesButton').click();await p.waitForFunction(()=>/Closed/.test(document.getElementById('edgeAreaResult')?.textContent||''),{timeout:12000});}});
            report.pages.aoi.targeted=targeted;
            await browser.close();
            const all=[...dsClicks,...aoiClicks,bridge,...targeted];
            const staticMissing=[...dsStatic.missingHandlers,...aoiStatic.missingHandlers];
            report.summary.failed=all.filter(x=>!x.ok).length+staticMissing.length+dsLoad.length+aoiLoad.length;
            report.summary.passed=all.filter(x=>x.ok).length;
            report.summary.warnings=all.filter(x=>x.note).length;
            report.summary.dataSearchButtons=dsStatic.totalButtons;
            report.summary.aoiButtons=aoiStatic.totalButtons;
            report.summary.missingHandlers=staticMissing.length;
            fs.writeFileSync('all-buttons-audit.json',JSON.stringify(report,null,2));
            console.log('BUTTON_AUDIT_SUMMARY '+JSON.stringify(report.summary));
          })().catch(e=>{report.fatal=e.stack||e.message;report.summary.failed++;fs.writeFileSync('all-buttons-audit.json',JSON.stringify(report,null,2));console.error(e);});
          JS
          python3 -m http.server 8765 >/tmp/button-audit-http.log 2>&1 &
          server=$!; trap 'kill $server || true' EXIT
          sleep 2
          node audit-buttons.js
      - name: Save audit report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add all-buttons-audit.json
          git commit -m 'Record full DATA SEARCH and AOI button audit' || true
          git push origin gh-pages
      - name: Enforce audit
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('all-buttons-audit.json'))
          print(json.dumps(d['summary'],indent=2))
          if d['summary']['failed']:
              raise SystemExit(1)
          PY
