name: Finalize DATA SEARCH navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Replace conflicting navigation patches
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import os
          import re

          path = Path('data-search.html')
          html = path.read_text(encoding='utf-8')
          for start, end in [
              ('NAVIGATION_LAYOUT_V3_START', 'NAVIGATION_LAYOUT_V3_END'),
              ('DATA_ACCOUNT_NAV_FIX_START', 'DATA_ACCOUNT_NAV_FIX_END'),
              ('FINAL_NAVIGATION_FIX_START', 'FINAL_NAVIGATION_FIX_END'),
          ]:
              html = re.sub(
                  rf'\n?<!-- {start} -->.*?<!-- {end} -->\n?',
                  '\n',
                  html,
                  flags=re.S,
              )
          patch = base64.b64decode(os.environ['PATCH_B64']).decode('utf-8')
          path.write_text(html.rstrip() + '\n' + patch + '\n', encoding='utf-8')
          PY

      - name: Publish final navigation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Finalize DATA SEARCH navigation and actions'
          git push "https://x-access-token:${{GH_TOKEN}}@github.com/${{GITHUB_REPOSITORY}}.git" gh-pages
