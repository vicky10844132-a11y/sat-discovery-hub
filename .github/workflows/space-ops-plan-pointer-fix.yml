name: Space Ops PLAN Pointer Fix
on:
  push:
    branches: [space-ops-dev]
    paths:
      - .github/workflows/space-ops-plan-pointer-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: space-ops-dev
      - name: Patch PLAN scene tool hit layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('space-ops-platform/apps/web/plan-runtime.js')
          s=p.read_text()
          old=".sceneTools{top:92px!important;left:18px!important;z-index:45!important}"
          new=".sceneTools{top:92px!important;left:18px!important;z-index:2147483646!important;pointer-events:none!important;transform:translateZ(1px)!important}.sceneTools .chip{position:relative!important;z-index:2147483647!important;pointer-events:auto!important}"
          if old not in s:
              raise SystemExit('expected PLAN sceneTools rule not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit minimal fix
        run: |
          git config user.name "space-ops-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add space-ops-platform/apps/web/plan-runtime.js
          git commit -m "fix(space-ops): keep PLAN scene tool buttons above globe canvas"
          git push origin HEAD:space-ops-dev
