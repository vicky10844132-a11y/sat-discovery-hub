name: Fix DATA SEARCH AOI direct replacement V5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-data-search-aoi-direct-replacement-v5.yml'
permissions:
  contents: write
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Build persistent AOI module entry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/fix-data-search-aoi-direct-replacement-v2.yml > /tmp/v2.yml
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/v2.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,x in enumerate(lines) if "python3 - <<'PY'" in x)+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          raw=[x[10:] if x.startswith('          ') else x for x in lines[start:end]]
          out=[];inserted=False
          for line in raw:
              if line.strip().startswith('s=re.sub') and ('data-panel="aoi"' in line or 'data-panel="search"' in line):continue
              if not inserted and "s=s.replace('<section class=\"panel-view active\" id=\"panel-aoi\">'" in line:
                  out.append("s=s.replace('<button class=\"rail-btn active\" data-panel=\"aoi\"','<button class=\"rail-btn\" data-panel=\"aoi\"',1)")
                  out.append("s=s.replace('<button class=\"rail-btn\" data-panel=\"search\"','<button class=\"rail-btn active\" data-panel=\"search\"',1)")
                  inserted=True
              out.append(line)
          if not inserted:raise SystemExit('button insertion point missing')
          Path('/tmp/build_v5.py').write_text('\n'.join(out),encoding='utf-8')
          PY
          python3 /tmp/build_v5.py
          python3 - <<'PY'
          from pathlib import Path
          names=['data-search-aoi-v9.html','data-search-integrated-v8.html','data-search-restored.html','data-search.html']
          ensure=r'''function ensureAoiButton(){
            const rail=document.querySelector('.rail');if(!rail)return null;
            let btn=rail.querySelector('.rail-btn[data-panel="aoi"]');
            if(!btn){
              btn=document.createElement('button');btn.type='button';btn.className='rail-btn';btn.dataset.panel='aoi';btn.title='AOI Center';btn.setAttribute('aria-label','AOI Center');
              btn.innerHTML='<svg class="ds-icon" viewBox="0 0 24 24"><path d="M4 7l5-3 5 3 6-2v12l-6 3-5-3-5 2z"></path><path d="M9 4v13M14 7v13"></path></svg><span class="tip">AOI Center</span>';
              rail.insertBefore(btn,rail.firstChild);
            }
            rail.querySelectorAll('.rail-btn[data-panel="aoi"]').forEach((x,i)=>{if(i>0)x.remove();});
            return btn;
          }
          '''
          for name in names:
              p=Path(name);s=p.read_text(encoding='utf-8');idx=s.index('<script id="dataSearchAoiV9Bridge">');head,tail=s[:idx],s[idx:]
              if 'function ensureAoiButton()' not in tail:
                  tail=tail.replace('function bindRail(){',ensure+'function bindRail(){ensureAoiButton();',1)
                  tail=tail.replace("function init(){keepOnlyAuthButtons();bindRail();", "function init(){keepOnlyAuthButtons();ensureAoiButton();bindRail();")
                  tail=tail.replace("const top=document.querySelector('.top-actions');if(top)observer.observe(top,{childList:true,subtree:true});", "const top=document.querySelector('.top-actions');if(top)observer.observe(top,{childList:true,subtree:true});const rail=document.querySelector('.rail');if(rail)new MutationObserver(()=>{ensureAoiButton();bindRail();}).observe(rail,{childList:true});setTimeout(()=>{ensureAoiButton();bindRail();},500);")
              p.write_text(head+tail,encoding='utf-8')
          PY
          grep -q 'function ensureAoiButton()' data-search-aoi-v9.html
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Validate persistent AOI replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/v2.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,x in enumerate(lines) if "cat > test.js <<'JS'" in x)+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='JS')
          Path('test.js').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in lines[start:end]),encoding='utf-8')
          PY
          python3 -m http.server 8765 >/tmp/aoi-v9-v5-http.log 2>&1 &
          server=$!;trap 'kill $server || true' EXIT;sleep 2;node test.js
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search-aoi-v9.html data-search-integrated-v8.html data-search-restored.html data-search.html
          git commit -m 'Keep AOI TOOL as the persistent DATA SEARCH AOI module'
          git push origin gh-pages
