name: AOI V6 all buttons check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aoi-v6-all-buttons-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout published AOI tool
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Install browser engine
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Create complete button test
        run: |
          cat > aoi-all-buttons-test.js <<'JS'
          const { chromium } = require('playwright');
          const assert = (value, message) => { if (!value) throw new Error(message); };
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const results = [];

          const demoGeo = {
            type:'Feature', properties:{name:'Imported GeoJSON'},
            geometry:{type:'Polygon',coordinates:[[[103.70,1.20],[103.75,1.20],[103.75,1.25],[103.70,1.25],[103.70,1.20]]]}
          };
          const demoKml = `<?xml version="1.0"?><kml xmlns="http://www.opengis.net/kml/2.2"><Placemark><Polygon><outerBoundaryIs><LinearRing><coordinates>103.70,1.20,0 103.75,1.20,0 103.75,1.25,0 103.70,1.25,0 103.70,1.20,0</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark></kml>`;
          const geocoderPayload = {type:'FeatureCollection',features:[{type:'Feature',properties:{name:'Test Boundary',display_name:'Test Boundary, Singapore'},geometry:{type:'Polygon',coordinates:[[[103.76,1.29],[103.80,1.29],[103.80,1.33],[103.76,1.33],[103.76,1.29]]]}}]};

          async function openTool(browser) {
            const context = await browser.newContext({ viewport:{width:1600,height:1000}, acceptDownloads:true });
            await context.addInitScript(() => {
              window.__capturedDownloads = [];
              const nativeClick = HTMLAnchorElement.prototype.click;
              HTMLAnchorElement.prototype.click = function(){
                if (this.download) { window.__capturedDownloads.push(this.download); return; }
                return nativeClick.call(this);
              };
              try {
                Object.defineProperty(document,'fullscreenElement',{configurable:true,get(){return window.__fakeFullscreen||null;}});
              } catch(e) {}
              Element.prototype.requestFullscreen = async function(){ window.__fakeFullscreen=this; };
              document.exitFullscreen = async function(){ window.__fakeFullscreen=null; };
              window.confirm = () => true;
              window.prompt = () => 'DD';
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('pageerror: '+e.message));
            page.on('console', m => { if (m.type()==='error' && !/tile|ERR_FAILED|favicon/i.test(m.text())) errors.push('console: '+m.text()); });
            page.on('dialog', async d => { try { await d.accept(d.type()==='prompt'?'DD':undefined); } catch(e) {} });
            await page.route('https://nominatim.openstreetmap.org/**', r => r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(geocoderPayload)}));
            await page.route(/https:\/\/[^/]*openstreetmap[^/]*\/.*\.(png|jpg)/, r => r.abort());
            await page.goto('http://127.0.0.1:8765/aoi-tool-full-v6.html',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(() => window.L && window.turf && document.querySelectorAll('.collection-row').length===2);
            await sleep(150);
            return {context,page,errors};
          }

          async function run(browser, name, fn) {
            const env = await openTool(browser);
            try {
              await fn(env.page);
              await sleep(120);
              if (env.errors.length) throw new Error(env.errors.join(' | '));
              results.push({name,status:'PASS'});
              console.log('PASS',name);
            } catch(e) {
              results.push({name,status:'FAIL',error:e.message});
              console.error('FAIL',name,'=>',e.stack||e.message);
            } finally { await env.context.close(); }
          }

          async function selectDemoAOIs(page) {
            const boxes=page.locator('.collection-row input[type=checkbox]');
            await boxes.nth(0).check(); await boxes.nth(1).check();
            await page.waitForFunction(()=>document.querySelectorAll('.edge-length-label').length>=8);
          }

          async function forceComparison(page) {
            await page.evaluate(() => {
              const o=turf.clone(state.features.A);
              const a=turf.transformTranslate(o,2,90,{units:'kilometers'});
              state.features.original=normalizeFeature(o,{name:'Original'});
              state.features.adjusted=normalizeFeature(a,{name:'Adjusted'});
              renderLayer('original'); renderLayer('adjusted'); refreshAll();
            });
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});

            await run(browser,'All visible inline button handlers compile and resolve',async page=>{
              const report=await page.evaluate(()=>{
                const buttons=[...document.querySelectorAll('button[onclick]')];
                const invalid=buttons.filter(b=>typeof b.onclick!=='function').map(b=>b.outerHTML.slice(0,180));
                const skip=new Set(['document','map','location']);
                const missing=[];
                for(const b of buttons){const m=(b.getAttribute('onclick')||'').match(/^\s*([A-Za-z_$][\w$]*)\s*\(/);if(m&&!skip.has(m[1])&&typeof window[m[1]]!=='function')missing.push(m[1]);}
                return {count:buttons.length,invalid,missing:[...new Set(missing)]};
              });
              assert(report.count>=35,'Too few buttons found: '+report.count);
              assert(!report.invalid.length,'Invalid onclick handlers: '+report.invalid.join(' | '));
              assert(!report.missing.length,'Missing handler functions: '+report.missing.join(', '));
            });

            await run(browser,'Top bar and left navigation buttons',async page=>{
              await page.getByRole('button',{name:'Load Demo'}).click();
              assert(await page.locator('.collection-row').count()===2,'Load Demo did not restore two AOIs');
              await page.getByRole('button',{name:'Settings'}).click();
              assert(await page.locator('#settingsModal.show').count()===1,'Settings modal did not open');
              await page.locator('#settingsModal .close').click();
              await page.getByRole('button',{name:'Export',exact:true}).first().click();
              assert(await page.locator('#panel-export.active').count()===1,'Top Export did not open export panel');
              await page.getByRole('button',{name:'Documentation'}).click();
              assert(await page.locator('#helpModal.show').count()===1,'Documentation did not open');
              await page.locator('#helpModal .close').click();
              for(const panel of ['build','rules','overlay','compare','export']){
                await page.locator(`.rail-btn[data-panel="${panel}"]`).click();
                assert(await page.locator(`#panel-${panel}.active`).count()===1,'Rail did not open '+panel);
              }
              await page.locator('.rail-btn').last().click();
              assert(await page.locator('#helpModal.show').count()===1,'Help rail button did not open');
            });

            await run(browser,'Settings feature visibility switches',async page=>{
              await page.getByRole('button',{name:'Settings'}).click();
              const toggles=page.locator('#settingsList input[type=checkbox]');
              assert(await toggles.count()===8,'Expected 8 settings switches');
              for(let i=0;i<8;i++){await toggles.nth(i).uncheck();await toggles.nth(i).check();}
              await page.locator('#settingsModal .close').click();
              assert(await page.locator('#mapToolsPro').isVisible(),'Map tools were not restored');
            });

            await run(browser,'AOI checkbox, eye, coordinate and delete controls',async page=>{
              const first=page.locator('.collection-row').first();
              await first.locator('input[type=checkbox]').check();
              assert(await page.locator('.edge-length-label').count()>0,'Checking AOI did not show edge labels');
              await first.locator('button[title="Vertex coordinates"]').click();
              assert(await page.locator('.vertex-label').count()>0,'Vertex coordinate button produced no labels');
              await first.locator('button[title="Vertex coordinates"]').click();
              await first.locator('button[title="Show / hide"]').click();
              assert(!(await first.locator('input[type=checkbox]').isChecked()),'Eye button did not hide AOI');
              const before=await page.locator('.collection-row').count();
              await page.locator('.collection-row').last().locator('button[title="Delete"]').click();
              assert(await page.locator('.collection-row').count()===before-1,'Delete did not remove AOI');
            });

            await run(browser,'Target A and B buttons',async page=>{
              await page.getByRole('button',{name:'Secondary AOI B'}).click();
              assert(await page.locator('#targetB.primary').count()===1,'Target B not selected');
              await page.getByRole('button',{name:'Primary AOI A'}).click();
              assert(await page.locator('#targetA.primary').count()===1,'Target A not selected');
            });

            await run(browser,'Draw Polygon button and double-click close',async page=>{
              const before=await page.locator('.collection-row').count();
              await page.getByRole('button',{name:'Draw Polygon'}).click();
              const box=await page.locator('#map').boundingBox();
              await page.mouse.click(box.x+330,box.y+260);await page.mouse.click(box.x+500,box.y+230);await page.mouse.click(box.x+570,box.y+390);await page.mouse.dblclick(box.x+360,box.y+410,{delay:60});
              await page.waitForFunction(n=>document.querySelectorAll('.collection-row').length>n,before);
              assert(await page.locator('.edge-length-label').count()>0,'Drawn polygon has no edge labels');
            });

            await run(browser,'Draw Rectangle button',async page=>{
              const before=await page.locator('.collection-row').count();
              await page.getByRole('button',{name:'Draw Rectangle'}).click();
              const box=await page.locator('#map').boundingBox();
              await page.mouse.move(box.x+350,box.y+250);await page.mouse.down();await page.mouse.move(box.x+560,box.y+420,{steps:8});await page.mouse.up();
              await page.waitForFunction(n=>document.querySelectorAll('.collection-row').length>n,before);
            });

            await run(browser,'Edit Active button',async page=>{
              await page.getByRole('button',{name:'Edit Active'}).click();
              await page.waitForTimeout(150);
              assert(await page.locator('.leaflet-draw-actions a').count()>0,'Edit toolbar actions did not appear');
            });

            await run(browser,'Import File button with GeoJSON',async page=>{
              const before=await page.locator('.collection-row').count();
              await page.locator('#fileInput').setInputFiles({name:'test.geojson',mimeType:'application/geo+json',buffer:Buffer.from(JSON.stringify(demoGeo))});
              await page.waitForFunction(n=>document.querySelectorAll('.collection-row').length>n,before);
            });

            await run(browser,'Import KML parser',async page=>{
              const before=await page.locator('.collection-row').count();
              await page.locator('#fileInput').setInputFiles({name:'test.kml',mimeType:'application/vnd.google-earth.kml+xml',buffer:Buffer.from(demoKml)});
              await page.waitForFunction(n=>document.querySelectorAll('.collection-row').length>n,before);
            });

            await run(browser,'Named Boundary search and use buttons',async page=>{
              await page.locator('#country').fill('Singapore');
              await page.getByRole('button',{name:'Find Boundary'}).click();
              await page.waitForSelector('#geocodeResults',{state:'visible'});
              const before=await page.locator('.collection-row').count();
              await page.getByRole('button',{name:'Use Selected Boundary'}).click();
              await page.waitForFunction(n=>document.querySelectorAll('.collection-row').length>n,before);
            });

            for(const op of ['Merge / Union','Intersection','A minus B','B minus A','Non-overlap / XOR','Split A by B']){
              await run(browser,'Overlay panel: '+op,async page=>{
                await page.locator('.rail-btn[data-panel="overlay"]').click();
                const before=await page.locator('.collection-row').count();
                await page.locator('#panel-overlay button.operation').filter({hasText:op}).click();
                await page.waitForFunction(n=>document.querySelectorAll('.collection-row').length>n,before);
                assert(!/No operation result yet/.test(await page.locator('#resultList').innerText()),op+' produced no result');
              });
            }

            for(const op of ['Merge','Intersection','A − B','B − A','XOR','Split']){
              await run(browser,'Collection operation: '+op,async page=>{
                await selectDemoAOIs(page);
                const before=await page.locator('.collection-row').count();
                await page.locator('.collection-ops button').filter({hasText:op}).click();
                await page.waitForFunction(n=>document.querySelectorAll('.collection-row').length>n,before);
              });
            }

            for(const op of ['Buffer','Simplify','Convex Hull','Axis-Aligned Envelope','Oriented Envelope','Clean & Repair','Remove Holes','Explode Multipart']){
              await run(browser,'Geometry tool: '+op,async page=>{
                await page.locator('.rail-btn[data-panel="overlay"]').click();
                const before=await page.locator('.collection-row').count();
                await page.locator('#panel-overlay button.operation').filter({hasText:op}).click();
                await page.waitForFunction(n=>document.querySelectorAll('.collection-row').length>n,before);
              });
            }

            await run(browser,'Adjust Boundary and comparison buttons',async page=>{
              await page.locator('.rail-btn[data-panel="rules"]').click();
              await page.locator('#minArea').fill('2000');await page.locator('#minWidth').fill('40');
              const before=await page.locator('.collection-row').count();
              await page.getByRole('button',{name:'Adjust Boundary'}).click();
              await page.waitForFunction(n=>document.querySelectorAll('.collection-row').length>n,before);
              await page.locator('.rail-btn[data-panel="compare"]').click();
              assert(!/Adjust an AOI/.test(await page.locator('#compareMetrics').innerText()),'Comparison metrics not generated');
              for(const label of ['Show Added Area','Show Removed Area','Show Overlap']) await page.getByRole('button',{name:label}).click();
              await page.getByRole('button',{name:'Clear Difference Layers'}).click();
              const vis=page.locator('#visibilityControls input[type=checkbox]');
              if(await vis.count()){await vis.first().uncheck();await vis.first().check();}
              const range=page.locator('#visibilityControls input[type=range]');
              if(await range.count())await range.first().fill('35');
            });

            for(const action of ['Restore Original','Use Adjusted','Remove Adjusted']){
              await run(browser,'Boundary action: '+action,async page=>{
                await page.locator('.rail-btn[data-panel="rules"]').click();
                await page.locator('#minArea').fill('2000');await page.locator('#minWidth').fill('40');
                await page.getByRole('button',{name:'Adjust Boundary'}).click();
                await page.waitForTimeout(250);
                await page.getByRole('button',{name:action}).click();
                await page.waitForTimeout(200);
              });
            }

            await run(browser,'Dynamic result Zoom, Use as and Remove buttons',async page=>{
              await page.locator('.rail-btn[data-panel="overlay"]').click();
              await page.locator('#panel-overlay button.operation').filter({hasText:'Buffer'}).click();
              await page.waitForTimeout(250);
              const card=page.locator('#resultList .layer-card').first();
              await card.getByRole('button',{name:'Zoom'}).click();
              const before=await page.locator('.collection-row').count();
              await card.getByRole('button',{name:/Use as/}).click();
              await page.waitForFunction(n=>document.querySelectorAll('.collection-row').length>n,before);
              await page.locator('#resultList .layer-card').first().getByRole('button',{name:'Remove'}).click();
            });

            await run(browser,'All export buttons generate a file',async page=>{
              await forceComparison(page);
              await page.locator('.rail-btn[data-panel="export"]').click();
              const expected=[
                ['GeoJSON','.geojson'],['KML','.kml'],['KMZ','.kmz'],['WKT','.wkt'],['CSV Vertices','.csv'],['Shapefile ZIP','.zip'],['GIS Package ZIP','.zip'],['Comparison Report','.html']
              ];
              for(const [label,ext] of expected){
                const n=await page.evaluate(()=>window.__capturedDownloads.length);
                await page.locator('#panel-export button.operation').filter({hasText:label}).click();
                await page.waitForFunction(x=>window.__capturedDownloads.length>x,n,{timeout:10000});
                const file=await page.evaluate(()=>window.__capturedDownloads.at(-1));
                assert(file.toLowerCase().endsWith(ext),label+' generated unexpected file '+file);
              }
            });

            await run(browser,'Map edge length, fit, zoom, basemap and fullscreen buttons',async page=>{
              await page.locator('.collection-row input[type=checkbox]').first().check();
              const km=page.locator('#edgeLengthToggle');
              await km.click();assert(await page.locator('.edge-length-label').count()===0,'Edge labels did not hide');
              await km.click();assert(await page.locator('.edge-length-label').count()>0,'Edge labels did not return');
              const z0=await page.evaluate(()=>map.getZoom());
              await page.locator('#mapToolsPro button[title="Zoom in"]').click();
              const z1=await page.evaluate(()=>map.getZoom()); assert(z1>z0,'Zoom in did not change map zoom');
              await page.locator('#mapToolsPro button[title="Zoom out"]').click();
              await page.locator('#mapToolsPro button[title="Switch basemap"]').click();
              await page.locator('#mapToolsPro button[title="Fit active AOI"]').click();
              await page.locator('#mapToolsPro button[title="Fullscreen"]').click();
              assert(await page.evaluate(()=>!!window.__fakeFullscreen),'Fullscreen request was not made');
            });

            await run(browser,'Measure distance and area buttons without replacing AOI',async page=>{
              const nameBefore=await page.locator('.collection-row').first().locator('.collection-name').innerText();
              await page.locator('#mapToolsPro button[title="Measure distance"]').click();
              await page.evaluate(()=>map.fire(L.Draw.Event.CREATED,{layer:L.polyline([[1.30,103.78],[1.32,103.82]])}));
              await page.waitForTimeout(150);
              assert(/Distance/.test(await page.locator('#toasts').innerText()),'Distance result toast missing');
              await page.locator('#mapToolsPro button[title="Measure area"]').click();
              await page.evaluate(()=>map.fire(L.Draw.Event.CREATED,{layer:L.polygon([[1.30,103.78],[1.30,103.82],[1.34,103.82]])}));
              await page.waitForTimeout(150);
              assert(/Area/.test(await page.locator('#toasts').innerText()),'Area result toast missing');
              const nameAfter=await page.locator('.collection-row').first().locator('.collection-name').innerText();
              assert(nameAfter===nameBefore,'Measurement altered AOI collection');
            });

            await browser.close();
            const failed=results.filter(x=>x.status==='FAIL');
            console.log('BUTTON_TEST_SUMMARY '+JSON.stringify({total:results.length,passed:results.length-failed.length,failed:failed.length,failures:failed},null,2));
            if(failed.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Run complete button acceptance
        run: |
          python3 -m http.server 8765 >/tmp/aoi-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node aoi-all-buttons-test.js
