name: Fix V6 test path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v6-test-path.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Keep Playwright test inside repository
        run: |
          set -euo pipefail
          sed -i 's#/tmp/v6-test.js#v6-test.js#g' .github/workflows/aoi-v6-drawing-ux.yml
          grep -q "cat > v6-test.js" .github/workflows/aoi-v6-drawing-ux.yml
          grep -q "node v6-test.js" .github/workflows/aoi-v6-drawing-ux.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/aoi-v6-drawing-ux.yml
          git commit -m 'Fix Playwright module resolution for V6 tests'
          git push origin main
