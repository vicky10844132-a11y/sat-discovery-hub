name: Inspect DATA SEARCH AOI V9 V7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-data-search-aoi-v9-v7.yml'
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for AOI V9 V7 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,urllib.request,time
          url='https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=40'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer ${{ github.token }}','Accept':'application/vnd.github+json'})
          row={}
          for _ in range(50):
              data=json.load(urllib.request.urlopen(req))
              rows=[r for r in data.get('workflow_runs',[]) if r.get('name')=='Fix DATA SEARCH AOI direct replacement V7']
              if rows:
                  row=rows[0]
                  if row.get('status')=='completed': break
              time.sleep(10)
          open('data-search-aoi-v9-v7-status.json','w').write(json.dumps({k:row.get(k) for k in ['id','status','conclusion','head_sha','jobs_url','html_url']},indent=2))
          PY
      - name: Commit status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search-aoi-v9-v7-status.json
          git commit -m 'Record DATA SEARCH AOI V9 V7 status' || exit 0
          git push origin main
