name: Space Ops CI

on:
  push:
    branches: [main]
    paths:
      - 'space-ops-platform/**'
      - 'api/**'
      - 'space-ops-live.html'
      - 'requirements.txt'
      - 'vercel.json'
      - '.github/workflows/space-ops-ci.yml'
  pull_request:
    paths:
      - 'space-ops-platform/**'
      - 'api/**'
      - 'space-ops-live.html'
      - 'requirements.txt'
      - 'vercel.json'
      - '.github/workflows/space-ops-ci.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Space Ops API tests
        run: python -m pytest -q space-ops-platform/tests/test_api.py
      - name: Run Space Ops UI contract tests
        run: python -m pytest -q space-ops-platform/tests/test_ui_contract.py
      - name: Compile Python modules
        run: python -m compileall -q api space-ops-platform
