name: Batched module audit of all buttons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-buttons-batched.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run batched audit
        run: |
          cat > batched-audit.js <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');const BASE='http://127.0.0.1:8765/';const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const report={generated:new Date().toISOString(),states:[],targeted:[],summary:{buttons:0,clicked:0,skippedNavigation:0,disabled:0,failed:0,missingHandlers:0,passed:0}};
          async function open(browser,file){const p=await browser.newPage({viewport:{width:1500,height:950},acceptDownloads:true});await p.route('**/*',r=>{const u=r.request().url();if(u.startsWith(BASE)||u.startsWith('data:')||u.startsWith('blob:'))return r.continue();if(u.includes('/search'))return r.fulfill({status:200,contentType:'application/json',body:'{"type":"FeatureCollection","features":[],"numberMatched":0,"context":{"matched":0}}'});return r.abort()});p.on('dialog',d=>d.accept(d.type()==='prompt'?'1':'').catch(()=>{}));await p.goto(BASE+file,{waitUntil:'domcontentloaded',timeout:20000});await wait(550);return p}
          function names(code){const a=[],re=/(?:^|[;,(?:])\s*([A-Za-z_$][\w$]*)\s*\(/g;let m;while((m=re.exec(code||'')))if(!['if','for','while','switch','function','setTimeout','setInterval','confirm','prompt','alert'].includes(m[1]))a.push(m[1]);return [...new Set(a)]}
          async function auditState(browser,file,label,setup){const p=await open(browser,file),errors=[];p.on('pageerror',e=>errors.push(e.message));if(setup)await p.evaluate(setup).catch(e=>errors.push('setup: '+e.message));await wait(150);const result=await p.evaluate(async label=>{const rows=[],missing=[];const buttons=[...document.querySelectorAll('button')];for(let i=0;i<buttons.length;i++){const b=buttons[i],onclick=b.getAttribute('onclick')||'',text=(b.textContent||'').trim().replace(/\s+/g,' ').slice(0,100),id=b.id||'',visible=getComputedStyle(b).display!=='none'&&getComputedStyle(b).visibility!=='hidden';if(!visible&&label!=='ALL')continue;for(const n of (${names.toString()})(onclick))if(!['document','window','location','Math','JSON','Date','URL','Blob'].includes(n)&&typeof window[n]!=='function')missing.push({i,id,text,onclick,handler:n});let status='clicked',err='';if(b.disabled)status='disabled';else if(/location\.|window\.open|\.submit\(|href\s*=|reload\s*\(/i.test(onclick))status='navigation-skip';else{try{b.click();await new Promise(r=>setTimeout(r,15))}catch(e){status='error';err=e.message}}rows.push({i,id,text,onclick,status,error:err})}return {label,rows,missing}},label);await wait(250);result.pageErrors=[...new Set(errors)];await p.close();report.states.push(result)}
          async function target(browser,name,file,fn){const r={name,ok:false,errors:[]};let p;try{p=await open(browser,file);const es=[];p.on('pageerror',e=>es.push(e.message));await fn(p);await wait(250);if(es.length)r.errors.push(...es);r.ok=!r.errors.length}catch(e){r.errors.push(e.message)}finally{if(p)await p.close().catch(()=>{})}report.targeted.push(r)}
          (async()=>{const b=await chromium.launch({headless:true});const ds=[['ALL',null],['AOI',()=>window.selectPanel?.('aoi')],['SEARCH_ARCHIVE',()=>{window.selectPanel?.('search');window.setSearchTab?.('archive')}],['SEARCH_TASKING',()=>{window.selectPanel?.('search');window.setSearchTab?.('tasking')}],['SEARCH_SUBSCRIBE',()=>{window.selectPanel?.('search');window.setSearchTab?.('subscribe')}],['ORBIT',()=>window.selectPanel?.('orbit')],['SOURCES',()=>window.selectPanel?.('sources')],['DATA',()=>window.selectPanel?.('data')],['ORDERS',()=>window.selectPanel?.('orders')],['ACCOUNT',()=>window.selectPanel?.('account')]];for(const [l,s] of ds)await auditState(b,'data-search-integrated-v8.html','DS_'+l,s);const as=[['ALL',null],['BUILD',()=>window.showPanel?.('build')],['RULES',()=>window.showPanel?.('rules')],['OVERLAY',()=>window.showPanel?.('overlay')],['COMPARE',()=>window.showPanel?.('compare')],['EXPORT',()=>window.showPanel?.('export')]];for(const [l,s] of as)await auditState(b,'aoi-tool-multi-v8.html','AOI_'+l,s);
            await target(b,'top login/logout only','data-search-integrated-v8.html',async p=>{await p.waitForFunction(()=>document.querySelectorAll('#v11LoginBtn,#v11LogoutBtn').length===2,{timeout:15000});const t=(await p.locator('.topbar button:visible').allTextContents()).map(x=>x.trim()).sort();if(t.join('|')!=='Login|Logout')throw Error('unexpected top buttons '+t.join(','));await p.locator('#v11LogoutBtn').click();await p.locator('#v11LoginBtn').click();if(!await p.locator('#v11LoginModal.show').count())throw Error('login modal missing')});
            await target(b,'AOI bridge','data-search-integrated-v8.html',async p=>{await p.waitForFunction(()=>document.querySelector('#embeddedAoiFrame'),{timeout:15000});const f=p.frames().find(x=>x.url().includes('aoi-tool-multi-v8-embed.html'));if(!f)throw Error('frame missing');await f.waitForFunction(()=>window.aoiPro?.collection?.length>=2,{timeout:18000});await f.evaluate(()=>{for(const x of window.aoiPro.collection.slice(0,2))window.aoiPro.selected.add(x.id);window.sendEmbeddedSelection()});await p.waitForFunction(()=>!!window.__embeddedAoiGeometry,{timeout:10000})});
            await target(b,'archive search','data-search-integrated-v8.html',async p=>{await p.evaluate(()=>{window.selectPanel('search');window.setSearchTab('archive')});await p.waitForFunction(()=>document.getElementById('archiveStartDate'),{timeout:8000});await p.evaluate(()=>window.runArchiveSearch());await p.waitForFunction(()=>/No matching items|did not complete|loaded/.test(document.getElementById('searchContent')?.textContent||''),{timeout:10000})});
            await target(b,'AOI merge','aoi-tool-multi-v8.html',async p=>{await p.waitForFunction(()=>window.aoiPro?.collection?.length>=2,{timeout:16000});await p.evaluate(()=>{for(const x of window.aoiPro.collection.slice(0,2))window.aoiPro.selected.add(x.id);window.openRelationModal();document.getElementById('relationType').value='merge';window.executeRelationOperation()});await p.waitForFunction(()=>window.aoiPro.collection.length>=3,{timeout:10000})});
            await target(b,'edge check and adjust','aoi-tool-multi-v8.html',async p=>{await p.waitForFunction(()=>window.aoiPro?.collection?.length>=2,{timeout:16000});await p.evaluate(()=>{window.showPanel('rules');const s=document.getElementById('edgeTargetSelect');if(s&&s.options.length)s.selectedIndex=0;document.getElementById('multiMinEdge').value='20';window.checkMinimumEdges()});await p.waitForFunction(()=>/Below|All edges/.test(document.getElementById('edgeCheckResult')?.textContent||''),{timeout:8000});if(!await p.locator('#adjustEdgesButton').isDisabled()){await p.locator('#adjustEdgesButton').click();await p.waitForFunction(()=>/Closed/.test(document.getElementById('edgeAreaResult')?.textContent||''),{timeout:10000})}});
            await b.close();for(const s of report.states){report.summary.buttons+=s.rows.length;report.summary.clicked+=s.rows.filter(x=>x.status==='clicked').length;report.summary.skippedNavigation+=s.rows.filter(x=>x.status==='navigation-skip').length;report.summary.disabled+=s.rows.filter(x=>x.status==='disabled').length;report.summary.failed+=s.rows.filter(x=>x.status==='error').length+s.pageErrors.length+s.missing.length;report.summary.missingHandlers+=s.missing.length}report.summary.failed+=report.targeted.filter(x=>!x.ok).length;report.summary.passed=report.summary.buttons-report.summary.failed+report.targeted.filter(x=>x.ok).length;fs.writeFileSync('batched-all-buttons-audit.json',JSON.stringify(report,null,2));console.log('BATCHED_AUDIT '+JSON.stringify(report.summary))})().catch(e=>{report.fatal=e.stack||e.message;report.summary.failed++;fs.writeFileSync('batched-all-buttons-audit.json',JSON.stringify(report,null,2));console.error(e)});
          JS
          python3 -m http.server 8765 >/tmp/batched-http.log 2>&1 &
          server=$!;trap 'kill $server || true' EXIT;sleep 2;node batched-audit.js
      - name: Save batched report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add batched-all-buttons-audit.json
          git commit -m 'Record batched all-button audit' || true
          git push origin gh-pages
