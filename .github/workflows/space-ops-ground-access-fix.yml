name: Space Ops GROUND Access Fix

on:
  push:
    branches: [space-ops-dev]
    paths:
      - '.github/workflows/space-ops-ground-access-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: space-ops-dev
      - name: Patch GROUND ACCESS mapping only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('space-ops-platform/apps/web/globe-module.js')
          s=p.read_text()
          old="profile.links = key === 'twin' ? isOn('linkMode',false) : read(['LINK'],profile.links);"
          new="profile.links = key === 'twin' ? isOn('linkMode',false) : read(key === 'ground' ? ['ACCESS','LINK'] : ['LINK'],profile.links);"
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit minimal fix
        run: |
          git config user.name "space-ops-qa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add space-ops-platform/apps/web/globe-module.js
          git commit -m "fix(space-ops): bind GROUND ACCESS to live link geometry"
          git push origin HEAD:space-ops-dev
