name: Smoke test published tools

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Build same-origin browser tests
        shell: bash
        run: |
          cat > aoi-smoke.html <<'HTML'
          <!doctype html><html><body><iframe id="tool" src="aoi-tool.html" style="width:1200px;height:800px"></iframe><pre id="result">WAIT_AOI</pre><script>
          const frame=document.getElementById('tool');
          frame.addEventListener('load',()=>setTimeout(()=>{
            try{
              const w=frame.contentWindow,d=w.document;
              const checks={leaflet:!!w.L,turf:!!w.turf,jszip:!!w.JSZip,shpwrite:!!w.shpwrite,loadDemo:typeof w.loadDemo==='function',showPanel:typeof w.showPanel==='function',startDraw:typeof w.startDraw==='function',exportData:typeof w.exportData==='function',mapVisible:!!d.querySelector('#map')};
              if(checks.loadDemo)w.loadDemo();
              if(checks.showPanel)w.showPanel('build');
              const pass=Object.values(checks).every(Boolean);
              document.getElementById('result').textContent=(pass?'PASS_AOI ':'FAIL_AOI ')+JSON.stringify(checks);
            }catch(e){document.getElementById('result').textContent='FAIL_AOI '+e.stack;}
          },2500));
          </script></body></html>
          HTML

          cat > data-smoke.html <<'HTML'
          <!doctype html><html><body><iframe id="tool" src="data-search.html" style="width:1400px;height:900px"></iframe><pre id="result">WAIT_DATA</pre><script>
          const frame=document.getElementById('tool');
          frame.addEventListener('load',()=>setTimeout(()=>{
            try{
              const w=frame.contentWindow,d=w.document;
              const checks={leaflet:!!w.L,satellite:!!w.satellite,showAOI:typeof w.showAOI==='function',selectPanel:typeof w.selectPanel==='function',openSearchTab:typeof w.openSearchTab==='function',orbit:typeof w.generateOrbitPrediction==='function',mapVisible:!!d.querySelector('#map'),area:/km²/.test(d.querySelector('#mapStatus')?.textContent||'')};
              if(checks.showAOI)w.showAOI('singapore');
              if(checks.selectPanel)w.selectPanel('search');
              const pass=Object.values(checks).every(Boolean);
              document.getElementById('result').textContent=(pass?'PASS_DATA ':'FAIL_DATA ')+JSON.stringify(checks);
            }catch(e){document.getElementById('result').textContent='FAIL_DATA '+e.stack;}
          },3000));
          </script></body></html>
          HTML

      - name: Run Chromium smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/tools-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8765/aoi-smoke.html > /tmp/aoi-dom.html
          "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8765/data-smoke.html > /tmp/data-dom.html
          grep 'PASS_AOI' /tmp/aoi-dom.html
          grep 'PASS_DATA' /tmp/data-dom.html
          test -s vendor/leaflet.js
          test -s vendor/turf.min.js
          test -s vendor/jszip.min.js
          test -s vendor/shpwrite.js
          test -s vendor/satellite.min.js
