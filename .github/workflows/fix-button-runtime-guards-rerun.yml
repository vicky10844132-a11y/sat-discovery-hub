name: Rerun button runtime guards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-button-runtime-guards-rerun.yml'
permissions:
  contents: write
jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Apply guard patch
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/fix-button-runtime-guards.yml > /tmp/guard.yml
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/guard.yml').read_text().splitlines()
          start=next(i for i,x in enumerate(lines) if "python3 - <<'PY'" in x)+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          code='\n'.join((x[10:] if x.startswith('          ') else x) for x in lines[start:end])
          Path('/tmp/apply_guards.py').write_text(code)
          PY
          python3 /tmp/apply_guards.py
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run corrected regression
        run: |
          cat > regression.js <<'JS'
          const {chromium}=require('playwright');const assert=require('assert');
          const BASE='http://127.0.0.1:8765/';const wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1600,height:1000},acceptDownloads:true});
            const errors=[];p.on('pageerror',e=>errors.push(e.message));p.on('dialog',d=>d.accept('').catch(()=>{}));
            await p.goto(BASE+'data-search-integrated-v8.html',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>document.querySelectorAll('#v11LoginBtn,#v11LogoutBtn').length===2,{timeout:20000});
            await p.evaluate(()=>{window.openPlatformSettings('help');window.switchSettingsTab('identity');window.switchSettingsTab('numbering');window.switchSettingsTab('help');window.downloadCurrentOrderForm();window.saveCurrentOrderForm();window.submitCurrentOrderForm();window.openSettlement('missing');window.saveCurrentSettlement();window.downloadCurrentSettlement();window.openDocumentEmail('orderForm');window.openDocumentEmail('settlement');window.printV9Document('missing-document');});
            await wait(500);assert.equal(errors.length,0,'DATA SEARCH guards: '+errors.join(' | '));
            await p.evaluate(()=>window.createNewOrderForm());
            await p.waitForFunction(()=>document.getElementById('orderFormModal')?.classList.contains('show'),{timeout:8000});
            const download=p.waitForEvent('download',{timeout:5000});await p.evaluate(()=>window.downloadCurrentOrderForm());await download;
            assert.equal(errors.length,0,'DATA SEARCH valid order: '+errors.join(' | '));await p.close();
            const a=await b.newPage({viewport:{width:1400,height:900}});const ae=[];a.on('pageerror',e=>ae.push(e.message));
            await a.goto(BASE+'aoi-tool-multi-v8.html',{waitUntil:'domcontentloaded'});await a.waitForFunction(()=>window.aoiPro?.collection?.length>=2,{timeout:20000});
            await a.evaluate(()=>window.toggleProFullscreen());await wait(300);assert.equal(ae.length,0,'AOI fullscreen: '+ae.join(' | '));
            await a.evaluate(()=>{window.showPanel('rules');const s=document.getElementById('edgeTargetSelect');if(s&&s.options.length)s.selectedIndex=0;document.getElementById('multiMinEdge').value='20';window.checkSelectedEdges();});
            await a.waitForFunction(()=>/Below|All edges/.test(document.getElementById('edgeCheckResult')?.textContent||''),{timeout:8000});
            if(!(await a.locator('#adjustEdgesButton').isDisabled())){await a.locator('#adjustEdgesButton').click();await a.waitForFunction(()=>/Closed/.test(document.getElementById('edgeAreaResult')?.textContent||''),{timeout:12000});}
            assert.equal(ae.length,0,'AOI edge: '+ae.join(' | '));await a.close();await b.close();console.log('BUTTON_RUNTIME_GUARDS_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8765 >/tmp/guard-rerun-http.log 2>&1 &
          server=$!;trap 'kill $server || true' EXIT;sleep 2;node regression.js
      - name: Publish guarded files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search-integrated-v8.html data-search-restored.html data-search.html aoi-tool-multi-v8.html aoi-tool-multi-v8-embed.html
          git commit -m 'Publish audited button runtime guards'
          git push origin gh-pages
