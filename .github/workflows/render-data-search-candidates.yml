name: Render DATA SEARCH screenshot candidates

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/restore-screenshot-trigger.txt'

permissions:
  contents: read

jobs:
  render-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete gh-pages history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: site

      - name: Discover and build candidate pages
        shell: bash
        run: |
          set -euo pipefail
          cd site
          mkdir -p candidate-render/pages candidate-render/screenshots
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess

          REMOVE = [
            ('style', 'data-search-aoi-tool-replacement-style'),
            ('style', 'v14-separated-core-modules-style'),
            ('script', 'data-search-fixed-mode'),
            ('script', 'data-search-aoi-tool-replacement-script'),
            ('script', 'v14-separated-core-modules-script'),
          ]

          objects = subprocess.run(
              ['git','rev-list','--objects','--all'],
              check=True,text=True,stdout=subprocess.PIPE,
          ).stdout.splitlines()
          pages = Path('candidate-render/pages')
          candidates = []
          seen = set()
          for line in objects:
              parts = line.split(' ',1)
              sha = parts[0]
              path = parts[1] if len(parts)>1 else ''
              if sha in seen:
                  continue
              seen.add(sha)
              if path and not (path.lower().endswith(('.html','.htm')) or 'data-search' in path.lower() or 'aoi' in path.lower()):
                  continue
              kind = subprocess.run(['git','cat-file','-t',sha],text=True,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
              if kind.returncode or kind.stdout.strip()!='blob':
                  continue
              size = int(subprocess.run(['git','cat-file','-s',sha],check=True,text=True,stdout=subprocess.PIPE).stdout)
              if size>2_500_000:
                  continue
              raw = subprocess.run(['git','cat-file','-p',sha],check=True,stdout=subprocess.PIPE).stdout
              try:
                  html = raw.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              if '<!doctype html' not in html[:1000].lower():
                  continue
              if 'AOI is part of Search' not in html or 'Regional Projects' not in html:
                  continue
              for tag, block_id in REMOVE:
                  html = re.sub(rf'\s*<{tag} id="{re.escape(block_id)}">.*?</{tag}>\s*','\n',html,flags=re.S)
              digest = hashlib.sha256(html.encode()).hexdigest()
              candidates.append((size,sha,path,html,digest))

          # Stable chronological-family order: smaller historical page first.
          candidates.sort(key=lambda item:(item[0],item[1]))
          manifest=[]
          for i,(source_size,blob,path,html,digest) in enumerate(candidates,1):
              html = html.replace('<title>DATA SEARCH</title>',f'<title>CANDIDATE {i} · DATA SEARCH</title>',1)
              out=pages/f'candidate-{i}.html'
              out.write_text(html,encoding='utf-8')
              manifest.append({
                'candidate':i,'blob':blob,'source_path':path,'source_bytes':source_size,
                'sha256_before_title':digest,'render_bytes':len(html.encode()),
                'clean_navigation':'CLEAN_NAVIGATION_FIX' in html,
                'rail_86':'--ds-rail-width:86px' in html,
                'account_workspace':'account-center-workspace-style' in html,
                'top_hide':'top-actions>:not(.v11-auth-actions)' in html,
                'navigation_layout_v3':'NAVIGATION_LAYOUT_V3' in html,
                'final_navigation_fix':'FINAL_NAVIGATION_FIX' in html,
                'restored_top_removed':'RESTORED_TOP_REMOVED' in html,
              })
          if not manifest:
              raise SystemExit('No screenshot-marker candidates found')
          Path('candidate-render/manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          Path('candidate-render/count.txt').write_text(str(len(manifest)),encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          PY

      - name: Render candidates in Chrome
        shell: bash
        run: |
          set -euo pipefail
          cd site/candidate-render
          python3 -m http.server 8765 >/tmp/candidate-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          count="$(cat count.txt)"
          for i in $(seq 1 "$count"); do
            "$chrome" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --window-size=1536,1024 \
              --virtual-time-budget=7000 \
              --screenshot="screenshots/candidate-${i}.png" \
              "http://127.0.0.1:8765/pages/candidate-${i}.html?render=2"
            test -s "screenshots/candidate-${i}.png"
          done
          ls -lh screenshots

      - name: Upload rendered candidates
        uses: actions/upload-artifact@v4
        with:
          name: data-search-candidate-screenshots
          path: |
            site/candidate-render/screenshots/*.png
            site/candidate-render/manifest.json
          retention-days: 3
