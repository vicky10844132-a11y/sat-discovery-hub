name: Restore exact screenshot DATA SEARCH

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/restore-screenshot-trigger.txt'

permissions:
  contents: write

jobs:
  restore-screenshot-version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout all repository history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
          path: site

      - name: Locate and reconstruct exact screenshot version
        shell: bash
        run: |
          set -euo pipefail
          cd site
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          EXPECTED = '8d72926e97e9ba7a6d9c0ec88878d87472c9e1bbeea057477c483217f7d3027c'
          REMOVE = [
              ('style', 'data-search-aoi-tool-replacement-style'),
              ('style', 'v14-separated-core-modules-style'),
              ('script', 'data-search-fixed-mode'),
              ('script', 'data-search-aoi-tool-replacement-script'),
              ('script', 'v14-separated-core-modules-script'),
          ]

          objects = subprocess.run(
              ['git', 'rev-list', '--objects', '--all'],
              check=True, text=True, stdout=subprocess.PIPE,
          ).stdout.splitlines()

          blobs = []
          seen = set()
          for line in objects:
              parts = line.split(' ', 1)
              sha = parts[0]
              path = parts[1] if len(parts) > 1 else ''
              if sha in seen:
                  continue
              seen.add(sha)
              if path and not (path.lower().endswith(('.html', '.htm')) or 'data-search' in path.lower() or 'aoi' in path.lower()):
                  continue
              kind = subprocess.run(
                  ['git', 'cat-file', '-t', sha], text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
              )
              if kind.returncode == 0 and kind.stdout.strip() == 'blob':
                  blobs.append((sha, path))

          found = None
          checked = 0
          marker_candidates = []
          for sha, path in blobs:
              size_text = subprocess.run(
                  ['git', 'cat-file', '-s', sha], check=True, text=True,
                  stdout=subprocess.PIPE,
              ).stdout.strip()
              if int(size_text) > 2_500_000:
                  continue
              raw = subprocess.run(
                  ['git', 'cat-file', '-p', sha], check=True,
                  stdout=subprocess.PIPE,
              ).stdout
              try:
                  html = raw.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              if '<!doctype html' not in html[:1000].lower():
                  continue
              checked += 1
              candidate = html
              for tag, block_id in REMOVE:
                  candidate = re.sub(
                      rf'\s*<{tag} id="{re.escape(block_id)}">.*?</{tag}>\s*',
                      '\n', candidate, flags=re.S,
                  )
              digest = hashlib.sha256(candidate.encode('utf-8')).hexdigest()
              if 'AOI is part of Search' in candidate and 'Regional Projects' in candidate:
                  marker_candidates.append((path, sha, digest, len(candidate.encode('utf-8'))))
              if digest == EXPECTED:
                  found = (sha, path, candidate)
                  break

          if not found:
              for item in marker_candidates[:30]:
                  print('MARKER_CANDIDATE path=%s blob=%s sha256=%s bytes=%s' % item)
              raise SystemExit(
                  f'Exact screenshot source not found after checking {checked} HTML blobs; '
                  f'{len(marker_candidates)} contained the screenshot text markers'
              )

          source_blob, source_path, candidate = found
          required = [
              'AOI is part of Search', 'Regional Projects',
              'data-tab="aoi"', 'data-tab="archive"', 'data-tab="monitoring"',
              'id="coordinateInput"', 'id="languageToggle"', 'data-panel="account"',
          ]
          missing = [item for item in required if item not in candidate]
          if missing:
              raise SystemExit('Screenshot version is missing: ' + ', '.join(missing))
          remaining = [block_id for _, block_id in REMOVE if block_id in candidate]
          if remaining:
              raise SystemExit('Later replacement blocks remain: ' + ', '.join(remaining))
          if 'dataSearchFrame' in candidate:
              raise SystemExit('Refusing to publish an iframe wrapper')

          output = Path('data-search-restored.html')
          output.write_text(candidate, encoding='utf-8')
          actual = hashlib.sha256(output.read_bytes()).hexdigest()
          if actual != EXPECTED:
              raise SystemExit('Final hash mismatch: ' + actual)

          print('SOURCE_BLOB=' + source_blob)
          print('SOURCE_PATH=' + source_path)
          print('SCREENSHOT_SHA256=' + actual)
          print('SCREENSHOT_BYTES=' + str(output.stat().st_size))
          PY

      - name: Publish only screenshot-matched page
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-search-restored.html
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          test "$changed" = 'data-search-restored.html'
          if git diff --cached --quiet; then
            echo 'Exact screenshot version is already published.'
            exit 0
          fi
          git commit -m 'Restore exact screenshot DATA SEARCH version'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
