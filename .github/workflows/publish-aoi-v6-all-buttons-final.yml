name: Publish AOI V6 all buttons final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aoi-v6-all-buttons-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout published branch and fetch main
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Reapply validated edit and measurement repair
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/fix-aoi-v6-edit-measure.yml > /tmp/edit-measure.yml
          python - <<'PY'
          from pathlib import Path
          w=Path('/tmp/edit-measure.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=w.index(marker)+len(marker)
          end=w.index("\n          PY\n\n      - name: Install Chromium test engine",start)
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in w[start:end].splitlines())
          exec(compile(script,'edit-measure-patch','exec'),{})
          PY

      - name: Replace obsolete shp-write ZIP wrapper
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('aoi-tool-full-v6.html')
          s=p.read_text(encoding='utf-8')
          old="if(type==='shp'){if(!window.shpwrite?.zip){toast('Shapefile helper unavailable','Use GeoJSON or the GIS package.',true);return}try{const fc=f.type==='FeatureCollection'?f:turf.featureCollection([f]),blob=await shpwrite.zip(fc,{outputType:'blob',folder:name,types:{polygon:'aoi'}});return download(name+'_SHP.zip',blob)}catch(e){toast('Shapefile export failed',e.message,true)}}"
          new="""if(type==='shp'){if(!window.shpwrite?.write||!window.JSZip){toast('Shapefile helper unavailable','Use GeoJSON or the GIS package.',true);return}try{const fc=f.type==='FeatureCollection'?f:turf.featureCollection([f]),parts=[];turf.flattenEach(fc,x=>{if(x.geometry?.type==='Polygon')parts.push(x)});if(!parts.length)throw new Error('The selected export contains no polygon geometry.');const zip=new JSZip(),folder=zip.folder(name);for(let i=0;i<parts.length;i++){const poly=parts[i],files=await new Promise((resolve,reject)=>shpwrite.write([poly.properties||{}],'POLYGON',[poly.geometry.coordinates],(err,out)=>err?reject(err):resolve(out))),base=parts.length>1?'aoi_'+(i+1):'aoi';folder.file(base+'.shp',files.shp.buffer,{binary:true});folder.file(base+'.shx',files.shx.buffer,{binary:true});folder.file(base+'.dbf',files.dbf.buffer||files.dbf,{binary:true});folder.file(base+'.prj',files.prj||'')}const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});return download(name+'_SHP.zip',blob,'application/zip')}catch(e){toast('Shapefile export failed',e.message||'Unable to create ZIP.',true)}}"""
          if old not in s: raise SystemExit('Original Shapefile block not found')
          s=s.replace(old,new,1)
          s=s.replace('<!-- AOI_FULL_V6_ALL_BUTTONS_VALIDATED -->','<!-- AOI_FULL_V6_ALL_BUTTONS_FINAL -->',1)
          p.write_text(s,encoding='utf-8')
          print('prepared',p.stat().st_size)
          PY

      - name: Install Chromium test engine
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Final complete critical-button validation
        run: |
          cat > validate.js <<'JS'
          const {chromium}=require('playwright');
          const assert=(x,m)=>{if(!x)throw new Error(m)};
          (async()=>{const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:1600,height:1000},acceptDownloads:true});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('dialog',d=>d.accept('DD'));await page.goto('http://127.0.0.1:8765/aoi-tool-full-v6.html',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.L&&window.turf&&document.querySelectorAll('.collection-row').length===2);await page.waitForTimeout(900);

          const handlerReport=await page.evaluate(()=>{const bs=[...document.querySelectorAll('button[onclick]')],invalid=bs.filter(b=>typeof b.onclick!=='function').length,missing=[];for(const b of bs){const m=(b.getAttribute('onclick')||'').match(/^\s*([A-Za-z_$][\w$]*)\s*\(/);if(m&&typeof window[m[1]]!=='function')missing.push(m[1])}return {count:bs.length,invalid,missing:[...new Set(missing)]}});assert(handlerReport.count>=35&&handlerReport.invalid===0&&!handlerReport.missing.length,'Handler report '+JSON.stringify(handlerReport));console.log('PASS button handlers',handlerReport.count);

          await page.getByRole('button',{name:'Load Demo'}).click();await page.waitForFunction(()=>document.querySelectorAll('.collection-row').length===2);console.log('PASS Load Demo');
          await page.getByRole('button',{name:'Settings'}).click();assert(await page.locator('#settingsModal.show').count()===1,'Settings failed');await page.locator('#settingsModal .close').click();await page.getByRole('button',{name:'Documentation'}).click();assert(await page.locator('#helpModal.show').count()===1,'Documentation failed');await page.locator('#helpModal .close').click();console.log('PASS top modals');
          for(const panel of ['build','rules','overlay','compare','export']){await page.locator(`.rail-btn[data-panel="${panel}"]`).click();assert(await page.locator(`#panel-${panel}.active`).count()===1,'Panel '+panel+' failed')}console.log('PASS navigation');

          await page.locator('.rail-btn[data-panel="build"]').click();await page.locator('.collection-name').first().click();await page.getByRole('button',{name:'Edit Active'}).click();await page.waitForTimeout(250);assert(await page.locator('.leaflet-editing-icon').count()>0,'Edit handles missing');const before=await page.evaluate(()=>JSON.stringify(state.features.A)),marker=page.locator('.leaflet-editing-icon').first(),b=await marker.boundingBox();await page.mouse.move(b.x+b.width/2,b.y+b.height/2);await page.mouse.down();await page.mouse.move(b.x+25,b.y+16,{steps:5});await page.mouse.up();await page.getByRole('button',{name:'Save Edit'}).click();await page.waitForTimeout(180);assert(await page.evaluate(()=>JSON.stringify(state.features.A))!==before,'Edit save failed');console.log('PASS Edit Active');

          const rows0=await page.locator('.collection-row').count(),geom0=await page.evaluate(()=>JSON.stringify(state.features.A));await page.locator('button[title="Measure distance"]').click();await page.evaluate(()=>map.fire(L.Draw.Event.CREATED,{layer:L.polyline([[1.30,103.78],[1.32,103.82]])}));await page.waitForTimeout(130);assert(await page.locator('.collection-row').count()===rows0&&await page.evaluate(()=>JSON.stringify(state.features.A))===geom0,'Distance affected AOI');await page.locator('button[title="Measure area"]').click();await page.evaluate(()=>map.fire(L.Draw.Event.CREATED,{layer:L.polygon([[1.30,103.78],[1.30,103.82],[1.34,103.82]])}));await page.waitForTimeout(130);assert(await page.locator('.collection-row').count()===rows0&&await page.evaluate(()=>JSON.stringify(state.features.A))===geom0,'Area affected AOI');console.log('PASS measurement isolation');

          await page.locator('.rail-btn[data-panel="overlay"]').click();for(const call of ["runOverlay('union')","runOverlay('intersection')","runOverlay('a-b')","runOverlay('b-a')","runOverlay('xor')","runOverlay('split')"]){await page.locator(`button[onclick="${call}"]`).click();await page.waitForTimeout(100)}console.log('PASS overlay buttons');
          for(const call of ["runGeometry('buffer')","runGeometry('simplify')","runGeometry('hull')","runGeometry('bbox')","runGeometry('oriented')","runGeometry('repair')","runGeometry('remove-holes')","runGeometry('explode')"]){await page.locator(`button[onclick="${call}"]`).click();await page.waitForTimeout(100)}console.log('PASS geometry buttons');

          await page.locator('.rail-btn[data-panel="rules"]').click();await page.locator('#minArea').fill('2000');await page.locator('#minWidth').fill('40');await page.getByRole('button',{name:'Adjust Boundary'}).click();await page.waitForTimeout(200);await page.locator('.rail-btn[data-panel="compare"]').click();for(const label of ['Show Added Area','Show Removed Area','Show Overlap','Clear Difference Layers'])await page.getByRole('button',{name:label}).click();console.log('PASS adjustment and comparison');

          await page.waitForTimeout(700);const z0=await page.evaluate(()=>map.getZoom());await page.locator('button[title="Zoom in"]').click();await page.waitForTimeout(700);const z1=await page.evaluate(()=>map.getZoom());assert(z1>z0,'Zoom in failed');await page.locator('button[title="Zoom out"]').click();await page.waitForTimeout(700);assert(await page.evaluate(()=>map.getZoom())<z1,'Zoom out failed');await page.locator('#edgeLengthToggle').click();await page.locator('#edgeLengthToggle').click();await page.locator('button[title="Switch basemap"]').click();await page.locator('button[title="Fit active AOI"]').click();console.log('PASS map controls');

          await page.evaluate(()=>{if(!state.features.original)state.features.original=turf.clone(state.features.A);if(!state.features.adjusted)state.features.adjusted=turf.transformTranslate(state.features.A,2,90,{units:'kilometers'});renderLayer('original');renderLayer('adjusted');refreshAll()});await page.locator('.rail-btn[data-panel="export"]').click();const cases=[["exportData('geojson')",'.geojson'],["exportData('kml')",'.kml'],["exportData('kmz')",'.kmz'],["exportData('wkt')",'.wkt'],["exportData('csv')",'.csv'],["exportData('shp')",'.zip'],["exportData('package')",'.zip'],['exportComparisonReport()','.html']];for(const [call,ext] of cases){const dl=page.waitForEvent('download',{timeout:15000});await page.locator(`button[onclick="${call}"]`).click();const d=await dl,f=d.suggestedFilename();assert(f.toLowerCase().endsWith(ext),call+' => '+f);console.log('PASS export',f)}
          assert(!errors.length,'Page errors: '+errors.join(' | '));console.log('AOI_V6_ALL_CRITICAL_BUTTONS_PASS');await browser.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8765 >/tmp/final-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          sleep 2
          node validate.js

      - name: Publish validated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aoi-tool-full-v6.html
          git commit -m 'Publish AOI V6 with all button repairs validated'
          git push origin gh-pages
