<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DATA SEARCH · AOI Item 1 Test</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e9eef5}
#dataSearchFrame{display:block;width:100%;height:100%;border:0;background:#e9eef5}
</style>
</head>
<body>
<iframe id="dataSearchFrame" src="https://raw.githack.com/vicky10844132-a11y/sat-discovery-hub/35144f6c0ec4c20fe187c518db485af6d7d0e91a/data-search-restored.html" title="DATA SEARCH"></iframe>
<script>
(function(){
  'use strict';
  var frame=document.getElementById('dataSearchFrame');

  function install(){
    var win=frame.contentWindow;
    var doc=frame.contentDocument;
    if(!win||!doc||!doc.documentElement)return;
    var applying=false;

    function makeAoiButton(){
      var button=doc.createElement('button');
      button.type='button';
      button.className='rail-btn item1-aoi-fixed';
      button.setAttribute('data-panel','aoi');
      button.setAttribute('title','AOI Center');
      button.innerHTML='<svg class="ds-icon" viewBox="0 0 24 24"><path d="M4 7l5-3 5 3 6-2v12l-6 3-5-3-5 2z"></path><path d="M9 4v13M14 7v13"></path></svg><span class="tip">AOI Center</span>';
      return button;
    }

    function activateAoi(button){
      var app=doc.querySelector('.app');
      if(app)app.classList.remove('account-center-workspace','account-panel-active','account-mode');
      var mapstage=doc.querySelector('.mapstage');
      if(mapstage)mapstage.style.removeProperty('display');
      doc.querySelectorAll('.panel-view').forEach(function(panel){panel.classList.remove('active');});
      var panel=doc.getElementById('panel-aoi');
      if(panel)panel.classList.add('active');
      doc.querySelectorAll('.rail .rail-btn').forEach(function(item){item.classList.remove('active');});
      button.classList.add('active');
      if(win.map&&typeof win.map.invalidateSize==='function')win.setTimeout(function(){win.map.invalidateSize();},80);
    }

    function bind(button){
      if(button.getAttribute('data-item1-bound')==='1')return button;
      var clean=button.cloneNode(true);
      clean.classList.add('item1-aoi-fixed');
      clean.setAttribute('data-panel','aoi');
      clean.setAttribute('title','AOI Center');
      clean.setAttribute('data-item1-bound','1');
      button.replaceWith(clean);
      clean.addEventListener('click',function(event){
        event.preventDefault();
        event.stopImmediatePropagation();
        activateAoi(clean);
      },true);
      return clean;
    }

    function ensure(){
      if(applying)return;
      applying=true;
      try{
        var rail=doc.querySelector('.rail');
        if(!rail)return;
        var button=rail.querySelector('.rail-btn[data-panel="aoi"]');
        if(!button){button=makeAoiButton();rail.insertBefore(button,rail.firstElementChild);}
        button=bind(button);
        if(rail.firstElementChild!==button)rail.insertBefore(button,rail.firstElementChild);
        doc.querySelectorAll('#panel-search .tab[data-tab="aoi"]').forEach(function(tab){tab.remove();});
      }finally{applying=false;}
    }

    ensure();
    var first=doc.querySelector('.rail .rail-btn[data-panel="aoi"]');
    if(first)activateAoi(first);
    win.setTimeout(ensure,0);
    win.setTimeout(ensure,150);
    new win.MutationObserver(ensure).observe(doc.documentElement,{childList:true,subtree:true});
  }

  frame.addEventListener('load',install);
})();
</script>
</body>
</html>
