<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Ops Platform</title>
<style>
:root{--bg:#0c0d10;--panel:#15171c;--panel2:#1c1f25;--line:#30333b;--text:#f5f3f5;--muted:#8b8e98;--pink:#e34379;--pink2:#ff6b9d;--green:#70d49c;--amber:#e8c568;--red:#ff7272}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% 0,#2a1720 0,transparent 33%),var(--bg);color:var(--text);font:13px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:74px 236px minmax(0,1fr);min-height:100vh}.rail,.nav{background:#090a0d;border-right:1px solid #25272d}.rail{display:flex;flex-direction:column;align-items:center;padding:16px 10px}.logo{width:44px;height:44px;border:1px solid var(--pink);display:grid;place-items:center;color:var(--pink2);font-weight:900;letter-spacing:.06em}.rail .pulse{margin-top:auto;color:var(--green);font-size:9px}.nav{padding:24px 14px}.nav h3{font-size:9px;letter-spacing:.18em;color:#666a73;margin:0 0 14px 10px}.nav button{width:100%;border:0;border-left:2px solid transparent;background:transparent;color:#9599a4;text-align:left;padding:11px 12px;cursor:pointer;margin:2px 0}.nav button:hover,.nav button.on{color:#fff;border-left-color:var(--pink);background:linear-gradient(90deg,rgba(227,67,121,.16),transparent)}main{padding:24px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:1px solid var(--line);padding-bottom:16px}.eyebrow{color:#777b85;font-size:9px;letter-spacing:.18em}.top h1{font-size:28px;margin:6px 0 0}.status{font-size:10px;color:var(--muted)}.status b{color:var(--green)}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0}.metric{background:var(--panel);border:1px solid var(--line);padding:13px}.metric b{font-size:22px}.metric span{display:block;color:#787c86;font-size:9px;text-transform:uppercase;margin-top:4px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(290px,.8fr);gap:14px}.panel{background:var(--panel);border:1px solid var(--line);padding:16px}.panel h2{font-size:12px;margin:0 0 14px}.panel h3{font-size:10px;color:#8b8e98;text-transform:uppercase;letter-spacing:.12em}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form{display:grid;gap:9px}label{display:block;color:#7e828c;font-size:9px;text-transform:uppercase;margin-bottom:4px}input,select,textarea{width:100%;border:1px solid #383b44;background:#0f1115;color:#eee;padding:9px;outline:none}textarea{min-height:78px;resize:vertical}.action{border:0;background:var(--pink);color:#fff;font-weight:800;padding:10px 13px;cursor:pointer}.action.secondary{background:#252831;border:1px solid #40434d}.action:disabled{opacity:.5;cursor:not-allowed}.out{white-space:pre-wrap;background:#0e1014;border:1px solid #2d3037;padding:11px;min-height:110px;color:#c4c7cf;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}.map{height:390px;position:relative;overflow:hidden;background:radial-gradient(circle at center,#30333a 0 16%,#24272e 17% 29%,#0d0f12 30%)}.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:28px 28px}.earth{position:absolute;left:50%;top:50%;width:230px;height:230px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 38% 32%,#5a5d66,#2a2d34 58%,#101216);border:1px solid #4d5058}.orbit{position:absolute;left:50%;top:50%;width:470px;height:170px;border:1px solid rgba(227,67,121,.5);border-radius:50%;transform:translate(-50%,-50%) rotate(-15deg)}.sat{position:absolute;width:8px;height:8px;background:var(--pink2);transform:rotate(45deg);box-shadow:0 0 14px var(--pink2)}.s1{left:69%;top:34%}.s2{left:31%;top:63%}.s3{left:57%;top:68%}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:8px;border-top:1px solid #2f3239;text-align:left}th{color:#777b85;font-weight:600}.tag{font-size:9px;color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.cards{display:grid;gap:8px}.mini{border:1px solid #2e3138;background:#111318;padding:10px}.mini b{display:block}.mini small{color:#858994}.hidden{display:none}.api-note{font-size:10px;color:#80848d;margin-top:8px}.api-note strong{color:var(--green)}@media(max-width:1100px){.app{grid-template-columns:64px 1fr}.nav{display:none}.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.rail{display:none}.app{grid-template-columns:1fr}main{padding:14px}.metrics{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="rail"><div class="logo">SO</div><div class="pulse">● API</div></aside>
<aside class="nav"><h3>OPERATIONS</h3><div id="nav"></div></aside>
<main>
<header class="top"><div><div class="eyebrow">SPACE INTELLIGENCE / AUTONOMOUS MISSION OPERATIONS</div><h1 id="title">Global Operations</h1></div><div class="status"><b id="apiState">CONNECTING</b><br><span id="clock"></span></div></header>
<section class="metrics" id="metrics"></section>
<section class="layout"><article class="panel" id="primary"></article><aside class="panel" id="secondary"></aside></section>
</main></div>
<script>
const API='/api';
const views={ops:'Global Operations',fleet:'Satellite Fleet',mission:'Mission Planning',ground:'Ground Network',intel:'Data & Intelligence',engineering:'Engineering Lab',opscenter:'Ops Center'};
const state={summary:null,satellites:[],stations:[],passes:[],modules:[],alerts:[]};
const nav=document.getElementById('nav');
nav.innerHTML=Object.entries(views).map(([k,v],i)=>`<button data-v="${k}" class="${i===0?'on':''}">${v}</button>`).join('');
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
function tick(){document.getElementById('clock').textContent=new Date().toLocaleString(undefined,{hour12:false})}tick();setInterval(tick,1000);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function table(headers,rows){return `<table><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`}
async function api(path,opts={}){const res=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});if(!res.ok){let msg=`HTTP ${res.status}`;try{const j=await res.json();msg=j.detail||JSON.stringify(j)}catch{}throw new Error(msg)}return res.json()}
async function bootstrap(){try{const [health,summary,sats,stations,mods,alerts]=await Promise.all([api('/health'),api('/v1/operations/summary'),api('/v1/assets/satellites'),api('/v1/assets/ground-stations'),api('/v1/system/modules'),api('/v1/alerts')]);state.summary=summary;state.satellites=sats;state.stations=stations;state.modules=mods.modules;state.alerts=alerts.alerts;document.getElementById('apiState').textContent='LIVE API · '+health.version;document.getElementById('apiState').className='';renderMetrics();render(current)}catch(e){document.getElementById('apiState').textContent='API OFFLINE';document.getElementById('apiState').className='bad';renderMetrics();render(current)}}
function renderMetrics(){const s=state.summary||{tracked_satellites:'—',ground_stations:'—',active_missions:'—',live_downlinks:'—',upcoming_passes:'—'};const data=[[s.tracked_satellites,'Tracked Satellites'],[s.ground_stations,'Ground Stations'],[s.active_missions,'Active Missions'],[s.live_downlinks,'Live Downlinks'],[s.upcoming_passes,'Upcoming Passes']];document.getElementById('metrics').innerHTML=data.map(([v,l])=>`<div class="metric"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}
let current='ops';function setView(v){current=v;document.getElementById('title').textContent=views[v];nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render(v)}
function render(v){const p=document.getElementById('primary'),s=document.getElementById('secondary');if(v==='ops'){p.innerHTML=`<h2>Digital Space Twin</h2><div class="map"><div class="earth"></div><div class="orbit"></div><i class="sat s1"></i><i class="sat s2"></i><i class="sat s3"></i></div>`;s.innerHTML=`<h2>Mission Copilot</h2><div class="form"><textarea id="coprompt">Monitor Singapore port in the next 24 hours with imagery under 1 m and cloud under 20%.</textarea><button class="action" onclick="copilotPlan()">PLAN MISSION</button><div class="out" id="coout">Ready to call mission API.</div></div><div class="api-note">Backend: <strong>/api/v1/missions/plan</strong></div>`}
if(v==='fleet'){p.innerHTML=`<h2>Satellite Fleet</h2><div class="grid2"><input id="satq" placeholder="Search ID"><select id="sensor"><option value="any">All sensors</option><option value="optical">Optical</option><option value="sar">SAR</option></select></div><button class="action secondary" style="margin-top:9px" onclick="filterFleet()">FILTER</button><div id="fleetout" style="margin-top:12px"></div>`;s.innerHTML=`<h2>Ground Network Assets</h2><div id="stationout"></div>`;filterFleet();renderStations()}
if(v==='mission'){p.innerHTML=`<h2>Mission Planning</h2><div class="form"><div class="grid2"><div><label>Mission</label><input id="mname" value="Singapore Port Watch"></div><div><label>Sensor</label><select id="msensor"><option value="any">Any</option><option value="optical">Optical</option><option value="sar">SAR</option></select></div></div><div class="grid2"><div><label>Latitude</label><input id="mlat" type="number" value="1.264"></div><div><label>Longitude</label><input id="mlon" type="number" value="103.84"></div></div><div class="grid2"><div><label>Max cloud %</label><input id="mcloud" type="number" value="20"></div><div><label>Max resolution m</label><input id="mres" type="number" step="0.1" value="1"></div></div><button class="action" onclick="planMission()">GENERATE PLAN</button><div class="out" id="planout">Awaiting constraints.</div></div>`;s.innerHTML=`<h2>Candidate Ranking</h2><div id="rankout" class="out">No plan yet.</div>`}
if(v==='ground'){p.innerHTML=`<h2>Pass Prediction</h2><div class="form"><div class="grid2"><select id="psat">${state.satellites.map(x=>`<option>${esc(x.id)}</option>`).join('')}</select><select id="pgs">${state.stations.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} · ${esc(x.id)}</option>`).join('')}</select></div><button class="action" onclick="predictPasses()">PREDICT PASSES</button><div id="passout" class="out">Ready.</div></div>`;s.innerHTML=`<h2>Ground Scheduler</h2><div class="form"><label>Start time</label><input id="schedtime" type="datetime-local"><button class="action secondary" onclick="scheduleBest()">SCHEDULE SELECTED PASS</button><div id="schedout" class="out">Predict a pass first.</div></div>`}
if(v==='intel'){p.innerHTML=`<h2>Weather / Maritime / EO</h2><div class="form"><div class="grid2"><div><label>Latitude</label><input id="ilat" value="1.264"></div><div><label>Longitude</label><input id="ilon" value="103.84"></div></div><div class="grid2"><button class="action" onclick="weather()">WEATHER</button><button class="action" onclick="maritime()">AIS / MARITIME</button></div><button class="action secondary" onclick="eoSearch()">EO CATALOG SEARCH</button><div id="intelout" class="out">Choose a live API query.</div></div>`;s.innerHTML=`<h2>Provider Modes</h2><div class="cards">${state.modules.map(m=>`<div class="mini"><b>${esc(m.id)}</b><small>${esc(m.mode)} · ${m.ready?'READY':'OFFLINE'}</small></div>`).join('')}</div>`}
if(v==='engineering'){p.innerHTML=`<h2>Orbit / Link Engineering</h2><div class="form"><h3>Link budget</h3><div class="grid2"><div><label>Frequency GHz</label><input id="freq" value="8.2"></div><div><label>Range km</label><input id="range" value="1200"></div></div><div class="grid2"><div><label>TX power dBW</label><input id="txp" value="13"></div><div><label>TX gain dBi</label><input id="txg" value="18"></div></div><div class="grid2"><div><label>RX gain dBi</label><input id="rxg" value="42"></div><div><label>Other losses dB</label><input id="loss" value="2"></div></div><button class="action" onclick="linkBudget()">CALCULATE</button><div id="engout" class="out">Ready.</div></div>`;s.innerHTML=`<h2>Orbit Engine</h2><button class="action secondary" onclick="orbitDemo()">RUN SGP4 DEMO</button><div id="orbitout" class="out" style="margin-top:9px">SGP4 endpoint ready.</div>`}
if(v==='opscenter'){p.innerHTML=`<h2>Operations Center</h2>${table(['Severity','Code','Event'],state.alerts.map(a=>[`<span class="${a.severity==='warning'?'warn':''}">${esc(a.severity.toUpperCase())}</span>`,esc(a.code),esc(a.message)]))}`;s.innerHTML=`<h2>System Health</h2><div class="cards">${state.modules.map(m=>`<div class="mini"><b>${esc(m.id)}</b><small class="${m.ready?'tag':'bad'}">${m.ready?'READY':'OFFLINE'} · ${esc(m.mode)}</small></div>`).join('')}</div>`}}
function filterFleet(){const q=(document.getElementById('satq')?.value||'').toUpperCase(),sensor=document.getElementById('sensor')?.value||'any';const rows=state.satellites.filter(x=>(!q||x.id.includes(q))&&(sensor==='any'||x.sensor===sensor));document.getElementById('fleetout').innerHTML=table(['ID','Sensor','Resolution','Status'],rows.map(x=>[esc(x.id),esc(x.sensor),esc(x.resolution_m)+' m',`<span class="tag">${esc(x.status)}</span>`]))}
function renderStations(){document.getElementById('stationout').innerHTML=table(['Station','Bands','Status'],state.stations.map(x=>[esc(x.name),esc(x.bands.join('/')),`<span class="tag">${esc(x.status)}</span>`]))}
async function planMission(){const out=document.getElementById('planout'),rank=document.getElementById('rankout');out.textContent='Calling mission planner…';try{const body={name:mname.value,aoi:{name:mname.value,lat:+mlat.value,lon:+mlon.value,radius_km:50},sensor:msensor.value,max_cloud_pct:+mcloud.value,max_resolution_m:+mres.value,priority:3};const r=await api('/v1/missions/plan',{method:'POST',body:JSON.stringify(body)});out.textContent=JSON.stringify({status:r.status,candidate_count:r.candidate_count,recommended:r.recommended},null,2);rank.innerHTML=r.candidates.length?table(['Satellite','Sensor','Resolution','Cloud','Score'],r.candidates.map(x=>[esc(x.satellite_id),esc(x.sensor),esc(x.resolution_m)+' m',esc(x.cloud_pct??'N/A'),esc(x.score)])):'No feasible candidates'}catch(e){out.textContent='ERROR · '+e.message}}
async function copilotPlan(){const out=document.getElementById('coout');out.textContent='Resolving objective through mission API…';try{const r=await api('/v1/missions/plan',{method:'POST',body:JSON.stringify({name:'Copilot Objective',aoi:{name:'Singapore Port',lat:1.264,lon:103.84,radius_km:70},sensor:'any',max_cloud_pct:20,max_resolution_m:1,priority:1})});out.textContent=`OBJECTIVE ACCEPTED\nCandidates: ${r.candidate_count}\nRecommended: ${r.recommended?.satellite_id||'none'}\nGround station: ${r.recommended?.ground_station_id||'—'}\nScore: ${r.recommended?.score||'—'}`}catch(e){out.textContent='ERROR · '+e.message}}
async function predictPasses(){const out=document.getElementById('passout');out.textContent='Computing pass windows…';try{const r=await api('/v1/passes/predict',{method:'POST',body:JSON.stringify({satellite_id:psat.value,ground_station_id:pgs.value,min_elevation_deg:10,horizon_hours:24})});state.passes=r.passes;out.innerHTML=table(['AOS','LOS','Max El'],r.passes.map(x=>[new Date(x.aos).toLocaleTimeString(),new Date(x.los).toLocaleTimeString(),esc(x.max_elevation_deg)+'°']));if(r.passes[0]){const d=new Date(r.passes[0].aos);schedtime.value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}}catch(e){out.textContent='ERROR · '+e.message}}
async function scheduleBest(){const out=document.getElementById('schedout');if(!state.passes.length){out.textContent='Predict a pass first.';return}try{const x=state.passes[0],start=new Date(schedtime.value).toISOString();const r=await api('/v1/ground-network/schedule',{method:'POST',body:JSON.stringify({satellite_id:x.satellite_id,ground_station_id:x.ground_station_id,start_time:start,duration_min:10,priority:3})});out.textContent=JSON.stringify(r,null,2)}catch(e){out.textContent='ERROR · '+e.message}}
async function weather(){const out=intelout;out.textContent='Checking weather…';try{const r=await api('/v1/weather/check',{method:'POST',body:JSON.stringify({lat:+ilat.value,lon:+ilon.value,hours:24})});out.textContent=JSON.stringify(r,null,2)}catch(e){out.textContent='ERROR · '+e.message}}
async function maritime(){const out=intelout;out.textContent='Searching maritime feed…';try{const r=await api('/v1/maritime/search',{method:'POST',body:JSON.stringify({lat:+ilat.value,lon:+ilon.value,radius_km:100})});out.textContent=JSON.stringify(r,null,2)}catch(e){out.textContent='ERROR · '+e.message}}
async function eoSearch(){const out=intelout;out.textContent='Searching EO catalog…';try{const r=await api('/v1/eo/search',{method:'POST',body:JSON.stringify({aoi:{name:'Query AOI',lat:+ilat.value,lon:+ilon.value,radius_km:50},sensor:'any',max_resolution_m:1,max_cloud_pct:20})});out.textContent=JSON.stringify(r,null,2)}catch(e){out.textContent='ERROR · '+e.message}}
async function linkBudget(){const out=engout;out.textContent='Calculating…';try{const r=await api('/v1/link-budget',{method:'POST',body:JSON.stringify({frequency_ghz:+freq.value,range_km:+range.value,tx_power_dbw:+txp.value,tx_gain_dbi:+txg.value,rx_gain_dbi:+rxg.value,other_losses_db:+loss.value})});out.textContent=JSON.stringify(r,null,2)}catch(e){out.textContent='ERROR · '+e.message}}
async function orbitDemo(){const out=orbitout;out.textContent='Running SGP4 propagation…';try{const r=await api('/v1/orbit/demo');out.textContent=`Satellite: ${r.satellite}\nPoints: ${r.points.length}\nFirst point:\n${JSON.stringify(r.points[0],null,2)}`}catch(e){out.textContent='ERROR · '+e.message}}
renderMetrics();render('ops');bootstrap();
</script>
</body></html>
