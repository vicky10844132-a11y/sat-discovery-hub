<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Ops Console</title><style>:root{--bg:#0e0f11;--p:#17181c;--p2:#202127;--l:#34353b;--t:#f4f1f4;--m:#909199;--r:#e14579;--r2:#ff6a9a;--g:#77d4a0;--a:#e9c86c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 72% 0,#261820,transparent 32%),var(--bg);color:var(--t);font:13px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:76px 250px 1fr;min-height:100vh}.rail,.menu{background:#0b0c0e;border-right:1px solid #2a2b30}.rail{padding:16px 10px;display:flex;flex-direction:column;align-items:center}.brand{width:44px;height:44px;border:1px solid var(--r);display:grid;place-items:center;font-weight:900;color:var(--r2)}.rail small{margin-top:auto;color:#73747b}.menu{padding:22px 14px}.menu h3{font-size:10px;color:#777;letter-spacing:.15em;margin:0 0 14px 10px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#9899a0;text-align:left;padding:11px 12px;cursor:pointer;border-left:2px solid transparent}.nav button.on,.nav button:hover{color:#fff;border-left-color:var(--r);background:linear-gradient(90deg,rgba(225,69,121,.15),transparent)}.main{padding:24px;min-width:0}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--l);padding-bottom:16px}.ey{font-size:10px;color:#777;letter-spacing:.18em}.top h1{margin:6px 0 0;font-size:28px}.status{font-size:10px;color:var(--g)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.card{background:var(--p);border:1px solid var(--l);padding:14px}.metric b{font-size:24px}.metric span{display:block;color:#7d7e85;font-size:9px;text-transform:uppercase;margin-top:4px}.workspace{margin-top:14px;display:grid;grid-template-columns:1.55fr .95fr;gap:14px}.panel{background:var(--p);border:1px solid var(--l);padding:16px}.panel h2{font-size:12px;margin:0 0 14px}.map{height:420px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 50%,#303138 0 17%,#222329 17.5% 28%,#101113 29% 100%)}.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:30px 30px}.earth{position:absolute;width:250px;height:250px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 42% 36%,#51525a,#292a30 58%,#131417 100%);border:1px solid #494a50}.orbit{position:absolute;left:50%;top:50%;width:470px;height:180px;border:1px solid rgba(225,69,121,.45);border-radius:50%;transform:translate(-50%,-50%) rotate(-16deg)}.dot{position:absolute;width:9px;height:9px;background:var(--r2);transform:rotate(45deg);box-shadow:0 0 12px var(--r2)}.d1{left:66%;top:32%}.d2{left:30%;top:60%}.d3{left:57%;top:68%}.forms{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:9px;color:#85868d;display:block;margin-bottom:4px;text-transform:uppercase}input,select,textarea{width:100%;background:#101114;border:1px solid #37383e;color:#eee;padding:9px;outline:none}textarea{min-height:72px;resize:vertical}button.action{background:var(--r);border:0;color:#fff;padding:10px 13px;font-weight:800;cursor:pointer}.out{background:#101114;border:1px solid #2d2e33;min-height:120px;padding:12px;font:11px ui-monospace,monospace;white-space:pre-wrap;color:#b9bac0}.table{width:100%;border-collapse:collapse;font-size:11px}.table td,.table th{padding:9px;border-top:1px solid #303136;text-align:left}.badge{font-size:9px;color:var(--g)}.warn{color:var(--a)}.demo{color:var(--r2);font-size:9px}.hidden{display:none}@media(max-width:1000px){.app{grid-template-columns:64px 1fr}.menu{display:none}.workspace{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.rail{display:none}.app{grid-template-columns:1fr}.main{padding:14px}.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><aside class="rail"><div class="brand">SO</div><small>LIVE</small></aside><aside class="menu"><h3>OPERATIONS</h3><div class="nav" id="nav"><button class="on" data-v="ops">Global Operations</button><button data-v="fleet">Satellite Fleet</button><button data-v="mission">Mission Planning</button><button data-v="ground">Ground Network</button><button data-v="intel">Data & Intelligence</button><button data-v="engineering">Engineering Lab</button><button data-v="opscenter">Ops Center</button></div></aside><main class="main"><header class="top"><div><div class="ey">SPACE INTELLIGENCE / AUTONOMOUS MISSION OPERATIONS</div><h1 id="title">Global Operations</h1></div><div class="status" id="clock"></div></header><section class="grid" id="metrics"><div class="card metric"><b>128</b><span>Tracked satellites</span></div><div class="card metric"><b>6</b><span>Ground stations</span></div><div class="card metric"><b>14</b><span>Active missions</span></div><div class="card metric"><b>21</b><span>Upcoming passes</span></div></section><section class="workspace"><article class="panel" id="primary"></article><aside class="panel" id="secondary"></aside></section></main></div><script>const views={ops:'Global Operations',fleet:'Satellite Fleet',mission:'Mission Planning',ground:'Ground Network',intel:'Data & Intelligence',engineering:'Engineering Lab',opscenter:'Ops Center'};const sats=[{id:'SAT-007',sensor:'Optical',res:.7,status:'Tasked',alt:505},{id:'SAT-018',sensor:'Optical',res:.5,status:'Nominal',alt:518},{id:'SAT-042',sensor:'SAR',res:1,status:'Nominal',alt:535},{id:'SAT-031',sensor:'Optical',res:.8,status:'Nominal',alt:512},{id:'SAT-055',sensor:'SAR',res:1.5,status:'Standby',alt:548}];const passes=[['SAT-018','Sweden','10:31','10:43',64],['SAT-042','Singapore','10:47','10:55',51],['SAT-007','Sweden','11:08','11:17',58],['SAT-031','Singapore','11:26','11:34',47]];const wx={Singapore:{cloud:18,wind:12,rain:22},Malacca:{cloud:34,wind:15,rain:35},Arctic:{cloud:62,wind:24,rain:8}};function tick(){clock.textContent=new Date().toLocaleString(undefined,{hour12:false})}tick();setInterval(tick,1000);function table(headers,rows){return '<table class="table"><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table>'}function setView(v){title.textContent=views[v];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render(v)}document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));function render(v){if(v==='ops'){primary.innerHTML='<h2>Digital Space Twin <span class="demo">DEMO DATA</span></h2><div class="map"><div class="earth"></div><div class="orbit"></div><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i></div>';secondary.innerHTML='<h2>Mission Copilot</h2><div class="forms"><textarea id="coprompt">Monitor Singapore port in the next 24 hours with imagery under 1m and cloud under 20%.</textarea><button class="action" onclick="copilot()">PLAN MISSION</button><div class="out" id="coout">Ready.</div></div>'}else if(v==='fleet'){primary.innerHTML='<h2>Satellite Fleet</h2><div class="row"><input id="satq" placeholder="Search satellite"><select id="sensor"><option>All</option><option>Optical</option><option>SAR</option></select></div><button class="action" style="margin-top:8px" onclick="filterFleet()">FILTER</button><div id="fleetout" style="margin-top:12px"></div>';secondary.innerHTML='<h2>Asset Inspector</h2><div class="out" id="assetout">Select/filter assets to inspect.</div>';filterFleet()}else if(v==='mission'){primary.innerHTML='<h2>Mission Planning</h2><div class="forms"><div class="row"><div><label>AOI name</label><input id="aoi" value="Singapore Port"></div><div><label>Priority</label><select id="priority"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div></div><div class="row"><div><label>Max cloud %</label><input id="cloud" type="number" value="20"></div><div><label>Max GSD m</label><input id="gsd" type="number" step="0.1" value="1"></div></div><button class="action" onclick="planMission()">GENERATE PLAN</button><div class="out" id="planout">Awaiting constraints.</div></div>';secondary.innerHTML='<h2>Candidate Ranking</h2><div id="rankout" class="out">No plan yet.</div>'}else if(v==='ground'){primary.innerHTML='<h2>Pass Prediction</h2>'+table(['Satellite','Station','AOS','LOS','Max El'],passes.map(p=>[p[0],p[1],p[2],p[3],p[4]+'°']))+'<button class="action" style="margin-top:12px" onclick="scheduleContact()">AUTO-SCHEDULE BEST CONTACT</button>';secondary.innerHTML='<h2>Ground Scheduler</h2><div class="out" id="gsout">Ready to schedule.</div>'}else if(v==='intel'){primary.innerHTML='<h2>Weather / AIS / EO</h2><div class="forms"><div class="row"><select id="region"><option>Singapore</option><option>Malacca</option><option>Arctic</option></select><select id="product"><option>Optical</option><option>SAR</option><option>AIS</option></select></div><button class="action" onclick="runIntel()">RUN INTELLIGENCE QUERY</button><div class="out" id="intelout">Ready.</div></div>';secondary.innerHTML='<h2>Provider Status</h2><div class="out">Weather: DEMO / connector ready\nAIS: DEMO / connector required\nEO catalog: DEMO / provider adapter ready\nTasking: workflow ready</div>'}else if(v==='engineering'){primary.innerHTML='<h2>Orbit / Link Engineering</h2><div class="forms"><div class="row"><div><label>Altitude km</label><input id="alt" value="520"></div><div><label>Frequency GHz</label><input id="freq" value="8.2"></div></div><div class="row"><div><label>TX Power W</label><input id="power" value="20"></div><div><label>Range km</label><input id="range" value="1200"></div></div><button class="action" onclick="engineering()">CALCULATE</button><div class="out" id="engout">Ready.</div></div>';secondary.innerHTML='<h2>Model Status</h2><div class="out">SGP4 engine: backend implemented\nPass geometry: implemented\nLink budget: interactive approximation\nPOD / force models: roadmap</div>'}else{primary.innerHTML='<h2>Operations Center</h2>'+table(['Severity','Event','State'],[['HIGH','GS-SE-01 antenna conflict','OPEN'],['MED','Cloud increase Singapore AOI','WATCH'],['LOW','SAT-055 standby > 8h','INFO']]);secondary.innerHTML='<h2>System Health</h2><div class="out">Orbit service      NOMINAL\nMission planner    NOMINAL\nGround scheduler   NOMINAL\nWeather adapter    DEMO\nAIS adapter        CONNECTOR REQUIRED\nEO adapter         DEMO\nAPI gateway        READY</div>'}}function filterFleet(){let q=(document.getElementById('satq')?.value||'').toUpperCase(),s=document.getElementById('sensor')?.value||'All';let r=sats.filter(x=>(!q||x.id.includes(q))&&(s==='All'||x.sensor===s));fleetout.innerHTML=table(['ID','Sensor','GSD','Alt','Status'],r.map(x=>['<a href="#" onclick="inspect(\''+x.id+'\');return false">'+x.id+'</a>',x.sensor,x.res+' m',x.alt+' km','<span class="badge">'+x.status+'</span>']))}function inspect(id){let x=sats.find(s=>s.id===id);assetout.textContent=JSON.stringify(x,null,2)}function planMission(){let maxc=+cloud.value,maxg=+gsd.value,a=aoi.value;let r=sats.filter(s=>s.res<=maxg).map((s,i)=>({sat:s.id,sensor:s.sensor,res:s.res,cloud:[12,18,25,8,42][i],score:Math.round(96-s.res*10-[12,18,25,8,42][i]*.5)})).filter(x=>x.cloud<=maxc).sort((a,b)=>b.score-a.score);planout.textContent=r.length?'PLAN READY — '+a+'\nCandidates: '+r.length+'\nRecommended: '+r[0].sat:'NO FEASIBLE PLAN';rankout.innerHTML=r.length?table(['Satellite','Sensor','GSD','Cloud','Score'],r.map(x=>[x.sat,x.sensor,x.res+' m',x.cloud+'%',x.score])):'No feasible candidate'}function scheduleContact(){let best=[...passes].sort((a,b)=>b[4]-a[4])[0];gsout.textContent='CONTACT RESERVED\nSatellite: '+best[0]+'\nStation: '+best[1]+'\nAOS: '+best[2]+'\nLOS: '+best[3]+'\nMax elevation: '+best[4]+'°\nConflict check: PASSED'}function runIntel(){let r=region.value,w=wx[r],p=product.value;intelout.textContent='REGION: '+r+'\nCloud: '+w.cloud+'%\nWind: '+w.wind+' kt\nRain probability: '+w.rain+'%\nQuery: '+p+'\nResults: '+(p==='AIS'?18:p==='SAR'?4:6)+' records\nStatus: DEMO DATA — adapter interface ready'}function engineering(){let f=+freq.value,r=+range.value,p=+power.value;let fspl=92.45+20*Math.log10(f)+20*Math.log10(r);let dbw=10*Math.log10(p);engout.textContent='Free-space path loss: '+fspl.toFixed(2)+' dB\nTX power: '+dbw.toFixed(2)+' dBW\nAltitude: '+alt.value+' km\nModel: engineering approximation'}function copilot(){let p=coprompt.value.toLowerCase();let maxg=p.includes('under 1m')?1:1.5,maxc=p.includes('20%')?20:40;let r=sats.filter(s=>s.res<=maxg);let best=r[0];coout.textContent='Objective accepted\nAOI resolved: Singapore Port\nConstraints: GSD ≤ '+maxg+' m, cloud ≤ '+maxc+'%\nCandidates: '+r.length+'\nRecommended: '+best.id+'\nImaging: 10:34\nDownlink: 10:47 Singapore\nStatus: PLAN READY'}render('ops');</script></body></html>
