<section id="home" class="page on"><header><div class="brand"><div class="logo">✦</div><div><b>星织界</b><small>STARWEAVE · A LIVING WORLD</small></div></div><button class="ghost" onclick="renameHero()">主角命名</button></header><div class="homegrid"><div class="stage"><div class="figure"><div class="halo"></div><div class="pack"></div><div class="head"></div><div class="visor"></div><div class="body"></div><div class="wing w1"></div><div class="wing w2"></div><div class="drone d1"></div><div class="drone d2"></div></div><div class="herotxt"><div class="eyebrow">原创主角 · 星图探索者</div><h1 id="heroName">初航</h1><p>读取空间纹理、绘制临时路径，并把发现转化为新的行动模块。这里没有固定英雄池，你玩的就是自己的主角。</p><div class="pills"><span>浮岛探索</span><span>AI伙伴</span><span>动态世界</span><span>自由构筑</span></div></div></div><div class="card"><small style="color:#83bcb5">WORLD ACTION</small><h2>浮岛群落 · 动态行动</h2><div class="map"><div class="island i1"></div><div class="island i2"></div><div class="island i3"></div><div class="bridge b1"></div><div class="bridge b2"></div><div class="bossdot"></div></div><div class="meta"><span>AI伙伴与生态敌群</span><span>世界会改变</span></div><button class="primary" onclick="start()">进入世界</button></div></div></section>
<section id="gamePage" class="page"><canvas id="c" width="1280" height="720"></canvas><div class="hudtop">连接值 <b id="score">0</b> · <span id="clock">00:00</span></div><div class="mini"><canvas id="mc" width="160" height="160"></canvas></div><div class="tools"><button onclick="recall()">返回营地</button><button onclick="leave()">退出</button></div><div class="stat"><div><b id="hn">初航</b> Lv.<span id="lv">1</span>　◈ <span id="gold">400</span></div><div class="bar"><i class="hp" id="hp"></i></div><div class="bar"><i class="energy" id="en"></i></div><div class="bar"><i class="xp" id="xp"></i></div></div><div class="companions"><div class="comp">芽团</div><div class="comp">航豆</div></div><div class="skills"><button onclick="q()"><b>Q</b><small>折跃线</small></button><button onclick="e()"><b>E</b><small>脉冲织构</small></button><button onclick="r()"><b>R</b><small>世界重写</small></button><button class="atk" onclick="attack()"><b>✦</b><small>发射</small></button></div><div id="mobile"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="ms"><button id="mq" class="mq"><b>Q</b></button><button id="me" class="me"><b>E</b></button><button id="mr" class="mr"><b>R</b></button><button id="ma" class="ma"><b>✦</b></button></div></div><div class="event" id="event">世界事件</div><div class="bossbar" id="bossbar"><div class="bossname">云脊兽 · 生态守门者</div><div class="track"><i id="bossfill"></i></div></div><div class="module" id="module"><h3>发现新模块 · 选择一种世界改造</h3><div class="choices"><button onclick="choose('dash')"><b>折跃回响</b><small>移动更快</small></button><button onclick="choose('pulse')"><b>脉冲扩散</b><small>范围伤害强化</small></button><button onclick="choose('friend')"><b>伙伴协同</b><small>伙伴与攻击强化</small></button></div></div><div class="result" id="result"><div class="resultbox"><h2 id="rt">连接完成</h2><p id="rp"></p><button class="primary" onclick="start()">再次进入</button><button class="ghost" onclick="leave()" style="margin-top:8px">返回首页</button></div></div></section>
<script>
const $=x=>document.getElementById(x),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),cl=(v,a,b)=>Math.max(a,Math.min(b,v));let name='初航';try{name=localStorage.swName||name}catch{}function renameHero(){let n=prompt('给你的主角起个名字',name);if(n&&n.trim()){name=n.trim().slice(0,8);try{localStorage.swName=name}catch{}$('heroName').textContent=name}}$('heroName').textContent=name;
let g=null,keys={},tx=0,ty=0,last=performance.now();const c=$('c'),x=c.getContext('2d'),mc=$('mc'),mx=mc.getContext('2d');addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function unit(x,y,t){return{x,y,t,r:11,hp:65,max:65,spd:48,atk:7,cd:0}}function start(){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$('gamePage').classList.add('on');$('result').classList.remove('show');$('module').classList.remove('show');g={run:1,time:0,wave:0,event:0,score:0,h:{x:130,y:610,r:18,hp:120,max:120,en:100,lv:1,xp:0,next:75,gold:400,atk:38,spd:270,q:0,e:0,r:0,buff:0,shot:0,module:0,pulse:1},ally:[],enemy:[],shots:[],boss:{x:645,y:355,r:35,hp:720,max:720,awake:0,alive:1,cd:0},core:{x:1170,y:90,r:42,hp:950,max:950}};for(let i=0;i<14;i++){g.ally.push(unit(170+i*9,590-i*5,'a'));g.enemy.push(unit(1080-i*9,120+i*5,'e'))}$('hn').textContent=name}
function leave(){g=null;document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$('home').classList.add('on')}
function event(t){$('event').textContent=t;$('event').classList.add('show');clearTimeout(event.t);event.t=setTimeout(()=>$('event').classList.remove('show'),3000)}
function recall(){if(!g)return;g.h.x=130;g.h.y=610;g.h.hp=g.h.max;g.h.en=100;event('返回营地 · 状态恢复')}
function target(){if(!g)return null;let a=g.enemy.filter(z=>z.hp>0);if(g.boss.awake&&g.boss.alive)a.push(g.boss);a.push(g.core);let best=null,bd=1e9;for(const z of a){let d=D(g.h,z);if(d<bd){bd=d;best=z}}return best}
function attack(){if(!g||!g.run||g.h.shot>0)return;let t=target();if(!t)return;let dx=t.x-g.h.x,dy=t.y-g.h.y,l=Math.hypot(dx,dy)||1;g.shots.push({x:g.h.x,y:g.h.y,vx:dx/l*650,vy:dy/l*650,life:1.3,dmg:g.h.atk*(g.h.buff?1.3:1)});g.h.shot=.28}
function q(){if(!g||g.h.q>0)return;let t=target(),dx=(t?t.x:g.h.x+100)-g.h.x,dy=(t?t.y:g.h.y)-g.h.y,l=Math.hypot(dx,dy)||1;g.h.x=cl(g.h.x+dx/l*140,20,1260);g.h.y=cl(g.h.y+dy/l*140,20,700);g.h.q=3.6}
function e(){if(!g||g.h.e>0||g.h.en<25)return;g.h.en-=25;for(const z of g.enemy)if(z.hp>0&&D(g.h,z)<150)z.hp-=55*g.h.pulse;if(g.boss.awake&&g.boss.alive&&D(g.h,g.boss)<160)g.boss.hp-=45*g.h.pulse;g.h.e=6}
function r(){if(!g||g.h.r>0||g.h.en<40)return;g.h.en-=40;g.h.buff=6;g.h.r=24;event('世界重写 · 行动速度与输出提升')}
function choose(k){if(!g)return;g.h.module=1;$('module').classList.remove('show');if(k==='dash')g.h.spd+=35;if(k==='pulse')g.h.pulse=1.35;if(k==='friend')g.h.atk+=12;event('新模块已写入主角')}
function ai(u,goal,dt){if(u.hp<=0)return;let dx=goal.x-u.x,dy=goal.y-u.y,l=Math.hypot(dx,dy)||1;if(l>35){u.x+=dx/l*u.spd*dt;u.y+=dy/l*u.spd*dt}else{u.cd-=dt;if(u.cd<=0){goal.hp-=u.atk;u.cd=.8}}}
function upd(dt){if(!g||!g.run)return;let h=g.h;g.time+=dt;h.q=Math.max(0,h.q-dt);h.e=Math.max(0,h.e-dt);h.r=Math.max(0,h.r-dt);h.buff=Math.max(0,h.buff-dt);h.shot-=dt;h.en=Math.min(100,h.en+8*dt);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+tx,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+ty,l=Math.hypot(dx,dy)||1;if(Math.abs(dx)+Math.abs(dy)>.02){h.x=cl(h.x+dx/l*h.spd*(h.buff?1.2:1)*dt,20,1260);h.y=cl(h.y+dy/l*h.spd*(h.buff?1.2:1)*dt,20,700)}if(keys[' '])attack();if(keys.q)q();if(keys.e)e();if(keys.r)r();
g.ally.forEach(z=>ai(z,g.core,dt));g.enemy.forEach(z=>ai(z,{x:110,y:630,hp:99999},dt));g.shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;let arr=g.enemy.concat(g.boss.awake&&g.boss.alive?[g.boss]:[],[g.core]);for(const z of arr)if(z.hp>0&&D(s,z)<(z.r||10)+7){z.hp-=s.dmg;s.life=0;break}});g.shots=g.shots.filter(s=>s.life>0);g.enemy=g.enemy.filter(z=>{if(z.hp<=0){g.score++;h.gold+=35;h.xp+=18;return 0}return 1});
while(h.xp>=h.next){h.xp-=h.next;h.lv++;h.next=Math.round(h.next*1.18);h.atk+=4;h.max+=10;h.hp=h.max;if(h.lv>=3&&!h.module)$('module').classList.add('show')}
if(g.event===0&&g.time>20){g.event=1;h.spd+=15;event('世界事件：浮桥生长 · 移动加速')}if(g.event===1&&g.time>45){g.event=2;event('世界事件：孢子雨 · 持续恢复');}if(g.event>=2)h.hp=Math.min(h.max,h.hp+1.6*dt);if(g.event===2&&g.time>70){g.event=3;g.boss.awake=1;event('世界事件：云脊兽苏醒');}
if(g.boss.awake&&g.boss.alive){$('bossbar').classList.add('show');$('bossfill').style.width=100*cl(g.boss.hp,0,g.boss.max)/g.boss.max+'%';if(D(h,g.boss)<95){g.boss.cd-=dt;if(g.boss.cd<=0){h.hp-=18;g.boss.cd=1.1}}if(g.boss.hp<=0){g.boss.alive=0;$('bossbar').classList.remove('show');h.gold+=500;h.atk+=10;h.spd+=10;event('生态共鸣 · 云脊兽成为你的世界记忆')}}if(g.core.hp<=0)finish(1);if(h.hp<=0){h.x=130;h.y=610;h.hp=h.max;h.en=100;event('伙伴将你带回营地')}hud()}
function finish(win){g.run=0;$('rt').textContent=win?'连接完成':'行动中断';$('rp').textContent=win?'浮岛核心重新连接。这个世界记住了你的选择。':'行动中断。重新构筑模块后可以再次进入。';$('result').classList.add('show')}
function hud(){let h=g.h;$('score').textContent=g.score;$('lv').textContent=h.lv;$('gold').textContent=Math.floor(h.gold);$('hp').style.width=100*h.hp/h.max+'%';$('en').style.width=h.en+'%';$('xp').style.width=100*h.xp/h.next+'%';$('clock').textContent=String(Math.floor(g.time/60)).padStart(2,'0')+':'+String(Math.floor(g.time%60)).padStart(2,'0')}
function draw(){x.clearRect(0,0,1280,720);x.fillStyle='#102e33';x.fillRect(0,0,1280,720);for(const I of [[230,555,260,130],[930,170,290,140],[645,360,185,115]]){x.fillStyle='#17463f';x.beginPath();x.ellipse(...I,0,0,7);x.fill()}x.strokeStyle='#79dec453';x.lineWidth=46;for(const L of [[[100,630],[645,360],[1180,90]],[[120,570],[470,390],[900,220],[1180,90]],[[120,650],[400,590],[780,470],[1180,90]]]){x.beginPath();x.moveTo(...L[0]);for(let i=1;i<L.length;i++)x.lineTo(...L[i]);x.stroke()}if(!g)return;let du=(z,c)=>{if(z.hp<=0)return;x.fillStyle=c;x.beginPath();x.arc(z.x,z.y,z.r,0,7);x.fill()};g.ally.forEach(z=>du(z,'#7cf0cf'));g.enemy.forEach(z=>du(z,'#ff917d'));x.fillStyle='#6fe6ca';x.beginPath();x.arc(g.h.x,g.h.y,18,0,7);x.fill();x.strokeStyle='#8be6ff';x.lineWidth=4;x.stroke();x.fillStyle='#ff8f79';x.beginPath();x.arc(g.core.x,g.core.y,g.core.r,0,7);x.fill();if(g.boss.awake&&g.boss.alive){x.fillStyle='#ffb27d';x.beginPath();x.arc(g.boss.x,g.boss.y,g.boss.r,0,7);x.fill();x.strokeStyle='#ffe18d';x.lineWidth=5;x.stroke()}for(const s of g.shots){x.fillStyle='#d7fff5';x.beginPath();x.arc(s.x,s.y,5,0,7);x.fill()}}
function minimap(){mx.clearRect(0,0,160,160);mx.fillStyle='#12363a';mx.fillRect(0,0,160,160);if(!g)return;mx.fillStyle='#7cf0cf';mx.beginPath();mx.arc(g.h.x/8,g.h.y/4.5,4,0,7);mx.fill();if(g.boss.awake&&g.boss.alive){mx.fillStyle='#ffb27d';mx.beginPath();mx.arc(g.boss.x/8,g.boss.y/4.5,4,0,7);mx.fill()}}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if($('gamePage').classList.contains('on'))upd(dt);draw();minimap();requestAnimationFrame(loop)}requestAnimationFrame(loop);
let jid=null,joy=$('joy'),stick=$('stick');function setJoy(t){let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=t.clientX-cx,dy=t.clientY-cy,m=40,l=Math.hypot(dx,dy)||1;if(l>m){dx=dx/l*m;dy=dy/l*m}tx=dx/m;ty=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`}function resetJoy(){tx=ty=0;jid=null;stick.style.transform='translate(0,0)'}joy.addEventListener('touchstart',e=>{e.preventDefault();let t=e.changedTouches[0];jid=t.identifier;setJoy(t)},{passive:false});joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===jid)setJoy(t)},{passive:false});joy.addEventListener('touchend',resetJoy,{passive:false});for(const [id,f] of [['ma',attack],['mq',q],['me',e],['mr',r]])$(id).addEventListener('touchstart',ev=>{ev.preventDefault();f()},{passive:false});
</script></body></html>
