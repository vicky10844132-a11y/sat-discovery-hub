<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function loadHero(){try{return JSON.parse(localStorage.getItem('yaojing10hero')||'null')}catch(e){return null}}
function storeHero(v){try{localStorage.setItem('yaojing10hero',JSON.stringify(v))}catch(e){}}
let hero=loadHero()||{name:'凌曜',style:'冷静 / 未来感',desc:'来自星轨观测站的少年守望者，以星能驱动双刃，在短距离内高速位移。',atk:38,spd:270,hp:120};
function show(id){['lobby','creator','battle'].forEach(x=>$(x).classList.toggle('active',x===id))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1500)}function applyHero(){$('heroName').textContent=hero.name;$('heroDesc').textContent=hero.desc;$('hudName').textContent=hero.name}function openCreator(){$('nameInput').value=hero.name;$('styleInput').value=hero.style;$('descInput').value=hero.desc;$('atkInput').value=hero.atk;$('spdInput').value=hero.spd;$('hpInput').value=hero.hp;syncCreator();show('creator')}function syncCreator(){$('pName').textContent=$('nameInput').value||'未命名';$('pStyle').textContent=$('styleInput').value;$('atkV').textContent=$('atkInput').value;$('spdV').textContent=$('spdInput').value;$('hpV').textContent=$('hpInput').value}['nameInput','styleInput','descInput','atkInput','spdInput','hpInput'].forEach(id=>$(id).addEventListener('input',syncCreator));function saveHero(){hero={name:$('nameInput').value.trim()||'凌曜',style:$('styleInput').value,desc:$('descInput').value.trim()||'星能英雄',atk:+$('atkInput').value,spd:+$('spdInput').value,hp:+$('hpInput').value};storeHero(hero);applyHero();toast('角色已保存');setTimeout(()=>show('lobby'),250)}applyHero();
const canvas=$('game'),ctx=canvas.getContext('2d'),mini=$('mini'),mctx=mini.getContext('2d');let g=null,last=performance.now(),keys={},mouse={x:800,y:300},touchX=0,touchY=0;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*1280/r.width;mouse.y=(e.clientY-r.top)*720/r.height});canvas.addEventListener('mousedown',()=>attackToward(mouse.x,mouse.y));
const lanes=[[{x:105,y:610},{x:320,y:520},{x:640,y:360},{x:960,y:180},{x:1170,y:90}],[{x:105,y:610},{x:360,y:480},{x:640,y:360},{x:920,y:240},{x:1170,y:90}],[{x:105,y:610},{x:300,y:590},{x:640,y:360},{x:980,y:130},{x:1170,y:90}]];
const items=[{id:'sword',name:'星铁长刃',cost:450,desc:'+12 攻击',atk:12},{id:'boots',name:'疾风靴',cost:380,desc:'+35 移速',spd:35},{id:'core',name:'生命核心',cost:520,desc:'+45 生命',hp:45},{id:'lens',name:'星能透镜',cost:620,desc:'+18 攻击 +10% 技能',atk:18,skill:0.10},{id:'guard',name:'守望甲',cost:700,desc:'+80 生命',hp:80},{id:'crown',name:'曜界王冠',cost:1100,desc:'+30 攻击 +50 生命',atk:30,hp:50}];
function mkMinion(team,lane,index){let p=team==='b'?lanes[lane][0]:lanes[lane][4];return{x:p.x+(Math.random()*12),y:p.y+(Math.random()*12),team,lane,index:team==='b'?1:3,r:9,hp:62,max:62,atk:7,atkT:0,spd:48,gold:36}}function mkHero(team,lane){let p=team==='b'?lanes[lane][0]:lanes[lane][4];return{x:p.x,y:p.y,team,lane,index:team==='b'?1:3,r:16,hp:145,max:145,atk:17,atkT:0,spd:70,respawn:0,gold:140}}
function startGame(){show('battle');$('result').classList.remove('show');$('shop').classList.remove('show');g={run:true,time:0,wave:0,bScore:0,rScore:0,msg:'',msgT:0,h:{x:115,y:625,r:18,hp:hero.hp,max:hero.hp,mana:100,maxMana:100,atk:hero.atk,spd:hero.spd,baseAtk:hero.atk,baseSpd:hero.spd,baseHp:hero.hp,lv:1,xp:0,next:80,gold:500,q:0,e:0,r:0,buff:0,shot:0,respawn:0,skillBonus:0,items:[]},allies:[mkHero('b',0),mkHero('b',1),mkHero('b',2),mkHero('b',1)],enemies:[mkHero('r',0),mkHero('r',1),mkHero('r',2),mkHero('r',1),mkHero('r',2)],minsB:[],minsR:[],shots:[],fx:[],towers:[{x:315,y:520,team:'b',lane:0,hp:360,max:360,r:18},{x:475,y:435,team:'b',lane:1,hp:360,max:360,r:18},{x:305,y:585,team:'b',lane:2,hp:360,max:360,r:18},{x:965,y:180,team:'r',lane:0,hp:360,max:360,r:18},{x:825,y:270,team:'r',lane:1,hp:360,max:360,r:18},{x:980,y:135,team:'r',lane:2,hp:360,max:360,r:18}],bases:[{x:90,y:650,team:'b',hp:1100,max:1100,r:42},{x:1190,y:70,team:'r',hp:1100,max:1100,r:42}],camps:[{x:520,y:235,hp:220,max:220,gold:120,alive:true},{x:760,y:500,hp:220,max:220,gold:120,alive:true}]};spawnWave();renderShop();updateHUD();toast('欢迎来到峡谷')}
function leaveGame(){g=null;show('lobby')}function spawnWave(){for(let lane=0;lane<3;lane++)for(let i=0;i<4;i++){g.minsB.push(mkMinion('b',lane,i));g.minsR.push(mkMinion('r',lane,i))}}function targets(team){let arr=team==='b'?g.minsR:g.minsB;arr=arr.concat(team==='b'?g.enemies:g.allies);if(team==='r'&&g.h.respawn<=0)arr=arr.concat([g.h]);return arr.filter(x=>x.hp>0)}function structs(team){return g.towers.filter(t=>t.team!==team&&t.hp>0).concat(g.bases.filter(b=>b.team!==team&&b.hp>0))}function nearest(u,list){let t=null,b=1e9;for(const x of list){const d=dist(u,x);if(d<b){b=d;t=x}}return[t,b]}
function movePath(u,dt){const path=lanes[u.lane];let target=path[u.index];if(!target)return;const d=dist(u,target);if(d<24){u.index+=u.team==='b'?1:-1;target=path[u.index]||target}const dx=target.x-u.x,dy=target.y-u.y,l=Math.hypot(dx,dy)||1;u.x+=dx/l*u.spd*dt;u.y+=dy/l*u.spd*dt}function ai(u,dt,isHero=false){if(u.hp<=0){if(isHero){u.respawn-=dt;if(u.respawn<=0){let p=u.team==='b'?lanes[u.lane][0]:lanes[u.lane][4];u.x=p.x;u.y=p.y;u.hp=u.max;u.index=u.team==='b'?1:3}}return}let[t,d]=nearest(u,targets(u.team));if(t&&d<145){const reach=(u.r||10)+(t.r||10)+12;if(d>reach){const dx=t.x-u.x,dy=t.y-u.y,l=Math.hypot(dx,dy)||1;u.x+=dx/l*u.spd*dt;u.y+=dy/l*u.spd*dt}else{u.atkT-=dt;if(u.atkT<=0){t.hp-=u.atk;u.atkT=isHero?.65:.82}}}else{let[s,sd]=nearest(u,structs(u.team));if(s&&sd<120){u.atkT-=dt;if(u.atkT<=0){s.hp-=u.atk;u.atkT=isHero?.72:.9}}else movePath(u,dt)}}
function playerTarget(){let arr=g.minsR.filter(x=>x.hp>0).concat(g.enemies.filter(x=>x.hp>0)).concat(g.towers.filter(x=>x.team==='r'&&x.hp>0));let[t]=nearest(g.h,arr);return t}function attackToward(x,y){if(!g||!g.run)return;let h=g.h;if(h.respawn>0||h.shot>0)return;let dx=x-h.x,dy=y-h.y,l=Math.hypot(dx,dy)||1;g.shots.push({x:h.x,y:h.y,vx:dx/l*650,vy:dy/l*650,life:1.3,dmg:h.atk*(h.buff>0?1.30:1),team:'b'});h.shot=.28}function attackNearest(){let t=playerTarget();if(t)attackToward(t.x,t.y)}function skillQ(){if(!g||!g.run)return;let h=g.h;if(h.q>0||h.respawn>0)return;let t=playerTarget(),tx=t?t.x:mouse.x,ty=t?t.y:mouse.y,dx=tx-h.x,dy=ty-h.y,l=Math.hypot(dx,dy)||1;h.x=clamp(h.x+dx/l*135,20,1260);h.y=clamp(h.y+dy/l*135,20,700);h.q=4;g.fx.push({x:h.x,y:h.y,r:15,max:65,life:.25,col:'#7bd8ff'})}function skillE(){if(!g||!g.run)return;let h=g.h;if(h.e>0||h.respawn>0||h.mana<25)return;h.mana-=25;let dmg=58*(1+h.skillBonus);for(const e of g.minsR)if(e.hp>0&&dist(h,e)<150)e.hp-=dmg;for(const e of g.enemies)if(e.hp>0&&dist(h,e)<150)e.hp-=dmg*.85;h.e=7;g.fx.push({x:h.x,y:h.y,r:20,max:165,life:.45,col:'#73cfff'})}function skillR(){if(!g||!g.run)return;let h=g.h;if(h.r>0||h.respawn>0||h.mana<40)return;h.mana-=40;h.buff=6;h.r=28;g.msg='曜界开启';g.msgT=1.2}
function recall(){if(!g||g.h.respawn>0)return;g.h.x=110;g.h.y=630;g.h.hp=g.h.max;g.h.mana=g.h.maxMana;toast('已回到泉水')}function toggleShop(){$('shop').classList.toggle('show')}function renderShop(){$('shopList').innerHTML=items.map(it=>`<div class="item"><div><b>${it.name}</b><small>${it.desc} · ${it.cost} 金币</small></div><button onclick="buyItem('${it.id}')">购买</button></div>`).join('')}function buyItem(id){if(!g)return;let h=g.h,it=items.find(x=>x.id===id);if(h.items.length>=6)return toast('装备栏已满');if(h.gold<it.cost)return toast('金币不足');if(dist(h,g.bases[0])>180)return toast('需要回到泉水购买');h.gold-=it.cost;h.items.push(it);recalc();updateHUD();toast('已购买 '+it.name)}function recalc(){let h=g.h;h.atk=h.baseAtk+h.items.reduce((s,i)=>s+(i.atk||0),0);h.spd=h.baseSpd+h.items.reduce((s,i)=>s+(i.spd||0),0);h.max=h.baseHp+h.items.reduce((s,i)=>s+(i.hp||0),0);h.skillBonus=h.items.reduce((s,i)=>s+(i.skill||0),0);h.hp=Math.min(h.hp,h.max)}function gainXP(x){let h=g.h;h.xp+=x;while(h.xp>=h.next){h.xp-=h.next;h.lv++;h.next=Math.round(h.next*1.2);h.baseAtk+=4;h.baseHp+=12;h.hp=h.max;recalc();g.msg='升级 Lv.'+h.lv;g.msgT=1}}function killPlayer(){let h=g.h;h.hp=0;h.respawn=4;g.rScore++;g.msg='你已被击败 · 4秒后复活';g.msgT=3}
function update(dt){if(!g||!g.run)return;let h=g.h;g.time+=dt;g.wave+=dt;if(g.wave>12){g.wave=0;spawnWave()}h.q=Math.max(0,h.q-dt);h.e=Math.max(0,h.e-dt);h.r=Math.max(0,h.r-dt);h.buff=Math.max(0,h.buff-dt);h.shot-=dt;h.mana=Math.min(h.maxMana,h.mana+8*dt);if(h.respawn>0){h.respawn-=dt;if(h.respawn<=0){h.x=110;h.y=630;h.hp=h.max;h.mana=h.maxMana}}else{let dx=((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0)+touchX,dy=((keys.s||keys.arrowdown)?1:0)-((keys.w||keys.arrowup)?1:0)+touchY,l=Math.hypot(dx,dy)||1,spd=h.spd*(h.buff>0?1.18:1);if(Math.abs(dx)+Math.abs(dy)>.02){h.x=clamp(h.x+dx/l*spd*dt,20,1260);h.y=clamp(h.y+dy/l*spd*dt,20,700)}if(keys[' '])attackNearest();if(keys.q)skillQ();if(keys.e)skillE();if(keys.r)skillR()}g.minsB.forEach(u=>ai(u,dt));g.minsR.forEach(u=>ai(u,dt));g.allies.forEach(u=>ai(u,dt,true));g.enemies.forEach(u=>ai(u,dt,true));g.shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.life<=0)return;let arr=g.minsR.concat(g.enemies).concat(g.towers.filter(t=>t.team==='r')).concat(g.bases.filter(b=>b.team==='r'));for(const t of arr){if(t.hp>0&&dist(s,t)<(t.r||10)+7){t.hp-=s.dmg;s.life=0;break}}});g.shots=g.shots.filter(s=>s.life>0);g.fx.forEach(e=>{e.life-=dt;e.r+=(e.max-e.r)*Math.min(1,dt*9)});g.fx=g.fx.filter(e=>e.life>0);g.minsR=g.minsR.filter(e=>{if(e.hp<=0){g.bScore++;h.gold+=e.gold;gainXP(18);return false}return true});g.minsB=g.minsB.filter(e=>{if(e.hp<=0){g.rScore++;return false}return true});for(const e of g.enemies)if(e.hp<=0&&e.respawn<=0){e.respawn=5;g.bScore+=3;h.gold+=e.gold;gainXP(55)};for(const a of g.allies)if(a.hp<=0&&a.respawn<=0){a.respawn=5;g.rScore+=3}if(h.hp<=0&&h.respawn<=0)killPlayer();for(const t of g.towers)if(t.hp<0)t.hp=0;for(const b of g.bases)if(b.hp<0)b.hp=0;if(g.bases[1].hp<=0)finish(true);else if(g.bases[0].hp<=0)finish(false);if(g.msgT>0){g.msgT-=dt;$('msg').textContent=g.msg}else $('msg').textContent='';updateHUD()}
function finish(win){g.run=false;$('resultTitle').textContent=win?'胜利':'失败';$('resultText').textContent=win?'敌方水晶已被摧毁。完整对局结束。':'我方水晶被摧毁。';$('result').classList.add('show')}function updateHUD(){if(!g)return;let h=g.h;$('bScore').textContent=g.bScore;$('rScore').textContent=g.rScore;$('lv').textContent=h.lv;$('gold').textContent=Math.floor(h.gold);$('hpFill').style.width=(100*clamp(h.hp,0,h.max)/h.max)+'%';$('manaFill').style.width=(100*h.mana/h.maxMana)+'%';$('xpFill').style.width=(100*h.xp/h.next)+'%';$('time').textContent=String(Math.floor(g.time/60)).padStart(2,'0')+':'+String(Math.floor(g.time%60)).padStart(2,'0');$('inv').innerHTML=[0,1,2,3,4,5].map(i=>`<div class="slot">${h.items[i]?h.items[i].name.slice(0,2):''}</div>`).join('')}
function drawPath(path){ctx.strokeStyle='#a7b19c55';ctx.lineWidth=50;ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);ctx.stroke();ctx.strokeStyle='#c5b79544';ctx.lineWidth=34;ctx.stroke()}function draw(){ctx.clearRect(0,0,1280,720);ctx.fillStyle='#173328';ctx.fillRect(0,0,1280,720);for(let i=0;i<40;i++){let x=(i*173)%1280,y=(i*97)%720;ctx.fillStyle=i%2?'#1f4531':'#153a29';ctx.beginPath();ctx.arc(x,y,28+(i%5)*8,0,7);ctx.fill()}ctx.strokeStyle='#2e7083';ctx.lineWidth=58;ctx.beginPath();ctx.moveTo(380,0);ctx.lineTo(900,720);ctx.stroke();lanes.forEach(drawPath);if(!g)return;for(const c of g.camps){if(!c.alive)continue;ctx.fillStyle='#b88549';ctx.beginPath();ctx.arc(c.x,c.y,24,0,7);ctx.fill()}for(const t of g.towers){if(t.hp<=0)continue;ctx.fillStyle=t.team==='b'?'#61b2ff':'#ff6d6d';ctx.fillRect(t.x-13,t.y-22,26,44);ctx.fillStyle='#0008';ctx.fillRect(t.x-22,t.y-34,44,5);ctx.fillStyle='#e2ca7f';ctx.fillRect(t.x-22,t.y-34,44*t.hp/t.max,5)}for(const b of g.bases){ctx.fillStyle=b.team==='b'?'#67b8ff':'#ff7070';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.strokeStyle='#f0d187';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#0008';ctx.fillRect(b.x-42,b.y-54,84,6);ctx.fillStyle='#ecd27f';ctx.fillRect(b.x-42,b.y-54,84*b.hp/b.max,6)}const du=(u,col)=>{if(u.hp<=0)return;ctx.fillStyle=col;ctx.beginPath();ctx.arc(u.x,u.y,u.r,0,7);ctx.fill();ctx.fillStyle='#0008';ctx.fillRect(u.x-14,u.y-18,28,4);ctx.fillStyle=col;ctx.fillRect(u.x-14,u.y-18,28*clamp(u.hp/u.max,0,1),4)};g.minsB.forEach(x=>du(x,'#78c1ff'));g.minsR.forEach(x=>du(x,'#ff8585'));g.allies.forEach(x=>du(x,'#70d4ff'));g.enemies.forEach(x=>du(x,'#ff6262'));if(g.h.respawn<=0){ctx.fillStyle=g.h.buff>0?'#e2a4ff':'#efd58b';ctx.beginPath();ctx.arc(g.h.x,g.h.y,g.h.r,0,7);ctx.fill();ctx.strokeStyle='#83d4ff';ctx.lineWidth=4;ctx.stroke()}for(const s of g.shots){ctx.fillStyle='#d8f5ff';ctx.beginPath();ctx.arc(s.x,s.y,5,0,7);ctx.fill()}for(const e of g.fx){ctx.strokeStyle=e.col;ctx.globalAlpha=clamp(e.life*2,0,1);ctx.lineWidth=5;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.stroke();ctx.globalAlpha=1}}
function drawMini(){mctx.clearRect(0,0,170,170);mctx.fillStyle='#153027';mctx.fillRect(0,0,170,170);mctx.strokeStyle='#477885';mctx.lineWidth=8;mctx.beginPath();mctx.moveTo(50,0);mctx.lineTo(120,170);mctx.stroke();const sx=170/1280,sy=170/720;if(!g)return;mctx.fillStyle='#62b4ff';g.minsB.forEach(a=>mctx.fillRect(a.x*sx-1,a.y*sy-1,3,3));mctx.fillStyle='#ff6969';g.minsR.forEach(e=>mctx.fillRect(e.x*sx-1,e.y*sy-1,3,3));if(g.h.respawn<=0){mctx.fillStyle='#f0d486';mctx.beginPath();mctx.arc(g.h.x*sx,g.h.y*sy,4,0,7);mctx.fill()}}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if($('battle').classList.contains('active'))update(dt);draw();drawMini();requestAnimationFrame(loop)}requestAnimationFrame(loop);
const joy=$('joy'),stick=$('stick');let joyId=null;function setJoy(t){let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=t.clientX-cx,dy=t.clientY-cy,max=42,l=Math.hypot(dx,dy)||1;if(l>max){dx=dx/l*max;dy=dy/l*max}touchX=dx/max;touchY=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}function resetJoy(){touchX=touchY=0;joyId=null;stick.style.transform='translate(0,0)'}joy.addEventListener('touchstart',e=>{e.preventDefault();let t=e.changedTouches[0];joyId=t.identifier;setJoy(t)},{passive:false});joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joyId)setJoy(t)},{passive:false});joy.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===joyId)resetJoy()},{passive:false});joy.addEventListener('touchcancel',resetJoy,{passive:false});function bind(id,fn){$(id).addEventListener('touchstart',e=>{e.preventDefault();fn()},{passive:false});$(id).addEventListener('click',e=>{e.preventDefault();fn()})}bind('mAtk',attackNearest);bind('mQ',skillQ);bind('mE',skillE);bind('mR',skillR);
