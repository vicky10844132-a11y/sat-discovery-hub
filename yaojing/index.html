<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>曜境 1.0</title><style>html,body{margin:0;width:100%;height:100%;background:#07111b;color:#e7c979;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;display:grid;place-items:center}.load{text-align:center}.dot{width:46px;height:46px;border-radius:50%;border:3px solid #e7c97933;border-top-color:#e7c979;margin:0 auto 14px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div class="dot"></div><div>正在进入曜境 1.0…</div></div><script>(async()=>{try{const ps=[0,1,2,3,4].map(i=>fetch('./v1/chunk'+i+'.txt?v=100').then(r=>{if(!r.ok)throw new Error('chunk '+i);return r.text()}));const parts=await Promise.all(ps);document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div style="padding:30px;text-align:center">加载失败，请刷新页面重试。</div>';console.error(e)}})();</script></body></html>
