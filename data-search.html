<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DATA SEARCH · V13</title><style>html,body{height:100%;margin:0;background:#0e173d;color:#fff;font-family:Arial,sans-serif}.loading{height:100%;display:grid;place-items:center}.box{text-align:center}.spinner{width:38px;height:38px;border:4px solid rgba(255,255,255,.22);border-top-color:#42d5e8;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{opacity:.72}</style></head><body><div class="loading"><div class="box"><div class="spinner"></div><strong>Loading DATA SEARCH V13…</strong><br><small>Static GitHub deployment</small></div></div><script>(async()=>{try{const files=['app00.gz.b64','app01.gz.b64','app02.gz.b64','app03.gz.b64'];const parts=await Promise.all(files.map(f=>fetch('./data-search-assets/'+f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div class="box"><strong>DATA SEARCH could not load.</strong><br><small>'+String(e)+'</small></div></div>'}})();</script></body></html>
