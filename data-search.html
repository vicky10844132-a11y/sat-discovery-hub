<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DATA SEARCH</title><style>html,body{height:100%;margin:0;background:#08122f;color:#fff;font-family:Arial,sans-serif}.loading{height:100%;display:grid;place-items:center}.box{text-align:center}.spinner{width:38px;height:38px;border:4px solid rgba(255,255,255,.22);border-top-color:#42d5e8;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{opacity:.72}</style></head><body><div class="loading"><div class="box"><div class="spinner"></div><strong>LOADING DATA SEARCH…</strong><br><small>Published static experience</small></div></div><script>(async()=>{try{const files=["app00.gz.b64","app01.gz.b64","app02.gz.b64","app03.gz.b64","app04.gz.b64"];const parts=await Promise.all(files.map(f=>fetch('./data-search-assets/'+f+'?v=eb936d6a745d',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));if(!('DecompressionStream' in window))throw new Error('Please use a current version of Chrome, Edge, Safari or Firefox.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div class="box"><strong>DATA SEARCH could not load.</strong><br><small>'+String(e)+'</small></div></div>'}})();</script></body></html>
